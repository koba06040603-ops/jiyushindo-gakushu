openapi: 3.0.3
info:
  title: 自由進度学習支援システム API
  description: |
    AI搭載の適応的学習支援システムのREST API仕様書
    
    ## 機能概要
    - **適応学習エンジン**: 学習スタイル自動検出とコンテンツ推奨
    - **学校管理**: 学校・クラス・生徒管理
    - **AI教師**: Socratic対話による学習支援
    - **進捗追跡**: リアルタイム学習進捗管理
    - **評価システム**: 3観点評価と非認知能力評価
    - **ゲーミフィケーション**: バッジ・ランキング・実績
    
    ## 認証方法
    このAPIは**JWT (JSON Web Token)** 認証を使用します。
    
    ### 認証フロー
    1. `/api/auth/login` でログイン → JWT取得
    2. 以降のリクエストで `Authorization: Bearer {token}` ヘッダーを付与
    3. トークン有効期限: 24時間
    
    ### ユーザーロール
    - `admin`: システム管理者（全権限）
    - `teacher`: 教師（クラス管理・評価）
    - `student`: 生徒（学習機能）
    - `parent`: 保護者（閲覧のみ）
    
  version: 1.0.0
  contact:
    name: API Support
    email: support@jiyushindo-gakushu.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://e8efc4f3.jiyushindo-gakushu.pages.dev
    description: 本番環境
  - url: http://localhost:3000
    description: ローカル開発環境

tags:
  - name: 認証
    description: ユーザー認証・認可
  - name: ヘルスチェック
    description: システム監視・ヘルスチェック
  - name: 適応学習
    description: 学習スタイル検出とコンテンツ推奨
  - name: 学校管理
    description: 学校・クラス・生徒管理
  - name: カリキュラム
    description: カリキュラム・学習カード管理
  - name: 学習進捗
    description: 学習進捗記録と追跡
  - name: AI教師
    description: AI対話と問題生成
  - name: 評価
    description: 3観点評価・非認知能力評価
  - name: レポート
    description: 週次・月次レポート生成
  - name: 通知
    description: リアルタイム通知
  - name: ゲーミフィケーション
    description: バッジ・ランキング・実績

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT認証トークン。ログイン後に取得したトークンを使用。
  
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: エラーメッセージ
        code:
          type: string
          description: エラーコード
      required:
        - error
    
    User:
      type: object
      properties:
        id:
          type: integer
          description: ユーザーID
        username:
          type: string
          description: ユーザー名
        email:
          type: string
          format: email
          description: メールアドレス
        user_type:
          type: string
          enum: [admin, teacher, student, parent]
          description: ユーザータイプ
        role:
          type: string
          enum: [admin, teacher, student, parent]
          description: ロール
        created_at:
          type: string
          format: date-time
          description: 作成日時
    
    Student:
      type: object
      properties:
        student_id:
          type: integer
          description: 生徒ID
        user_id:
          type: integer
          description: ユーザーID
        name:
          type: string
          description: 氏名
        grade:
          type: integer
          minimum: 1
          maximum: 9
          description: 学年（1-9）
        class_code:
          type: string
          description: クラスコード
        school_id:
          type: integer
          description: 学校ID
    
    LearningCard:
      type: object
      properties:
        card_id:
          type: integer
          description: 学習カードID
        title:
          type: string
          description: カードタイトル
        difficulty_level:
          type: string
          enum: [basic, standard, advanced]
          description: 難易度
        card_type:
          type: string
          enum: [problem, explanation, practice]
          description: カードタイプ
        content:
          type: string
          description: 問題文または説明
        answer:
          type: string
          description: 正解
        hint:
          type: string
          description: ヒント
        estimated_time_minutes:
          type: integer
          description: 想定所要時間（分）
    
    Progress:
      type: object
      properties:
        progress_id:
          type: integer
          description: 進捗ID
        student_id:
          type: integer
          description: 生徒ID
        card_id:
          type: integer
          description: カードID
        status:
          type: string
          enum: [not_started, in_progress, completed, mastered]
          description: ステータス
        attempt_count:
          type: integer
          description: 挑戦回数
        correct_count:
          type: integer
          description: 正解回数
        mastery_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: 習熟度スコア
        last_attempt_date:
          type: string
          format: date-time
          description: 最終挑戦日時
    
    LearningStyle:
      type: object
      properties:
        student_id:
          type: integer
          description: 生徒ID
        dominant_style:
          type: string
          enum: [visual, auditory, reading, kinesthetic]
          description: 優勢な学習スタイル（VARK）
        dominant_intelligence:
          type: string
          enum: [linguistic, logical, spatial, musical, bodily, interpersonal, intrapersonal, naturalist]
          description: 優勢な知能（Gardner）
        confidence_level:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 信頼度（0-1）
        vark_scores:
          type: object
          description: VARKスコア詳細
        gardner_scores:
          type: object
          description: Gardner知能スコア詳細
        last_updated:
          type: string
          format: date-time
          description: 最終更新日時

paths:
  /health:
    get:
      summary: ヘルスチェック
      description: システムの稼働状況を確認
      tags:
        - ヘルスチェック
      responses:
        '200':
          description: システム正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                    description: システムステータス
                  uptime:
                    type: number
                    description: 稼働時間（秒）
                  database:
                    type: string
                    enum: [connected, disconnected]
                    description: データベース接続状態
                  gemini_api:
                    type: string
                    enum: [available, unavailable]
                    description: Gemini API接続状態
              example:
                status: healthy
                uptime: 3600
                database: connected
                gemini_api: available
        '503':
          description: サービス利用不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/register/student:
    post:
      summary: 生徒登録
      description: 新規生徒アカウントを作成
      tags:
        - 認証
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: ユーザー名
                password:
                  type: string
                  format: password
                  description: パスワード
                email:
                  type: string
                  format: email
                  description: メールアドレス
                name:
                  type: string
                  description: 氏名
                grade:
                  type: integer
                  minimum: 1
                  maximum: 9
                  description: 学年
                class_code:
                  type: string
                  description: クラスコード
              required:
                - username
                - password
                - email
                - name
                - grade
            example:
              username: tanaka_taro
              password: secure_password123
              email: tanaka@example.com
              name: 田中太郎
              grade: 5
              class_code: CLASS2024A
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  student_id:
                    type: integer
                  user_id:
                    type: integer
              example:
                message: Student registered successfully
                student_id: 42
                user_id: 123
        '400':
          description: 入力エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Username already exists

  /api/auth/login:
    post:
      summary: ログイン
      description: ユーザー認証を行い、JWTトークンを取得
      tags:
        - 認証
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: ユーザー名
                password:
                  type: string
                  format: password
                  description: パスワード
              required:
                - username
                - password
            example:
              username: tanaka_taro
              password: secure_password123
      responses:
        '200':
          description: ログイン成功
          headers:
            Set-Cookie:
              description: JWT認証トークン（Cookieに設定）
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
              example:
                message: Login successful
                user:
                  id: 123
                  username: tanaka_taro
                  email: tanaka@example.com
                  user_type: student
                  role: student
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid username or password

  /api/auth/logout:
    post:
      summary: ログアウト
      description: ユーザーセッションを終了
      tags:
        - 認証
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Logout successful

  /api/auth/me:
    get:
      summary: 現在のユーザー情報取得
      description: ログイン中のユーザー情報を取得
      tags:
        - 認証
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adaptive/detect-learning-style/{studentId}:
    get:
      summary: 学習スタイル自動検出
      description: 生徒の学習行動データから学習スタイルを自動検出（VARK + Gardner多重知能理論）
      tags:
        - 適応学習
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
          description: 生徒ID
      responses:
        '200':
          description: 検出結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningStyle'
              example:
                student_id: 42
                dominant_style: visual
                dominant_intelligence: spatial
                confidence_level: 0.85
                vark_scores:
                  visual: 0.85
                  auditory: 0.45
                  reading: 0.60
                  kinesthetic: 0.35
                gardner_scores:
                  spatial: 0.90
                  logical: 0.75
                  linguistic: 0.60
                last_updated: "2026-01-30T06:00:00Z"
        '404':
          description: 生徒が見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adaptive/recommend/{studentId}:
    get:
      summary: 適応的コンテンツ推奨
      description: 生徒の学習スタイルに最適化されたコンテンツを推奨
      tags:
        - 適応学習
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
          description: 生徒ID
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
          description: 推奨コンテンツ数
      responses:
        '200':
          description: 推奨コンテンツリスト
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        card_id:
                          type: integer
                        title:
                          type: string
                        difficulty_level:
                          type: string
                        match_score:
                          type: number
                          format: float
                          description: マッチスコア（0-1）
                        reason:
                          type: string
                          description: 推奨理由
              example:
                recommendations:
                  - card_id: 101
                    title: 図形の面積計算（視覚的図解付き）
                    difficulty_level: standard
                    match_score: 0.92
                    reason: 視覚的学習スタイルに最適化された図解付きコンテンツ

  /api/curriculum:
    get:
      summary: カリキュラム一覧取得
      description: 利用可能なカリキュラムの一覧を取得
      tags:
        - カリキュラム
      parameters:
        - name: grade
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 9
          description: 学年フィルター
        - name: subject
          in: query
          required: false
          schema:
            type: string
          description: 教科フィルター
      responses:
        '200':
          description: カリキュラムリスト
          content:
            application/json:
              schema:
                type: object
                properties:
                  curricula:
                    type: array
                    items:
                      type: object
                      properties:
                        curriculum_id:
                          type: integer
                        title:
                          type: string
                        subject:
                          type: string
                        grade_level:
                          type: integer
                        total_cards:
                          type: integer

  /api/progress:
    post:
      summary: 学習進捗記録
      description: 学習カードの進捗を記録
      tags:
        - 学習進捗
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card_id:
                  type: integer
                student_answer:
                  type: string
                time_spent_seconds:
                  type: integer
                hint_used:
                  type: boolean
                confidence_level:
                  type: string
                  enum: [low, medium, high]
              required:
                - card_id
                - student_answer
            example:
              card_id: 101
              student_answer: "45 cm²"
              time_spent_seconds: 120
              hint_used: false
              confidence_level: high
      responses:
        '200':
          description: 進捗記録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_correct:
                    type: boolean
                  feedback:
                    type: string
                  mastery_score:
                    type: number
                  next_recommendation:
                    type: object

  /api/ai/ask:
    post:
      summary: AI教師に質問
      description: Socratic対話による学習支援（Gemini API使用）
      tags:
        - AI教師
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  description: 質問内容
                card_id:
                  type: integer
                  description: 関連する学習カードID
                session_id:
                  type: string
                  description: 会話セッションID
              required:
                - question
            example:
              question: なぜ面積は縦×横で計算できるのですか？
              card_id: 101
              session_id: session_abc123
      responses:
        '200':
          description: AI回答
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  session_id:
                    type: string
                  follow_up_questions:
                    type: array
                    items:
                      type: string
              example:
                response: いい質問ですね！面積とは「広さ」を表す単位ですが、なぜ縦×横で求められると思いますか？
                session_id: session_abc123
                follow_up_questions:
                  - 1cm × 1cmの正方形をいくつ並べると考えてみましょう
                  - 実際に紙を使って確認してみましたか？

  /api/reports/weekly/{classCode}:
    get:
      summary: 週次レポート取得
      description: クラスの週次学習レポートを取得
      tags:
        - レポート
      security:
        - BearerAuth: []
      parameters:
        - name: classCode
          in: path
          required: true
          schema:
            type: string
          description: クラスコード
        - name: week_offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: 週オフセット（0=今週、-1=先週）
      responses:
        '200':
          description: 週次レポート
          content:
            application/json:
              schema:
                type: object
                properties:
                  class_code:
                    type: string
                  week_start:
                    type: string
                    format: date
                  week_end:
                    type: string
                    format: date
                  total_students:
                    type: integer
                  active_students:
                    type: integer
                  total_learning_time_minutes:
                    type: integer
                  average_mastery_score:
                    type: number
                  student_details:
                    type: array
                    items:
                      type: object

security:
  - BearerAuth: []
