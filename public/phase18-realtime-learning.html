<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム適応学習 - Phase 18-1</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <!-- ヘッダー -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-bolt text-yellow-500 mr-2"></i>
                リアルタイム適応学習システム
            </h1>
            <p class="text-gray-600">1秒以内の動的調整・インテリジェントヒント・即座の推薦</p>
            <div class="flex items-center mt-4 space-x-4">
                <div id="connection-status" class="flex items-center">
                    <div class="w-3 h-3 rounded-full bg-gray-400 mr-2"></div>
                    <span class="text-sm text-gray-600">未接続</span>
                </div>
                <button id="connect-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    <i class="fas fa-plug mr-1"></i> 接続
                </button>
                <button id="disconnect-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition hidden">
                    <i class="fas fa-power-off mr-1"></i> 切断
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 左側: 問題エリア -->
            <div class="space-y-6">
                <!-- 現在の問題 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-question-circle text-blue-500 mr-2"></i>
                        問題
                    </h2>
                    <div id="problem-area" class="space-y-4">
                        <div class="text-gray-500 text-center py-8">
                            <i class="fas fa-play-circle text-4xl mb-2"></i>
                            <p>「接続」ボタンを押して開始してください</p>
                        </div>
                    </div>
                </div>

                <!-- リアルタイムヒント -->
                <div class="bg-gradient-to-r from-yellow-50 to-yellow-100 rounded-lg shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                        リアルタイムヒント
                    </h2>
                    <div id="hint-area" class="space-y-3">
                        <p class="text-gray-500 text-sm">ヒントが必要なときに自動で表示されます</p>
                    </div>
                    <button id="manual-hint-btn" class="mt-4 bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition w-full disabled:opacity-50" disabled>
                        <i class="fas fa-hand-point-up mr-1"></i> ヒントをリクエスト
                    </button>
                </div>
            </div>

            <!-- 右側: モニタリングエリア -->
            <div class="space-y-6">
                <!-- 12理論スコア（リアルタイム） -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-chart-line text-green-500 mr-2"></i>
                        理論スコア（リアルタイム）
                    </h2>
                    <div id="theory-scores" class="space-y-2">
                        <div class="text-gray-500 text-sm">接続後に表示されます</div>
                    </div>
                </div>

                <!-- リアルタイムイベントログ -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-stream text-purple-500 mr-2"></i>
                        イベントログ
                    </h2>
                    <div id="event-log" class="space-y-2 max-h-96 overflow-y-auto">
                        <div class="text-gray-500 text-sm">イベントはここに表示されます</div>
                    </div>
                </div>

                <!-- リアルタイム推薦 -->
                <div class="bg-gradient-to-r from-green-50 to-emerald-100 rounded-lg shadow-lg p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-star text-green-500 mr-2"></i>
                        次の推薦
                    </h2>
                    <div id="recommendation-area" class="space-y-3">
                        <p class="text-gray-500 text-sm">問題完了後に推薦が表示されます</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let studentId = 'student1'; // デモ用
        let currentProblemStartTime = null;
        let progressTimer = null;

        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const connectionStatus = document.getElementById('connection-status');
        const manualHintBtn = document.getElementById('manual-hint-btn');
        const problemArea = document.getElementById('problem-area');
        const hintArea = document.getElementById('hint-area');
        const theoryScores = document.getElementById('theory-scores');
        const eventLog = document.getElementById('event-log');
        const recommendationArea = document.getElementById('recommendation-area');

        // WebSocket接続
        connectBtn.addEventListener('click', async () => {
            try {
                // WebSocket URLを構築
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                const wsUrl = `${protocol}//${host}/api/realtime/connect?studentId=${studentId}`;

                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    updateConnectionStatus('connected');
                    addEventLog('success', '接続成功', 'リアルタイム学習セッション開始');
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };

                ws.onclose = () => {
                    updateConnectionStatus('disconnected');
                    addEventLog('info', '接続終了', 'セッションが終了しました');
                    manualHintBtn.disabled = true;
                };

                ws.onerror = (error) => {
                    updateConnectionStatus('error');
                    addEventLog('error', '接続エラー', error.message);
                };

            } catch (error) {
                alert('接続に失敗しました: ' + error.message);
            }
        });

        // 切断
        disconnectBtn.addEventListener('click', () => {
            if (ws) {
                ws.close();
                ws = null;
            }
        });

        // 手動ヒントリクエスト
        manualHintBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'request_hint',
                    hintLevel: 1
                }));
                addEventLog('info', 'ヒントリクエスト', 'ヒントを要求しました');
            }
        });

        // WebSocketメッセージ処理
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'connected':
                    addEventLog('success', '接続完了', data.message);
                    updateTheoryScores(data.theoryScores);
                    startDemoProblem();
                    break;

                case 'problem_started':
                    addEventLog('info', '問題開始', `問題ID: ${data.problemId}`);
                    manualHintBtn.disabled = false;
                    break;

                case 'real_time_hint':
                    showHint(data.hint, data.confidence, data.reason);
                    addEventLog('warning', 'リアルタイムヒント', data.hint);
                    break;

                case 'progress_analyzed':
                    addEventLog('info', '進行分析', `経過時間: ${Math.floor(data.analysis.timeSpent / 1000)}秒`);
                    break;

                case 'answer_processed':
                    handleAnswerProcessed(data);
                    break;

                case 'theory_updated':
                    addEventLog('success', '理論スコア更新', `${data.theoryCode}: ${data.newScore}点`);
                    break;

                case 'hint_provided':
                    showHint(data.hint, data.confidence, '手動リクエスト');
                    addEventLog('info', 'ヒント提供', data.hint);
                    break;

                case 'error':
                    addEventLog('error', 'エラー', data.error);
                    break;
            }
        }

        // 接続状態更新
        function updateConnectionStatus(status) {
            const statusDiv = connectionStatus.querySelector('div');
            const statusText = connectionStatus.querySelector('span');

            if (status === 'connected') {
                statusDiv.className = 'w-3 h-3 rounded-full bg-green-500 mr-2 animate-pulse';
                statusText.textContent = '接続中';
                connectBtn.classList.add('hidden');
                disconnectBtn.classList.remove('hidden');
            } else if (status === 'disconnected') {
                statusDiv.className = 'w-3 h-3 rounded-full bg-gray-400 mr-2';
                statusText.textContent = '切断';
                connectBtn.classList.remove('hidden');
                disconnectBtn.classList.add('hidden');
            } else if (status === 'error') {
                statusDiv.className = 'w-3 h-3 rounded-full bg-red-500 mr-2';
                statusText.textContent = 'エラー';
            }
        }

        // デモ問題開始
        function startDemoProblem() {
            problemArea.innerHTML = `
                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                    <p class="font-bold text-lg mb-2">問題: 3 × 4 = ?</p>
                    <p class="text-sm text-gray-600 mb-4">答えを入力してください</p>
                    <input type="number" id="answer-input" class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 mb-3">
                    <button id="submit-answer-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg w-full font-medium transition">
                        <i class="fas fa-check mr-1"></i> 回答する
                    </button>
                </div>
                <div class="mt-4 text-sm text-gray-500">
                    <i class="fas fa-info-circle mr-1"></i>
                    考えている間、リアルタイムで分析されています...
                </div>
            `;

            currentProblemStartTime = Date.now();

            // 問題開始を送信
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'problem_start',
                    problemId: 'demo_3x4',
                    difficulty: 'medium',
                    theoryAlignment: ['F1', 'F6']
                }));
            }

            // 進行状況を定期的に送信
            progressTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'problem_progress',
                        action: 'thinking',
                        duration: Date.now() - currentProblemStartTime
                    }));
                }
            }, 5000); // 5秒ごと

            // 回答送信
            document.getElementById('submit-answer-btn').addEventListener('click', () => {
                const answer = document.getElementById('answer-input').value;
                const isCorrect = answer === '12';
                const timeSpent = Date.now() - currentProblemStartTime;

                clearInterval(progressTimer);

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'answer_submit',
                        answer,
                        isCorrect,
                        hintsUsed: 0
                    }));
                }
            });
        }

        // ヒント表示
        function showHint(hint, confidence, reason) {
            const hintHtml = `
                <div class="bg-yellow-200 border-l-4 border-yellow-600 p-4 rounded-lg animate-pulse">
                    <p class="font-bold text-yellow-900 mb-1">💡 ${hint}</p>
                    <p class="text-xs text-yellow-800">信頼度: ${(confidence * 100).toFixed(0)}% | 理由: ${reason}</p>
                </div>
            `;
            hintArea.innerHTML = hintHtml + hintArea.innerHTML;
        }

        // 理論スコア更新
        function updateTheoryScores(scores) {
            let html = '';
            for (const [code, score] of Object.entries(scores)) {
                const percentage = score;
                const color = percentage >= 70 ? 'green' : percentage >= 50 ? 'yellow' : 'red';
                html += `
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-700 font-medium">${code}</span>
                        <div class="flex items-center">
                            <div class="w-32 h-2 bg-gray-200 rounded-full mr-2">
                                <div class="h-2 bg-${color}-500 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                            </div>
                            <span class="text-gray-600 w-12 text-right">${percentage.toFixed(0)}点</span>
                        </div>
                    </div>
                `;
            }
            theoryScores.innerHTML = html || '<div class="text-gray-500 text-sm">スコアなし</div>';
        }

        // 回答処理結果
        function handleAnswerProcessed(data) {
            const resultHtml = `
                <div class="bg-${data.isCorrect ? 'green' : 'red'}-50 border-l-4 border-${data.isCorrect ? 'green' : 'red'}-500 p-4 rounded-lg mb-4">
                    <p class="font-bold text-lg">${data.message}</p>
                    <p class="text-sm text-gray-600 mt-1">解答時間: ${Math.floor(data.timeSpent / 1000)}秒</p>
                </div>
            `;
            problemArea.innerHTML = resultHtml + problemArea.innerHTML;

            if (data.theoryUpdates && data.theoryUpdates.length > 0) {
                updateTheoryScores(data.theoryUpdates.reduce((acc, u) => {
                    acc[u.theoryCode] = u.newScore;
                    return acc;
                }, {}));
            }

            if (data.nextRecommendation) {
                showRecommendation(data.nextRecommendation);
            }

            manualHintBtn.disabled = true;
        }

        // 推薦表示
        function showRecommendation(rec) {
            recommendationArea.innerHTML = `
                <div class="bg-green-100 border-l-4 border-green-600 p-4 rounded-lg">
                    <p class="font-bold text-green-900 mb-2">🎯 次のステップ</p>
                    <p class="text-sm text-green-800 mb-2">${rec.approach}</p>
                    <p class="text-xs text-green-700">推定時間: ${rec.estimatedTime} | 信頼度: ${(rec.confidence * 100).toFixed(0)}%</p>
                </div>
            `;
        }

        // イベントログ追加
        function addEventLog(type, title, message) {
            const icons = {
                success: 'fa-check-circle text-green-500',
                error: 'fa-exclamation-circle text-red-500',
                warning: 'fa-exclamation-triangle text-yellow-500',
                info: 'fa-info-circle text-blue-500'
            };

            const timestamp = new Date().toLocaleTimeString('ja-JP');
            const logHtml = `
                <div class="flex items-start space-x-2 text-sm bg-gray-50 p-2 rounded">
                    <i class="fas ${icons[type]} mt-0.5"></i>
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <span class="font-medium text-gray-800">${title}</span>
                            <span class="text-xs text-gray-500">${timestamp}</span>
                        </div>
                        <p class="text-gray-600 text-xs mt-0.5">${message}</p>
                    </div>
                </div>
            `;
            eventLog.innerHTML = logHtml + eventLog.innerHTML;
        }
    </script>
</body>
</html>
