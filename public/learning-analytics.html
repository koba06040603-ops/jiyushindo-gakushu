<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習履歴分析ダッシュボード - 松川村AI学習システム</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- ヘッダー -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <h1 class="text-3xl font-bold">
                    <i class="fas fa-chart-line mr-3"></i>学習履歴分析ダッシュボード
                </h1>
                <p class="text-blue-100 mt-2">長期的な学習傾向と成長を可視化</p>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- 期間選択 -->
            <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <label class="text-sm font-medium text-gray-700">分析期間:</label>
                        <select id="periodSelect" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="30">過去30日間</option>
                            <option value="90">過去3ヶ月</option>
                            <option value="180">過去6ヶ月</option>
                            <option value="365" selected>過去1年間</option>
                        </select>
                        <button onclick="loadAnalytics()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            <i class="fas fa-sync-alt mr-2"></i>更新
                        </button>
                    </div>
                    <button onclick="exportData()" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-download mr-2"></i>データエクスポート
                    </button>
                </div>
            </div>

            <!-- 統計サマリー -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">総学習日数</p>
                            <p id="totalDays" class="text-3xl font-bold text-blue-600">0</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-calendar-alt text-blue-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">総解答数</p>
                            <p id="totalProblems" class="text-3xl font-bold text-green-600">0</p>
                        </div>
                        <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-tasks text-green-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">平均正答率</p>
                            <p id="avgAccuracy" class="text-3xl font-bold text-purple-600">0%</p>
                        </div>
                        <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-percentage text-purple-600 text-xl"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-600">総学習時間</p>
                            <p id="totalHours" class="text-3xl font-bold text-orange-600">0h</p>
                        </div>
                        <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-clock text-orange-600 text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- チャート行1 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <!-- 成長曲線 -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-chart-line mr-2 text-blue-600"></i>成長曲線
                    </h2>
                    <canvas id="growthChart"></canvas>
                </div>

                <!-- 月別統計 -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-chart-bar mr-2 text-green-600"></i>月別統計
                    </h2>
                    <canvas id="monthlyChart"></canvas>
                </div>
            </div>

            <!-- チャート行2 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <!-- 学習時間帯パターン -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-clock mr-2 text-purple-600"></i>学習時間帯パターン
                    </h2>
                    <canvas id="timePatternChart"></canvas>
                </div>

                <!-- 曜日別パターン -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-calendar-week mr-2 text-indigo-600"></i>曜日別パターン
                    </h2>
                    <canvas id="dayPatternChart"></canvas>
                </div>
            </div>

            <!-- 教科バランスと改善率 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 教科バランス -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-book mr-2 text-teal-600"></i>教科バランス
                    </h2>
                    <canvas id="subjectChart"></canvas>
                </div>

                <!-- 改善率 -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-trending-up mr-2 text-red-600"></i>月次改善率
                    </h2>
                    <canvas id="improvementChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- エクスポートモーダル -->
    <div id="exportModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full">
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-2xl font-bold text-gray-900">データエクスポート</h2>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">フォーマット</label>
                    <select id="exportFormat" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <option value="csv">CSV</option>
                        <option value="json">JSON</option>
                        <option value="excel">Excel</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <input type="checkbox" id="anonymizeData" class="mr-2">
                        データを匿名化する
                    </label>
                </div>
                <div id="anonymizeOptions" class="hidden ml-6 space-y-2">
                    <label class="block text-sm">
                        <input type="radio" name="anonymizeLevel" value="basic" checked class="mr-2">
                        基本（名前のみ除外）
                    </label>
                    <label class="block text-sm">
                        <input type="radio" name="anonymizeLevel" value="standard" class="mr-2">
                        標準（クラス情報も一般化）
                    </label>
                    <label class="block text-sm">
                        <input type="radio" name="anonymizeLevel" value="full" class="mr-2">
                        完全（統計データのみ）
                    </label>
                </div>
                <div class="flex space-x-3">
                    <button onclick="executeExport()" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                        <i class="fas fa-download mr-2"></i>エクスポート
                    </button>
                    <button onclick="closeExportModal()" class="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">
                        キャンセル
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let charts = {};

        document.getElementById('anonymizeData').addEventListener('change', (e) => {
            document.getElementById('anonymizeOptions').classList.toggle('hidden', !e.target.checked);
        });

        async function loadAnalytics() {
            const days = parseInt(document.getElementById('periodSelect').value);
            
            try {
                // 各種データを並列取得
                const [yearlyHistory, monthlyStats, growthCurve, learningPattern, improvement] = await Promise.all([
                    fetch(`/api/analytics/yearly-history?year=${new Date().getFullYear()}`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                    }).then(r => r.json()),
                    fetch(`/api/analytics/monthly-stats?months=12`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                    }).then(r => r.json()),
                    fetch(`/api/analytics/growth-curve?days=${days}`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                    }).then(r => r.json()),
                    fetch(`/api/analytics/learning-pattern?days=${days}`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                    }).then(r => r.json()),
                    fetch(`/api/analytics/improvement-rate`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                    }).then(r => r.json())
                ]);

                // サマリー更新
                updateSummary(yearlyHistory.history);
                
                // チャート更新
                updateGrowthChart(growthCurve.curve);
                updateMonthlyChart(monthlyStats.stats);
                updateTimePatternChart(learningPattern.pattern.timePattern);
                updateDayPatternChart(learningPattern.pattern.dayPattern);
                updateSubjectChart(learningPattern.pattern.subjectBalance);
                updateImprovementChart(improvement.improvement);
                
            } catch (error) {
                console.error('データ取得エラー:', error);
                alert('データの取得に失敗しました');
            }
        }

        function updateSummary(history) {
            const uniqueDays = new Set(history.map(h => h.date)).size;
            const totalProblems = history.reduce((sum, h) => sum + h.total_problems, 0);
            const totalHours = history.reduce((sum, h) => sum + h.hours_spent, 0);
            const avgAccuracy = history.length > 0 
                ? history.reduce((sum, h) => sum + h.accuracy_rate, 0) / history.length 
                : 0;

            document.getElementById('totalDays').textContent = uniqueDays;
            document.getElementById('totalProblems').textContent = totalProblems.toLocaleString();
            document.getElementById('avgAccuracy').textContent = avgAccuracy.toFixed(1) + '%';
            document.getElementById('totalHours').textContent = totalHours.toFixed(1) + 'h';
        }

        function updateGrowthChart(data) {
            const ctx = document.getElementById('growthChart');
            if (charts.growth) charts.growth.destroy();
            
            const subjects = [...new Set(data.map(d => d.subject))];
            const datasets = subjects.map((subject, i) => {
                const subjectData = data.filter(d => d.subject === subject);
                return {
                    label: subject,
                    data: subjectData.map(d => ({ x: d.date, y: d.cumulative_problems })),
                    borderColor: `hsl(${i * 60}, 70%, 50%)`,
                    tension: 0.4
                };
            });

            charts.growth = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    scales: {
                        x: { type: 'time', time: { unit: 'month' } },
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function updateMonthlyChart(data) {
            const ctx = document.getElementById('monthlyChart');
            if (charts.monthly) charts.monthly.destroy();
            
            const months = [...new Set(data.map(d => d.month))].sort();
            const subjects = [...new Set(data.map(d => d.subject))];
            
            const datasets = subjects.map((subject, i) => ({
                label: subject,
                data: months.map(month => {
                    const item = data.find(d => d.month === month && d.subject === subject);
                    return item ? item.monthly_problems : 0;
                }),
                backgroundColor: `hsl(${i * 60}, 70%, 60%)`
            }));

            charts.monthly = new Chart(ctx, {
                type: 'bar',
                data: { labels: months, datasets },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function updateTimePatternChart(data) {
            const ctx = document.getElementById('timePatternChart');
            if (charts.timePattern) charts.timePattern.destroy();
            
            const hours = Array.from({length: 24}, (_, i) => i);
            const counts = hours.map(hour => {
                const item = data.find(d => d.hour === hour);
                return item ? item.count : 0;
            });

            charts.timePattern = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: hours.map(h => `${h}時`),
                    datasets: [{
                        label: '学習回数',
                        data: counts,
                        backgroundColor: 'rgba(147, 51, 234, 0.6)'
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function updateDayPatternChart(data) {
            const ctx = document.getElementById('dayPatternChart');
            if (charts.dayPattern) charts.dayPattern.destroy();
            
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            const dayLabels = ['月', '火', '水', '木', '金', '土', '日'];
            
            charts.dayPattern = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: dayLabels,
                    datasets: [{
                        label: '学習回数',
                        data: days.map(day => {
                            const item = data.find(d => d.day_of_week === day);
                            return item ? item.count : 0;
                        }),
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        borderColor: 'rgb(99, 102, 241)'
                    }]
                },
                options: { responsive: true }
            });
        }

        function updateSubjectChart(data) {
            const ctx = document.getElementById('subjectChart');
            if (charts.subject) charts.subject.destroy();
            
            charts.subject = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.map(d => d.subject),
                    datasets: [{
                        data: data.map(d => d.count),
                        backgroundColor: data.map((_, i) => `hsl(${i * 40}, 70%, 60%)`)
                    }]
                },
                options: { responsive: true }
            });
        }

        function updateImprovementChart(data) {
            const ctx = document.getElementById('improvementChart');
            if (charts.improvement) charts.improvement.destroy();
            
            const subjects = [...new Set(data.map(d => d.subject))];
            const datasets = subjects.map((subject, i) => {
                const subjectData = data.filter(d => d.subject === subject && d.improvement !== null);
                return {
                    label: subject,
                    data: subjectData.map(d => ({ x: d.month, y: d.improvement })),
                    borderColor: `hsl(${i * 60}, 70%, 50%)`,
                    tension: 0.4
                };
            });

            charts.improvement = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    scales: {
                        x: { type: 'category' },
                        y: { beginAtZero: false }
                    }
                }
            });
        }

        function exportData() {
            document.getElementById('exportModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        async function executeExport() {
            const format = document.getElementById('exportFormat').value;
            const anonymize = document.getElementById('anonymizeData').checked;
            const anonymizationLevel = anonymize 
                ? document.querySelector('input[name="anonymizeLevel"]:checked').value 
                : null;
            
            const days = parseInt(document.getElementById('periodSelect').value);
            const dateFrom = new Date(Date.now() - days * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            
            try {
                const response = await fetch('/api/export/learning-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify({
                        format,
                        anonymize,
                        anonymizationLevel,
                        dateFrom,
                        dateTo: new Date().toISOString().split('T')[0]
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `learning_data.${format}`;
                    a.click();
                    closeExportModal();
                } else {
                    alert('エクスポートに失敗しました');
                }
            } catch (error) {
                console.error('エクスポートエラー:', error);
                alert('エクスポートに失敗しました');
            }
        }

        // 初期読み込み
        loadAnalytics();
    </script>
</body>
</html>
