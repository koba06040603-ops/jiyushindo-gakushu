<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI学習アシスタント - 自由進度学習システム</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <style>
        .chat-message {
            animation: fadeInUp 0.3s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .typing-indicator span {
            animation: blink 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%, 60%, 100% { opacity: 0.2; }
            30% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- ヘッダー -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center">
                        <i class="fas fa-robot text-white text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold text-gray-800">AI学習アシスタント</h1>
                        <p class="text-gray-600">いつでも質問してね！😊</p>
                    </div>
                </div>
                <button onclick="showSettings()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                    <i class="fas fa-cog mr-2"></i>設定
                </button>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- サイドバー：会話リスト -->
            <div class="lg:col-span-1 bg-white rounded-lg shadow-lg p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-gray-800">会話履歴</h2>
                    <button onclick="startNewConversation()" class="p-2 bg-purple-100 hover:bg-purple-200 rounded-lg transition">
                        <i class="fas fa-plus text-purple-600"></i>
                    </button>
                </div>
                <div id="conversationList" class="space-y-2 max-h-96 overflow-y-auto">
                    <!-- 会話リストがここに表示される -->
                </div>
            </div>

            <!-- チャットエリア -->
            <div class="lg:col-span-3 bg-white rounded-lg shadow-lg flex flex-col" style="height: 600px;">
                <!-- チャットヘッダー -->
                <div class="p-4 border-b border-gray-200">
                    <h2 class="text-xl font-bold text-gray-800" id="chatTitle">新しい会話</h2>
                </div>

                <!-- メッセージエリア -->
                <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto space-y-4">
                    <!-- ウェルカムメッセージ -->
                    <div class="text-center text-gray-500 py-8">
                        <i class="fas fa-comments text-6xl text-purple-300 mb-4"></i>
                        <p class="text-lg">何でも気軽に質問してね！</p>
                        <p class="text-sm mt-2">勉強のこと、わからない問題、やる気が出ない時など...</p>
                    </div>
                </div>

                <!-- 入力エリア -->
                <div class="p-4 border-t border-gray-200">
                    <div class="flex space-x-2">
                        <input 
                            type="text" 
                            id="messageInput" 
                            placeholder="メッセージを入力..."
                            class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none"
                            onkeypress="if(event.key === 'Enter') sendMessage()"
                        >
                        <button 
                            onclick="sendMessage()"
                            class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold rounded-lg transition">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="mt-2 text-sm text-gray-500">
                        よくある質問: 
                        <button onclick="sendQuickQuestion('どうやって勉強したらいいですか？')" class="text-purple-600 hover:underline">勉強方法</button> | 
                        <button onclick="sendQuickQuestion('やる気が出ません...')" class="text-purple-600 hover:underline">やる気アップ</button> | 
                        <button onclick="sendQuickQuestion('数学が苦手です')" class="text-purple-600 hover:underline">苦手克服</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full mx-4 p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-800">アシスタント設定</h2>
                <button onclick="closeSettings()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <div class="space-y-4">
                <!-- パーソナリティ選択 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">アシスタントのタイプ</label>
                    <select id="personalitySelect" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
                        <!-- オプションがJSで動的に追加される -->
                    </select>
                </div>

                <!-- ヘルプレベル -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">ヒントのレベル</label>
                    <select id="helpLevelSelect" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
                        <option value="hint">ヒントのみ（自分で考えたい）</option>
                        <option value="medium">適度なサポート（おすすめ）</option>
                        <option value="detailed">詳しく教えて（しっかり学びたい）</option>
                    </select>
                </div>

                <!-- モチベーション頻度 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">励ましの頻度</label>
                    <select id="motivationSelect" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none">
                        <option value="low">控えめ</option>
                        <option value="normal">普通</option>
                        <option value="high">たくさん</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-2 mt-6">
                    <button onclick="closeSettings()" class="px-6 py-3 bg-gray-200 hover:bg-gray-300 rounded-lg transition">
                        キャンセル
                    </button>
                    <button onclick="saveSettings()" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold rounded-lg transition">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        let currentConversationId = null
        let settings = null
        let personalities = []

        // ページ読み込み時
        document.addEventListener('DOMContentLoaded', async () => {
            await loadConversations()
            await loadSettings()
        })

        // 設定を読み込み
        async function loadSettings() {
            try {
                const response = await axios.get('/api/chat/settings')
                if (response.data.success) {
                    settings = response.data.settings
                    personalities = response.data.personalities
                    
                    // パーソナリティ選択肢を追加
                    const select = document.getElementById('personalitySelect')
                    select.innerHTML = personalities.map(p => 
                        `<option value="${p.id}" ${p.id === settings.personality_id ? 'selected' : ''}>
                            ${p.name} - ${p.description}
                        </option>`
                    ).join('')
                    
                    // 他の設定も反映
                    document.getElementById('helpLevelSelect').value = settings.help_level || 'medium'
                    document.getElementById('motivationSelect').value = settings.motivation_frequency || 'normal'
                }
            } catch (error) {
                console.error('設定読み込みエラー:', error)
            }
        }

        // 会話リストを読み込み
        async function loadConversations() {
            try {
                const response = await axios.get('/api/chat/conversations')
                if (response.data.success) {
                    const list = document.getElementById('conversationList')
                    
                    if (response.data.conversations.length === 0) {
                        list.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">まだ会話がありません</p>'
                        return
                    }
                    
                    list.innerHTML = response.data.conversations.map(conv => `
                        <button 
                            onclick="loadConversation(${conv.id})"
                            class="w-full text-left p-3 rounded-lg hover:bg-purple-50 transition ${conv.id === currentConversationId ? 'bg-purple-100' : ''}">
                            <div class="font-bold text-sm text-gray-800 truncate">${conv.conversation_title || '会話'}</div>
                            <div class="text-xs text-gray-500">${conv.message_count}メッセージ</div>
                        </button>
                    `).join('')
                }
            } catch (error) {
                console.error('会話リスト読み込みエラー:', error)
            }
        }

        // 特定の会話を読み込み
        async function loadConversation(conversationId) {
            try {
                currentConversationId = conversationId
                const response = await axios.get(`/api/chat/messages/${conversationId}`)
                
                if (response.data.success) {
                    const container = document.getElementById('messagesContainer')
                    container.innerHTML = response.data.messages.map(msg => renderMessage(msg)).join('')
                    container.scrollTop = container.scrollHeight
                    
                    await loadConversations() // リストを更新
                }
            } catch (error) {
                console.error('会話読み込みエラー:', error)
            }
        }

        // 新しい会話を開始
        function startNewConversation() {
            currentConversationId = null
            document.getElementById('chatTitle').textContent = '新しい会話'
            document.getElementById('messagesContainer').innerHTML = `
                <div class="text-center text-gray-500 py-8">
                    <i class="fas fa-comments text-6xl text-purple-300 mb-4"></i>
                    <p class="text-lg">何でも気軽に質問してね！</p>
                    <p class="text-sm mt-2">勉強のこと、わからない問題、やる気が出ない時など...</p>
                </div>
            `
        }

        // メッセージを送信
        async function sendMessage() {
            const input = document.getElementById('messageInput')
            const message = input.value.trim()
            
            if (!message) return
            
            // ユーザーメッセージを表示
            appendMessage({ role: 'user', content: message })
            input.value = ''
            
            // タイピングインジケーターを表示
            showTypingIndicator()
            
            try {
                const response = await axios.post('/api/chat/send', {
                    message,
                    conversation_id: currentConversationId
                })
                
                if (response.data.success) {
                    // 新しい会話IDを保存
                    if (!currentConversationId) {
                        currentConversationId = response.data.conversation_id
                        await loadConversations()
                    }
                    
                    // タイピングインジケーターを削除
                    removeTypingIndicator()
                    
                    // アシスタントの応答を表示
                    appendMessage(response.data.message)
                }
            } catch (error) {
                console.error('メッセージ送信エラー:', error)
                removeTypingIndicator()
                appendMessage({
                    role: 'assistant',
                    content: 'すみません、エラーが発生しました。もう一度試してみてください。',
                    message_type: 'text'
                })
            }
        }

        // クイック質問を送信
        function sendQuickQuestion(question) {
            document.getElementById('messageInput').value = question
            sendMessage()
        }

        // メッセージを表示に追加
        function appendMessage(message) {
            const container = document.getElementById('messagesContainer')
            container.innerHTML += renderMessage(message)
            container.scrollTop = container.scrollHeight
        }

        // メッセージをHTMLにレンダリング
        function renderMessage(message) {
            const isUser = message.role === 'user'
            const bgColor = isUser ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-800'
            const alignment = isUser ? 'justify-end' : 'justify-start'
            const icon = isUser ? 'fa-user' : 'fa-robot'
            
            return `
                <div class="flex ${alignment} chat-message">
                    <div class="max-w-2xl ${bgColor} rounded-lg p-4 shadow">
                        <div class="flex items-start space-x-2">
                            <i class="fas ${icon} ${isUser ? 'text-purple-200' : 'text-purple-600'}"></i>
                            <div class="flex-1">
                                <p class="whitespace-pre-wrap">${escapeHtml(message.content)}</p>
                                ${message.message_type && message.message_type !== 'text' ? 
                                    `<span class="text-xs opacity-75 mt-1 inline-block">${getMessageTypeLabel(message.message_type)}</span>` 
                                    : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `
        }

        // タイピングインジケーターを表示
        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer')
            container.innerHTML += `
                <div id="typingIndicator" class="flex justify-start">
                    <div class="bg-gray-100 rounded-lg p-4 shadow typing-indicator">
                        <div class="flex items-center space-x-1">
                            <i class="fas fa-robot text-purple-600"></i>
                            <span class="text-gray-600 ml-2">入力中</span>
                            <span class="text-gray-600">.</span>
                            <span class="text-gray-600">.</span>
                            <span class="text-gray-600">.</span>
                        </div>
                    </div>
                </div>
            `
            container.scrollTop = container.scrollHeight
        }

        // タイピングインジケーターを削除
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator')
            if (indicator) indicator.remove()
        }

        // メッセージタイプのラベル
        function getMessageTypeLabel(type) {
            const labels = {
                'problem_help': '📚 問題サポート',
                'motivation': '💪 やる気アップ',
                'advice': '💡 アドバイス'
            }
            return labels[type] || ''
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            const div = document.createElement('div')
            div.textContent = text
            return div.innerHTML
        }

        // 設定モーダルを表示
        function showSettings() {
            document.getElementById('settingsModal').classList.remove('hidden')
        }

        // 設定モーダルを閉じる
        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden')
        }

        // 設定を保存
        async function saveSettings() {
            try {
                const personalityId = parseInt(document.getElementById('personalitySelect').value)
                const helpLevel = document.getElementById('helpLevelSelect').value
                const motivationFrequency = document.getElementById('motivationSelect').value
                
                const response = await axios.post('/api/chat/settings', {
                    personality_id: personalityId,
                    help_level: helpLevel,
                    motivation_frequency: motivationFrequency
                })
                
                if (response.data.success) {
                    alert('設定を保存しました！')
                    closeSettings()
                    await loadSettings()
                }
            } catch (error) {
                console.error('設定保存エラー:', error)
                alert('設定の保存に失敗しました')
            }
        }
    </script>
</body>
</html>
