<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オフライン - 自由進度学習支援システム</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen flex items-center justify-center">
    <div class="max-w-2xl mx-auto px-4 text-center">
        <div class="bg-white rounded-lg shadow-2xl p-8">
            <i class="fas fa-wifi-slash text-6xl text-gray-400 mb-6"></i>
            <h1 class="text-3xl font-bold text-gray-800 mb-4">オフラインモード</h1>
            <p class="text-gray-600 mb-6">
                現在、インターネット接続がありません。<br>
                オフラインでも学習を続けることができます。
            </p>
            
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 text-left">
                <h3 class="font-bold text-blue-800 mb-2">
                    <i class="fas fa-info-circle"></i> オフラインでできること
                </h3>
                <ul class="text-sm text-blue-700 space-y-1">
                    <li><i class="fas fa-check"></i> ダウンロード済みの学習カードを復習</li>
                    <li><i class="fas fa-check"></i> 学習進捗の記録（オンライン復帰時に同期）</li>
                    <li><i class="fas fa-check"></i> これまでのレポートを閲覧</li>
                    <li><i class="fas fa-check"></i> ゲーミフィケーション機能の確認</li>
                </ul>
            </div>

            <div class="space-y-3">
                <button onclick="location.reload()" class="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition">
                    <i class="fas fa-sync-alt"></i> 再接続を試す
                </button>
                
                <a href="/integrated-dashboard.html" class="block w-full bg-gray-100 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-200 transition">
                    <i class="fas fa-home"></i> ダッシュボードに戻る
                </a>
            </div>

            <div class="mt-8 text-sm text-gray-500">
                <p>オンラインに戻ると、オフラインで記録したデータが自動的に同期されます。</p>
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-sm text-gray-600">
                <i class="fas fa-mobile-alt"></i>
                このアプリはPWA (Progressive Web App) として動作しています
            </p>
        </div>
    </div>

    <script>
        // オンライン復帰を監視
        window.addEventListener('online', () => {
            console.log('オンラインに復帰しました');
            
            // 通知を表示
            const notification = document.createElement('div');
            notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg';
            notification.innerHTML = '<i class="fas fa-check-circle"></i> オンラインに復帰しました';
            document.body.appendChild(notification);
            
            // 3秒後に自動リロード
            setTimeout(() => {
                location.reload();
            }, 3000);
        });
    </script>
</body>
</html>
