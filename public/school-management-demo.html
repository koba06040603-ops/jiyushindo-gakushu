<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 10: 学校管理システムデモ</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <!-- ヘッダー -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-school mr-2 text-green-600"></i>
                Phase 10: 学校・自治体向け管理システム
            </h1>
            <p class="text-gray-600">多クラス管理、学年別サマリ、教師向けダッシュボード、保護者通知システム</p>
        </div>

        <!-- タブ -->
        <div class="bg-white rounded-lg shadow-md mb-6">
            <div class="flex border-b">
                <button onclick="showTab('multi-class')" class="tab-btn px-6 py-3 font-semibold text-gray-700 border-b-2 border-blue-600" id="tab-multi-class">
                    <i class="fas fa-users mr-2"></i>多クラス管理
                </button>
                <button onclick="showTab('grade-summary')" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-gray-700" id="tab-grade-summary">
                    <i class="fas fa-chart-bar mr-2"></i>学年別サマリ
                </button>
                <button onclick="showTab('teacher-analysis')" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-gray-700" id="tab-teacher-analysis">
                    <i class="fas fa-chalkboard-teacher mr-2"></i>教師向け分析
                </button>
                <button onclick="showTab('parent-notify')" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-gray-700" id="tab-parent-notify">
                    <i class="fas fa-envelope mr-2"></i>保護者通知
                </button>
                <button onclick="showTab('school-report')" class="tab-btn px-6 py-3 font-semibold text-gray-500 hover:text-gray-700" id="tab-school-report">
                    <i class="fas fa-file-pdf mr-2"></i>学校レポート
                </button>
            </div>
        </div>

        <!-- 多クラス管理タブ -->
        <div id="content-multi-class" class="tab-content">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-users mr-2 text-blue-600"></i>
                    多クラス管理（学校ID: 1）
                </h2>
                
                <button onclick="loadMultiClassProgress()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mb-4">
                    <i class="fas fa-sync mr-2"></i>クラス進捗を取得
                </button>

                <div id="classesTable" class="overflow-x-auto">
                    <table class="min-w-full bg-white border">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 border">クラスコード</th>
                                <th class="px-4 py-2 border">クラス名</th>
                                <th class="px-4 py-2 border">学年</th>
                                <th class="px-4 py-2 border">担任教師</th>
                                <th class="px-4 py-2 border">生徒数</th>
                                <th class="px-4 py-2 border">平均進捗率</th>
                                <th class="px-4 py-2 border">平均習熟度</th>
                            </tr>
                        </thead>
                        <tbody id="classesTableBody">
                            <tr>
                                <td colspan="7" class="px-4 py-8 text-center text-gray-500">
                                    「クラス進捗を取得」ボタンをクリックしてください
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 学年別サマリタブ -->
        <div id="content-grade-summary" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chart-bar mr-2 text-green-600"></i>
                    学年別サマリ（学校ID: 1）
                </h2>
                
                <button onclick="loadGradeSummary()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 mb-4">
                    <i class="fas fa-sync mr-2"></i>学年別データを取得
                </button>

                <div id="gradeSummaryCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- 学年別カードがここに表示されます -->
                </div>

                <div class="mt-6">
                    <canvas id="gradeProgressChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 教師向け分析タブ -->
        <div id="content-teacher-analysis" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chalkboard-teacher mr-2 text-purple-600"></i>
                    教師向けクラス分析
                </h2>
                
                <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 mb-2">教師ID:</label>
                        <input type="number" id="teacherId" class="border rounded p-2 w-full" value="1">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">クラスコード:</label>
                        <input type="text" id="classCodeInput" class="border rounded p-2 w-full" value="CLASS001">
                    </div>
                </div>
                
                <button onclick="loadTeacherAnalysis()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 mb-4">
                    <i class="fas fa-chart-line mr-2"></i>分析データを取得
                </button>

                <div id="teacherAnalysisResult" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <div class="text-gray-600 text-sm">総生徒数</div>
                            <div id="totalStudents" class="text-3xl font-bold text-blue-600">-</div>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg">
                            <div class="text-gray-600 text-sm">平均進捗率</div>
                            <div id="avgProgress" class="text-3xl font-bold text-green-600">-</div>
                        </div>
                        <div class="bg-yellow-50 p-4 rounded-lg">
                            <div class="text-gray-600 text-sm">平均習熟度</div>
                            <div id="avgMastery" class="text-3xl font-bold text-yellow-600">-</div>
                        </div>
                    </div>

                    <h3 class="text-xl font-bold text-gray-800 mb-4">生徒別詳細</h3>
                    <div id="studentDetailsList" class="space-y-2">
                        <!-- 生徒別詳細がここに表示されます -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 保護者通知タブ -->
        <div id="content-parent-notify" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-envelope mr-2 text-red-600"></i>
                    保護者通知システム
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 通知送信フォーム -->
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 mb-4">通知送信</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-gray-700 mb-2">生徒ID:</label>
                                <input type="number" id="notifyStudentId" class="border rounded p-2 w-full" value="1">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2">保護者メール:</label>
                                <input type="email" id="parentEmail" class="border rounded p-2 w-full" value="parent@example.com">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2">通知タイプ:</label>
                                <select id="notificationType" class="border rounded p-2 w-full">
                                    <option value="email">メール</option>
                                    <option value="push">プッシュ通知</option>
                                    <option value="sms">SMS</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2">件名:</label>
                                <input type="text" id="notifySubject" class="border rounded p-2 w-full" value="学習進捗報告">
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2">メッセージ:</label>
                                <textarea id="notifyMessage" class="border rounded p-2 w-full h-24">お子様の学習進捗をお知らせします。</textarea>
                            </div>
                            <button onclick="sendParentNotification()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 w-full">
                                <i class="fas fa-paper-plane mr-2"></i>通知を送信
                            </button>
                        </div>
                    </div>

                    <!-- 通知履歴 -->
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 mb-4">通知履歴</h3>
                        <div class="mb-4">
                            <label class="block text-gray-700 mb-2">生徒ID:</label>
                            <input type="number" id="historyStudentId" class="border rounded p-2 w-full" value="1">
                            <button onclick="loadNotificationHistory()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">
                                <i class="fas fa-history mr-2"></i>履歴を取得
                            </button>
                        </div>
                        <div id="notificationHistory" class="space-y-2 max-h-96 overflow-y-auto">
                            <!-- 通知履歴がここに表示されます -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 学校レポートタブ -->
        <div id="content-school-report" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-file-pdf mr-2 text-orange-600"></i>
                    学校全体レポート
                </h2>
                
                <div class="mb-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-gray-700 mb-2">学校ID:</label>
                        <input type="number" id="reportSchoolId" class="border rounded p-2 w-full" value="1">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">開始日:</label>
                        <input type="date" id="reportStartDate" class="border rounded p-2 w-full" value="2026-01-01">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">終了日:</label>
                        <input type="date" id="reportEndDate" class="border rounded p-2 w-full" value="2026-01-30">
                    </div>
                </div>
                
                <button onclick="loadSchoolReport()" class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700 mb-4">
                    <i class="fas fa-download mr-2"></i>レポートデータを取得
                </button>

                <div id="schoolReportResult" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div class="bg-blue-50 p-4 rounded-lg text-center">
                            <div class="text-gray-600 text-sm">総生徒数</div>
                            <div id="reportTotalStudents" class="text-3xl font-bold text-blue-600">-</div>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg text-center">
                            <div class="text-gray-600 text-sm">総クラス数</div>
                            <div id="reportTotalClasses" class="text-3xl font-bold text-green-600">-</div>
                        </div>
                        <div class="bg-yellow-50 p-4 rounded-lg text-center">
                            <div class="text-gray-600 text-sm">平均進捗率</div>
                            <div id="reportAvgProgress" class="text-3xl font-bold text-yellow-600">-</div>
                        </div>
                        <div class="bg-purple-50 p-4 rounded-lg text-center">
                            <div class="text-gray-600 text-sm">総学習時間</div>
                            <div id="reportTotalTime" class="text-3xl font-bold text-purple-600">-</div>
                        </div>
                    </div>

                    <div class="bg-gray-50 p-4 rounded-lg">
                        <h3 class="text-lg font-bold text-gray-800 mb-2">学校情報</h3>
                        <div id="schoolInfoDisplay" class="text-gray-700"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let gradeChart;

        function showTab(tabName) {
            // すべてのタブコンテンツを非表示
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            // すべてのタブボタンをリセット
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-b-2', 'border-blue-600', 'text-gray-700');
                el.classList.add('text-gray-500');
            });

            // 選択されたタブを表示
            document.getElementById('content-' + tabName).classList.remove('hidden');
            const btn = document.getElementById('tab-' + tabName);
            btn.classList.add('border-b-2', 'border-blue-600', 'text-gray-700');
            btn.classList.remove('text-gray-500');
        }

        async function loadMultiClassProgress() {
            const schoolId = 1;
            try {
                const response = await fetch(`/api/school/${schoolId}/classes`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    displayClassesTable(result.data);
                } else {
                    alert('エラー: ' + (result.error || 'データ取得に失敗'));
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        function displayClassesTable(classes) {
            const tbody = document.getElementById('classesTableBody');
            tbody.innerHTML = '';
            
            if (classes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">クラスデータがありません</td></tr>';
                return;
            }

            classes.forEach(cls => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-4 py-2 border">${cls.class_code}</td>
                    <td class="px-4 py-2 border font-semibold">${cls.class_name}</td>
                    <td class="px-4 py-2 border text-center">${cls.grade}年</td>
                    <td class="px-4 py-2 border">${cls.teacher_name || 'N/A'}</td>
                    <td class="px-4 py-2 border text-center">${cls.student_count}人</td>
                    <td class="px-4 py-2 border text-center">
                        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded">${cls.total_progress.toFixed(1)}%</span>
                    </td>
                    <td class="px-4 py-2 border text-center">
                        <span class="bg-green-100 text-green-800 px-2 py-1 rounded">${cls.average_mastery.toFixed(1)}</span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function loadGradeSummary() {
            const schoolId = 1;
            try {
                const response = await fetch(`/api/school/${schoolId}/grade-summary`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    displayGradeSummary(result.data);
                } else {
                    alert('エラー: ' + (result.error || 'データ取得に失敗'));
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        function displayGradeSummary(grades) {
            const container = document.getElementById('gradeSummaryCards');
            container.innerHTML = '';

            grades.forEach(grade => {
                const card = document.createElement('div');
                card.className = 'bg-gradient-to-br from-green-50 to-blue-50 p-6 rounded-lg border-2 border-green-200';
                card.innerHTML = `
                    <h3 class="text-2xl font-bold text-gray-800 mb-4">${grade.grade}年生</h3>
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <span class="text-gray-600">生徒数:</span>
                            <span class="font-bold">${grade.total_students}人</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">クラス数:</span>
                            <span class="font-bold">${grade.total_classes}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">平均進捗:</span>
                            <span class="font-bold text-blue-600">${grade.average_progress.toFixed(1)}%</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">トップクラス:</span>
                            <span class="font-bold text-green-600">${grade.top_performing_class}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">支援必要:</span>
                            <span class="font-bold text-red-600">${grade.needs_support_count}人</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // チャート表示
            if (gradeChart) gradeChart.destroy();
            const ctx = document.getElementById('gradeProgressChart').getContext('2d');
            gradeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: grades.map(g => `${g.grade}年生`),
                    datasets: [{
                        label: '平均進捗率',
                        data: grades.map(g => g.average_progress),
                        backgroundColor: 'rgba(34, 197, 94, 0.5)',
                        borderColor: 'rgba(34, 197, 94, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }

        async function loadTeacherAnalysis() {
            const teacherId = document.getElementById('teacherId').value;
            const classCode = document.getElementById('classCodeInput').value;
            
            try {
                const response = await fetch(`/api/teacher/${teacherId}/class/${classCode}/analysis`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    displayTeacherAnalysis(result.data);
                } else {
                    alert('エラー: ' + (result.error || 'データ取得に失敗'));
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        function displayTeacherAnalysis(data) {
            document.getElementById('teacherAnalysisResult').classList.remove('hidden');
            
            if (data.class_info) {
                document.getElementById('totalStudents').textContent = data.class_info.total_students || 0;
                document.getElementById('avgProgress').textContent = (data.class_info.average_progress || 0).toFixed(1) + '%';
                document.getElementById('avgMastery').textContent = (data.class_info.average_mastery || 0).toFixed(1);
            }

            const list = document.getElementById('studentDetailsList');
            list.innerHTML = '';

            if (data.student_details && data.student_details.length > 0) {
                data.student_details.forEach(student => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-3 bg-gray-50 rounded hover:bg-gray-100';
                    item.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">
                                ${(student.student_name || '生徒').charAt(0)}
                            </div>
                            <div>
                                <div class="font-semibold">${student.student_name || '生徒'}</div>
                                <div class="text-xs text-gray-500">学習スタイル: ${student.learning_style || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-blue-600">${(student.progress_percentage || 0).toFixed(1)}%</div>
                            <div class="text-xs text-gray-500">習熟度: ${(student.mastery_level || 0).toFixed(1)}</div>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } else {
                list.innerHTML = '<p class="text-gray-600">生徒データがありません</p>';
            }
        }

        async function sendParentNotification() {
            const notification = {
                student_id: parseInt(document.getElementById('notifyStudentId').value),
                parent_email: document.getElementById('parentEmail').value,
                notification_type: document.getElementById('notificationType').value,
                subject: document.getElementById('notifySubject').value,
                message: document.getElementById('notifyMessage').value
            };

            try {
                const response = await fetch('/api/parent/notify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(notification)
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('通知が送信されました！');
                    loadNotificationHistory();
                } else {
                    alert('エラー: ' + result.error);
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        async function loadNotificationHistory() {
            const studentId = document.getElementById('historyStudentId').value;
            
            try {
                const response = await fetch(`/api/parent/notifications/${studentId}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    displayNotificationHistory(result.data);
                } else {
                    alert('エラー: ' + (result.error || 'データ取得に失敗'));
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        function displayNotificationHistory(history) {
            const container = document.getElementById('notificationHistory');
            container.innerHTML = '';

            if (history.length === 0) {
                container.innerHTML = '<p class="text-gray-600">通知履歴がありません</p>';
                return;
            }

            history.forEach(notif => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-50 rounded border-l-4 ' + 
                    (notif.status === 'sent' ? 'border-green-500' : 
                     notif.status === 'failed' ? 'border-red-500' : 'border-yellow-500');
                item.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-semibold">${notif.subject}</span>
                        <span class="text-xs px-2 py-1 rounded ${
                            notif.status === 'sent' ? 'bg-green-100 text-green-800' :
                            notif.status === 'failed' ? 'bg-red-100 text-red-800' :
                            'bg-yellow-100 text-yellow-800'
                        }">${notif.status}</span>
                    </div>
                    <div class="text-sm text-gray-600">${notif.message.substring(0, 100)}...</div>
                    <div class="text-xs text-gray-500 mt-1">
                        ${notif.notification_type} | ${new Date(notif.created_at).toLocaleString('ja-JP')}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function loadSchoolReport() {
            const schoolId = document.getElementById('reportSchoolId').value;
            const startDate = document.getElementById('reportStartDate').value;
            const endDate = document.getElementById('reportEndDate').value;
            
            try {
                const response = await fetch(`/api/school/${schoolId}/report?start_date=${startDate}&end_date=${endDate}`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    displaySchoolReport(result.data);
                } else {
                    alert('エラー: ' + (result.error || 'データ取得に失敗'));
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        function displaySchoolReport(data) {
            document.getElementById('schoolReportResult').classList.remove('hidden');

            if (data.overall_stats) {
                document.getElementById('reportTotalStudents').textContent = data.overall_stats.total_students || 0;
                document.getElementById('reportTotalClasses').textContent = data.overall_stats.total_classes || 0;
                document.getElementById('reportAvgProgress').textContent = (data.overall_stats.average_progress || 0).toFixed(1) + '%';
                const totalHours = ((data.overall_stats.total_learning_time || 0) / 3600).toFixed(1);
                document.getElementById('reportTotalTime').textContent = totalHours + '時間';
            }

            if (data.school_info) {
                const infoDiv = document.getElementById('schoolInfoDisplay');
                infoDiv.innerHTML = `
                    <div class="grid grid-cols-2 gap-2">
                        <div><strong>学校名:</strong> ${data.school_info.school_name || 'N/A'}</div>
                        <div><strong>種別:</strong> ${data.school_info.school_type || 'N/A'}</div>
                        <div><strong>自治体:</strong> ${data.school_info.municipality || 'N/A'}</div>
                        <div><strong>都道府県:</strong> ${data.school_info.prefecture || 'N/A'}</div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
