<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クラス全体の学習進捗比較ビュー - 松川村AI学習システム</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .student-card {
            transition: all 0.3s ease;
        }
        .student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .heatmap-cell {
            transition: all 0.2s ease;
        }
        .heatmap-cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }
        .progress-bar-animated {
            animation: progress-fill 1s ease-in-out;
        }
        @keyframes progress-fill {
            from { width: 0%; }
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .attention-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- ヘッダー -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-chalkboard-teacher text-3xl text-indigo-600"></i>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">クラス全体の学習進捗比較</h1>
                        <p class="text-sm text-gray-600">リアルタイムで学習状況を可視化</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="refreshBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        <i class="fas fa-sync-alt mr-2"></i>更新
                    </button>
                    <button id="exportBtn" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-file-excel mr-2"></i>エクスポート
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- フィルターとサマリー -->
        <div class="mb-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                <!-- 統計カード -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">総生徒数</p>
                            <p class="text-3xl font-bold text-gray-900 mt-2" id="totalStudents">30</p>
                        </div>
                        <div class="bg-blue-100 rounded-full p-3">
                            <i class="fas fa-users text-2xl text-blue-600"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">平均正答率</p>
                            <p class="text-3xl font-bold text-green-600 mt-2" id="avgAccuracy">78%</p>
                        </div>
                        <div class="bg-green-100 rounded-full p-3">
                            <i class="fas fa-chart-line text-2xl text-green-600"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">順調な生徒</p>
                            <p class="text-3xl font-bold text-indigo-600 mt-2" id="onTrack">24</p>
                        </div>
                        <div class="bg-indigo-100 rounded-full p-3">
                            <i class="fas fa-check-circle text-2xl text-indigo-600"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-600">要サポート</p>
                            <p class="text-3xl font-bold text-red-600 mt-2 attention-pulse" id="needsSupport">6</p>
                        </div>
                        <div class="bg-red-100 rounded-full p-3">
                            <i class="fas fa-exclamation-triangle text-2xl text-red-600"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- フィルター -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-book mr-2"></i>教科
                        </label>
                        <select id="subjectFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="all">すべての教科</option>
                            <option value="算数">算数</option>
                            <option value="国語">国語</option>
                            <option value="理科">理科</option>
                            <option value="社会">社会</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-layer-group mr-2"></i>単元
                        </label>
                        <select id="unitFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="all">すべての単元</option>
                            <option value="unit1">分数の計算</option>
                            <option value="unit2">小数の計算</option>
                            <option value="unit3">図形の面積</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-filter mr-2"></i>進捗状況
                        </label>
                        <select id="progressFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="all">すべて</option>
                            <option value="ahead">進んでいる</option>
                            <option value="on-track">順調</option>
                            <option value="behind">遅れている</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-sort mr-2"></i>並び替え
                        </label>
                        <select id="sortBy" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="name">名前順</option>
                            <option value="accuracy">正答率順</option>
                            <option value="progress">進捗順</option>
                            <option value="recent">最近の活動順</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- タブナビゲーション -->
        <div class="mb-6">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-8">
                    <button class="tab-btn active border-b-2 border-indigo-600 py-4 px-1 text-sm font-medium text-indigo-600" data-tab="heatmap">
                        <i class="fas fa-th mr-2"></i>ヒートマップ
                    </button>
                    <button class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="list">
                        <i class="fas fa-list mr-2"></i>リスト表示
                    </button>
                    <button class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="distribution">
                        <i class="fas fa-chart-bar mr-2"></i>習熟度分布
                    </button>
                    <button class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300" data-tab="attention">
                        <i class="fas fa-exclamation-circle mr-2"></i>要サポート生徒
                    </button>
                </nav>
            </div>
        </div>

        <!-- タブコンテンツ -->
        <div id="tabContent">
            <!-- ヒートマップビュー -->
            <div id="heatmapView" class="tab-content active">
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">
                        <i class="fas fa-fire text-orange-500 mr-2"></i>単元別習熟度ヒートマップ
                    </h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full" id="heatmapTable">
                            <thead>
                                <tr class="border-b border-gray-200">
                                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sticky left-0 bg-white">生徒名</th>
                                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">単元1</th>
                                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">単元2</th>
                                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">単元3</th>
                                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">単元4</th>
                                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">単元5</th>
                                    <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">総合</th>
                                </tr>
                            </thead>
                            <tbody id="heatmapBody">
                                <!-- 動的に生成 -->
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-6 flex items-center justify-center space-x-6">
                        <div class="flex items-center space-x-2">
                            <div class="w-4 h-4 bg-red-500 rounded"></div>
                            <span class="text-sm text-gray-600">0-40% (要サポート)</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-4 h-4 bg-yellow-500 rounded"></div>
                            <span class="text-sm text-gray-600">41-69% (努力中)</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-4 h-4 bg-green-500 rounded"></div>
                            <span class="text-sm text-gray-600">70-89% (良好)</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-4 h-4 bg-blue-500 rounded"></div>
                            <span class="text-sm text-gray-600">90-100% (優秀)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- リスト表示ビュー -->
            <div id="listView" class="tab-content hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="studentList">
                    <!-- 動的に生成 -->
                </div>
            </div>

            <!-- 習熟度分布ビュー -->
            <div id="distributionView" class="tab-content hidden">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">正答率分布</h3>
                        <canvas id="accuracyChart"></canvas>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">進捗状況分布</h3>
                        <canvas id="progressChart"></canvas>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">単元別平均正答率</h3>
                        <canvas id="unitChart"></canvas>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">学習時間分布</h3>
                        <canvas id="timeChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 要サポート生徒ビュー -->
            <div id="attentionView" class="tab-content hidden">
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">
                        <i class="fas fa-user-nurse text-red-500 mr-2"></i>支援が必要な生徒
                    </h2>
                    <div class="space-y-4" id="attentionList">
                        <!-- 動的に生成 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // サンプルデータ生成
        const students = [
            { id: 1, name: '田中 太郎', units: [85, 72, 90, 68, 78], overall: 79, status: 'on-track', recent: '2時間前' },
            { id: 2, name: '佐藤 花子', units: [92, 88, 95, 91, 89], overall: 91, status: 'ahead', recent: '30分前' },
            { id: 3, name: '鈴木 一郎', units: [45, 52, 38, 48, 41], overall: 45, status: 'behind', recent: '5日前' },
            { id: 4, name: '高橋 美咲', units: [78, 81, 76, 72, 80], overall: 77, status: 'on-track', recent: '1時間前' },
            { id: 5, name: '伊藤 健太', units: [95, 93, 98, 92, 96], overall: 95, status: 'ahead', recent: '15分前' },
            { id: 6, name: '渡辺 さくら', units: [62, 58, 65, 60, 55], overall: 60, status: 'on-track', recent: '3時間前' },
            { id: 7, name: '山本 大輔', units: [38, 42, 35, 40, 44], overall: 40, status: 'behind', recent: '1週間前' },
            { id: 8, name: '中村 愛', units: [88, 85, 90, 87, 91], overall: 88, status: 'ahead', recent: '45分前' },
            { id: 9, name: '小林 翔', units: [70, 75, 72, 68, 73], overall: 72, status: 'on-track', recent: '2時間前' },
            { id: 10, name: '加藤 結衣', units: [82, 78, 85, 80, 83], overall: 82, status: 'on-track', recent: '1時間前' },
            { id: 11, name: '吉田 海斗', units: [55, 48, 52, 50, 46], overall: 50, status: 'behind', recent: '4日前' },
            { id: 12, name: '山田 桃子', units: [91, 89, 94, 90, 92], overall: 91, status: 'ahead', recent: '20分前' },
            { id: 13, name: '佐々木 蓮', units: [76, 72, 78, 74, 75], overall: 75, status: 'on-track', recent: '3時間前' },
            { id: 14, name: '松本 あかり', units: [65, 68, 62, 70, 66], overall: 66, status: 'on-track', recent: '2時間前' },
            { id: 15, name: '井上 颯太', units: [42, 38, 45, 40, 43], overall: 42, status: 'behind', recent: '6日前' },
            { id: 16, name: '木村 ゆい', units: [87, 85, 89, 86, 88], overall: 87, status: 'ahead', recent: '1時間前' },
            { id: 17, name: '林 拓海', units: [73, 70, 75, 72, 74], overall: 73, status: 'on-track', recent: '2時間前' },
            { id: 18, name: '斉藤 花音', units: [96, 94, 98, 95, 97], overall: 96, status: 'ahead', recent: '10分前' },
            { id: 19, name: '清水 陸', units: [58, 55, 60, 57, 59], overall: 58, status: 'on-track', recent: '4時間前' },
            { id: 20, name: '山口 琴音', units: [81, 78, 83, 80, 82], overall: 81, status: 'on-track', recent: '1時間前' },
            { id: 21, name: '森 悠斗', units: [35, 38, 32, 40, 36], overall: 36, status: 'behind', recent: '1週間前' },
            { id: 22, name: '池田 みゆ', units: [89, 87, 91, 88, 90], overall: 89, status: 'ahead', recent: '30分前' },
            { id: 23, name: '橋本 颯', units: [67, 70, 65, 72, 68], overall: 68, status: 'on-track', recent: '3時間前' },
            { id: 24, name: '石川 咲良', units: [93, 91, 95, 92, 94], overall: 93, status: 'ahead', recent: '25分前' },
            { id: 25, name: '前田 大和', units: [52, 48, 55, 50, 53], overall: 52, status: 'behind', recent: '3日前' },
            { id: 26, name: '藤田 はな', units: [79, 76, 81, 78, 80], overall: 79, status: 'on-track', recent: '2時間前' },
            { id: 27, name: '岡田 蒼', units: [71, 68, 73, 70, 72], overall: 71, status: 'on-track', recent: '1時間前' },
            { id: 28, name: '長谷川 結', units: [86, 83, 88, 85, 87], overall: 86, status: 'ahead', recent: '40分前' },
            { id: 29, name: '村上 晴', units: [48, 45, 50, 47, 49], overall: 48, status: 'behind', recent: '5日前' },
            { id: 30, name: '近藤 陽菜', units: [90, 88, 92, 89, 91], overall: 90, status: 'ahead', recent: '20分前' }
        ];

        // 統計を計算
        function updateStatistics() {
            const total = students.length;
            const avgAcc = Math.round(students.reduce((sum, s) => sum + s.overall, 0) / total);
            const onTrack = students.filter(s => s.status === 'on-track' || s.status === 'ahead').length;
            const needsSupport = students.filter(s => s.status === 'behind').length;

            document.getElementById('totalStudents').textContent = total;
            document.getElementById('avgAccuracy').textContent = avgAcc + '%';
            document.getElementById('onTrack').textContent = onTrack;
            document.getElementById('needsSupport').textContent = needsSupport;
        }

        // ヒートマップ生成
        function generateHeatmap() {
            const tbody = document.getElementById('heatmapBody');
            tbody.innerHTML = '';

            students.forEach(student => {
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-100 hover:bg-gray-50';
                
                // 名前セル
                const nameCell = document.createElement('td');
                nameCell.className = 'px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900 sticky left-0 bg-white';
                nameCell.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span>${student.name}</span>
                        ${student.status === 'behind' ? '<i class="fas fa-exclamation-circle text-red-500 text-xs"></i>' : ''}
                    </div>
                `;
                row.appendChild(nameCell);

                // 単元セル
                student.units.forEach(score => {
                    const cell = document.createElement('td');
                    cell.className = 'px-4 py-3 text-center heatmap-cell';
                    const color = getHeatmapColor(score);
                    cell.innerHTML = `
                        <div class="inline-block px-3 py-2 rounded-lg text-white font-bold ${color} cursor-pointer"
                             onclick="showDetailModal('${student.name}', ${score})"
                             title="クリックして詳細表示">
                            ${score}%
                        </div>
                    `;
                    row.appendChild(cell);
                });

                // 総合セル
                const overallCell = document.createElement('td');
                overallCell.className = 'px-4 py-3 text-center';
                overallCell.innerHTML = `
                    <div class="inline-block px-3 py-2 rounded-lg text-white font-bold bg-gray-700">
                        ${student.overall}%
                    </div>
                `;
                row.appendChild(overallCell);

                tbody.appendChild(row);
            });
        }

        // ヒートマップの色を取得
        function getHeatmapColor(score) {
            if (score >= 90) return 'bg-blue-500';
            if (score >= 70) return 'bg-green-500';
            if (score >= 41) return 'bg-yellow-500';
            return 'bg-red-500';
        }

        // リスト表示生成
        function generateList() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';

            students.forEach(student => {
                const card = document.createElement('div');
                card.className = 'student-card bg-white rounded-xl shadow-sm p-6 border border-gray-200';
                
                const statusColor = {
                    'ahead': 'text-blue-600 bg-blue-100',
                    'on-track': 'text-green-600 bg-green-100',
                    'behind': 'text-red-600 bg-red-100'
                }[student.status];

                const statusText = {
                    'ahead': '進んでいる',
                    'on-track': '順調',
                    'behind': '遅れている'
                }[student.status];

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-gray-900">${student.name}</h3>
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColor}">
                            ${statusText}
                        </span>
                    </div>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">総合正答率</span>
                            <span class="text-lg font-bold ${student.overall >= 70 ? 'text-green-600' : 'text-red-600'}">
                                ${student.overall}%
                            </span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="progress-bar-animated ${student.overall >= 70 ? 'bg-green-500' : 'bg-red-500'} h-2 rounded-full" 
                                 style="width: ${student.overall}%"></div>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-600">
                                <i class="fas fa-clock mr-1"></i>最終学習
                            </span>
                            <span class="text-gray-900 font-medium">${student.recent}</span>
                        </div>
                        <button onclick="showStudentDetail(${student.id})" 
                                class="w-full mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                            <i class="fas fa-chart-line mr-2"></i>詳細を見る
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // 習熟度分布グラフ生成
        function generateCharts() {
            // 正答率分布グラフ
            const accuracyCtx = document.getElementById('accuracyChart').getContext('2d');
            const accuracyData = {
                labels: ['0-40%', '41-60%', '61-70%', '71-80%', '81-90%', '91-100%'],
                datasets: [{
                    label: '生徒数',
                    data: [
                        students.filter(s => s.overall <= 40).length,
                        students.filter(s => s.overall > 40 && s.overall <= 60).length,
                        students.filter(s => s.overall > 60 && s.overall <= 70).length,
                        students.filter(s => s.overall > 70 && s.overall <= 80).length,
                        students.filter(s => s.overall > 80 && s.overall <= 90).length,
                        students.filter(s => s.overall > 90).length
                    ],
                    backgroundColor: [
                        'rgba(239, 68, 68, 0.7)',
                        'rgba(251, 191, 36, 0.7)',
                        'rgba(34, 197, 94, 0.5)',
                        'rgba(34, 197, 94, 0.7)',
                        'rgba(59, 130, 246, 0.7)',
                        'rgba(99, 102, 241, 0.7)'
                    ]
                }]
            };
            new Chart(accuracyCtx, {
                type: 'bar',
                data: accuracyData,
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // 進捗状況分布グラフ
            const progressCtx = document.getElementById('progressChart').getContext('2d');
            const progressData = {
                labels: ['進んでいる', '順調', '遅れている'],
                datasets: [{
                    data: [
                        students.filter(s => s.status === 'ahead').length,
                        students.filter(s => s.status === 'on-track').length,
                        students.filter(s => s.status === 'behind').length
                    ],
                    backgroundColor: [
                        'rgba(59, 130, 246, 0.7)',
                        'rgba(34, 197, 94, 0.7)',
                        'rgba(239, 68, 68, 0.7)'
                    ]
                }]
            };
            new Chart(progressCtx, {
                type: 'doughnut',
                data: progressData,
                options: {
                    responsive: true
                }
            });

            // 単元別平均正答率グラフ
            const unitCtx = document.getElementById('unitChart').getContext('2d');
            const unitAverages = [0, 1, 2, 3, 4].map(i => 
                Math.round(students.reduce((sum, s) => sum + s.units[i], 0) / students.length)
            );
            const unitData = {
                labels: ['単元1', '単元2', '単元3', '単元4', '単元5'],
                datasets: [{
                    label: '平均正答率',
                    data: unitAverages,
                    borderColor: 'rgb(99, 102, 241)',
                    backgroundColor: 'rgba(99, 102, 241, 0.2)',
                    fill: true
                }]
            };
            new Chart(unitCtx, {
                type: 'line',
                data: unitData,
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });

            // 学習時間分布グラフ
            const timeCtx = document.getElementById('timeChart').getContext('2d');
            const timeData = {
                labels: ['0-2時間', '3-5時間', '6-8時間', '9-11時間', '12時間以上'],
                datasets: [{
                    label: '生徒数',
                    data: [5, 8, 10, 5, 2],
                    backgroundColor: 'rgba(34, 197, 94, 0.7)'
                }]
            };
            new Chart(timeCtx, {
                type: 'bar',
                data: timeData,
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // 要サポート生徒リスト生成
        function generateAttentionList() {
            const list = document.getElementById('attentionList');
            const needsAttention = students.filter(s => s.status === 'behind');
            
            list.innerHTML = needsAttention.map(student => `
                <div class="border border-red-200 rounded-lg p-4 bg-red-50">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <div class="flex items-center space-x-3 mb-3">
                                <h3 class="text-lg font-bold text-gray-900">${student.name}</h3>
                                <span class="px-3 py-1 rounded-full text-xs font-semibold text-red-600 bg-red-100">
                                    要サポート
                                </span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <p class="text-sm text-gray-600">総合正答率</p>
                                    <p class="text-2xl font-bold text-red-600">${student.overall}%</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">最終学習</p>
                                    <p class="text-sm font-semibold text-gray-900">${student.recent}</p>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <h4 class="text-sm font-semibold text-gray-900">推奨アクション:</h4>
                                <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">
                                    <li>個別指導の実施（弱点単元の復習）</li>
                                    <li>学習計画の見直しと目標設定</li>
                                    <li>保護者への連絡と家庭学習サポート</li>
                                </ul>
                            </div>
                        </div>
                        <button onclick="contactParent(${student.id})" 
                                class="ml-4 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition whitespace-nowrap">
                            <i class="fas fa-envelope mr-2"></i>保護者に連絡
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // タブ切り替え
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;
                
                // タブボタンのアクティブ状態を更新
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'border-indigo-600', 'text-indigo-600');
                    b.classList.add('border-transparent', 'text-gray-500');
                });
                btn.classList.add('active', 'border-indigo-600', 'text-indigo-600');
                btn.classList.remove('border-transparent', 'text-gray-500');
                
                // タブコンテンツの表示/非表示を切り替え
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.add('hidden');
                    content.classList.remove('active');
                });
                const targetView = document.getElementById(`${tabName}View`);
                targetView.classList.remove('hidden');
                targetView.classList.add('active');
            });
        });

        // 詳細モーダル表示
        function showDetailModal(name, score) {
            alert(`${name} - 習熟度: ${score}%\n\n詳細な学習履歴と推奨アクションを表示します。`);
        }

        // 生徒詳細表示
        function showStudentDetail(id) {
            const student = students.find(s => s.id === id);
            alert(`${student.name}の詳細\n\n総合正答率: ${student.overall}%\n状態: ${student.status}\n最終学習: ${student.recent}`);
        }

        // 保護者連絡
        function contactParent(id) {
            const student = students.find(s => s.id === id);
            alert(`${student.name}の保護者に連絡を送信します。\n\n自動的に以下の内容を含むメッセージが送られます:\n- 現在の学習状況\n- 弱点単元\n- 推奨サポート方法`);
        }

        // 更新ボタン
        document.getElementById('refreshBtn').addEventListener('click', () => {
            location.reload();
        });

        // エクスポートボタン
        document.getElementById('exportBtn').addEventListener('click', () => {
            alert('クラス全体の学習進捗データをExcelファイルとしてエクスポートします。\n\n含まれる内容:\n- 生徒別進捗データ\n- 単元別習熟度\n- 要サポート生徒リスト\n- 推奨アクション');
        });

        // 初期化
        updateStatistics();
        generateHeatmap();
        generateList();
        generateCharts();
        generateAttentionList();
    </script>
</body>
</html>
