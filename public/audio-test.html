<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音声テスト</title>
<style>
body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
button { display: block; margin: 10px 0; padding: 15px 30px; font-size: 16px; border: none; border-radius: 10px; color: white; cursor: pointer; width: 100%; }
.btn-tts { background: linear-gradient(135deg, #10B981, #059669); }
.btn-ws { background: linear-gradient(135deg, #6366F1, #8B5CF6); }
.btn-wav { background: linear-gradient(135deg, #F59E0B, #D97706); }
#log { background: #1a1a2e; color: #e0e0e0; padding: 15px; border-radius: 10px; font-size: 13px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
.ok { color: #4ade80; } .err { color: #f87171; } .info { color: #60a5fa; }
</style>
</head>
<body>
<h1>🔊 音声解説テスト</h1>
<p>各ボタンを押して音声が再生されるか確認してください。</p>

<button class="btn-tts" onclick="testGeminiTTS()">1️⃣ Gemini TTS → WAV再生テスト</button>
<button class="btn-ws" onclick="testWebSpeech()">2️⃣ Web Speech API テスト</button>
<button class="btn-wav" onclick="testDirectPCM()">3️⃣ PCM直接再生テスト (AudioContext)</button>

<h3>ログ:</h3>
<div id="log"></div>

<script>
function log(msg, cls) {
  var el = document.getElementById('log');
  var span = document.createElement('span');
  span.className = cls || '';
  span.textContent = new Date().toLocaleTimeString() + ' ' + msg + '\n';
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}

// Test 1: Full Gemini TTS → WAV
async function testGeminiTTS() {
  log('=== Gemini TTS → WAV テスト開始 ===', 'info');
  try {
    log('Step 1: TTS API呼び出し中...');
    var resp = await fetch('/api/ai/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: 'これはテストです。音声が聞こえますか？', voiceType: 'male-friendly' })
    });
    var data = await resp.json();
    log('Step 2: TTS応答: success=' + data.success + ', format=' + data.audioFormat + ', contentLen=' + (data.audioContent||'').length, data.success ? 'ok' : 'err');
    
    if (!data.success || !data.audioContent) {
      log('ERROR: TTS失敗: ' + JSON.stringify(data), 'err');
      return;
    }
    
    log('Step 3: PCM→WAV変換...');
    var raw = atob(data.audioContent);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    var sr = data.sampleRate || 24000;
    
    var wavHeader = new ArrayBuffer(44);
    var v = new DataView(wavHeader);
    v.setUint32(0, 0x52494646, false); // RIFF
    v.setUint32(4, 36 + bytes.length, true);
    v.setUint32(8, 0x57415645, false); // WAVE
    v.setUint32(12, 0x666d7420, false); // fmt
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); // PCM
    v.setUint16(22, 1, true); // mono
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true);
    v.setUint16(34, 16, true);
    v.setUint32(36, 0x64617461, false); // data
    v.setUint32(40, bytes.length, true);
    
    var blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
    var url = URL.createObjectURL(blob);
    log('Step 4: WAV Blob作成完了 (size=' + blob.size + ', url=' + url + ')', 'ok');
    
    var audio = new Audio(url);
    audio.onended = function() { log('✅ WAV再生完了!', 'ok'); URL.revokeObjectURL(url); };
    audio.onerror = function(e) { log('❌ WAVエラー: ' + JSON.stringify(e), 'err'); };
    
    log('Step 5: audio.play()呼び出し...');
    await audio.play();
    log('✅ audio.play()成功 - 再生中!', 'ok');
  } catch (e) {
    log('❌ エラー: ' + e.name + ': ' + e.message, 'err');
  }
}

// Test 2: Web Speech API
function testWebSpeech() {
  log('=== Web Speech API テスト開始 ===', 'info');
  if (!window.speechSynthesis) {
    log('❌ speechSynthesis not available', 'err');
    return;
  }
  var u = new SpeechSynthesisUtterance('これはウェブスピーチAPIのテストです。聞こえますか？');
  u.lang = 'ja-JP'; u.rate = 0.9;
  u.onend = function() { log('✅ Web Speech再生完了!', 'ok'); };
  u.onerror = function(e) { log('❌ Web Speechエラー: ' + e.error, 'err'); };
  window.speechSynthesis.speak(u);
  log('speak()呼び出し完了 - 再生中...', 'ok');
}

// Test 3: Direct PCM via AudioContext
async function testDirectPCM() {
  log('=== AudioContext PCM テスト開始 ===', 'info');
  try {
    var resp = await fetch('/api/ai/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: 'オーディオコンテキストのテスト。', voiceType: 'male-friendly' })
    });
    var data = await resp.json();
    if (!data.success || !data.audioContent) {
      log('❌ TTS失敗', 'err'); return;
    }
    
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    log('AudioContext state: ' + ctx.state);
    if (ctx.state === 'suspended') {
      log('resumeを待機中...');
      await ctx.resume();
      log('resumed: ' + ctx.state, 'ok');
    }
    
    var raw = atob(data.audioContent);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    var samples = bytes.length / 2;
    var float32 = new Float32Array(samples);
    var dv = new DataView(bytes.buffer);
    for (var j = 0; j < samples; j++) float32[j] = dv.getInt16(j * 2, true) / 32768.0;
    
    var buffer = ctx.createBuffer(1, float32.length, data.sampleRate || 24000);
    buffer.getChannelData(0).set(float32);
    var source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    source.onended = function() { log('✅ PCM再生完了!', 'ok'); };
    source.start(0);
    log('✅ PCM再生開始 (samples=' + float32.length + ')', 'ok');
  } catch (e) {
    log('❌ エラー: ' + e.name + ': ' + e.message, 'err');
  }
}

log('テストページ読み込み完了。ボタンを押してください。', 'info');
</script>
</body>
</html>
