<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>10機能テスト</title></head>
<body>
<div id="app"></div>
<div id="gradeResult"></div>
<div id="hintsArea" class="bg-yellow-50">
  <div class="bg-white rounded-lg p-4 border border-green-200">
    <div id="hint-0" class="hidden">ヒント1の内容</div>
  </div>
  <div class="bg-white rounded-lg p-4 border border-yellow-200">
    <div id="hint-1" class="hidden">ヒント2の内容</div>
  </div>
  <div class="bg-white rounded-lg p-4 border border-orange-200">
    <div id="hint-2" class="hidden">ヒント3の内容</div>
  </div>
</div>
<div id="answerInput"></div>
<div id="forgetting-heatmap-test"></div>
<div id="tools-handwriting-area"></div>
<div id="loginPasswordInput"></div>
<div id="passwordToggle"></div>

<script>
// Mock state object - must exist BEFORE app.js loads
window.state = {
  selectedCard: { card_id: 99, card_title: 'テストカード', problem_content: 'テスト問題', subject: '理科' },
  selectedCurriculum: { subject: '理科', grade: '5', unit_name: 'テスト単元' },
  courseCards: [
    { card_id: 1, card_title: '水の状態変化', last_reviewed_at: new Date(Date.now() - 48*3600000).toISOString(), review_count: 1, last_was_correct: true },
    { card_id: 2, card_title: '氷のとけ方', last_reviewed_at: new Date(Date.now() - 24*3600000).toISOString(), review_count: 2, last_was_correct: false },
    { card_id: 3, card_title: '沸騰と蒸発', last_reviewed_at: new Date(Date.now() - 1*3600000).toISOString(), review_count: 5, last_was_correct: true },
    { card_id: 4, card_title: '水蒸気', review_count: 0 },
    { card_id: 5, card_title: '結露', last_reviewed_at: new Date(Date.now() - 72*3600000).toISOString(), review_count: 1, last_was_correct: false }
  ]
}
// prevent initializeApp from crashing
window._skipAutoInit = true
</script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
<script src="/static/app.js"></script>
<script>
const results = {}
let testsPassed = 0
let testsFailed = 0

function assert(name, condition, detail) {
  if (condition) {
    results[name] = 'PASS'
    testsPassed++
    console.log('TEST_PASS: ' + name + (detail ? ' | ' + detail : ''))
  } else {
    results[name] = 'FAIL'
    testsFailed++
    console.log('TEST_FAIL: ' + name + (detail ? ' | ' + detail : ''))
  }
}

// ① 触覚フィードバック
assert('T01 HapticFeedback exists', typeof window.HapticFeedback === 'object')
assert('T02 HF.light', typeof HapticFeedback.light === 'function')
assert('T03 HF.medium', typeof HapticFeedback.medium === 'function')
assert('T04 HF.heavy', typeof HapticFeedback.heavy === 'function')
assert('T05 HF.success', typeof HapticFeedback.success === 'function')
assert('T06 HF.error', typeof HapticFeedback.error === 'function')
assert('T07 HF.drag', typeof HapticFeedback.drag === 'function')
assert('T08 HF.hint', typeof HapticFeedback.hint === 'function')
try { HapticFeedback.light(); assert('T09 HF no throw', true) } catch(e) { assert('T09 HF no throw', false, e.message) }

// ② 段階的ヒント開示
assert('T10 getHintState', typeof getHintState === 'function')
assert('T11 revealNextHint', typeof revealNextHint === 'function')
assert('T12 updateHintButton', typeof updateHintButton === 'function')
const hs = getHintState(99)
assert('T13 init level=0', hs.level === 0)
revealNextHint(99)
assert('T14 level=1', getHintState(99).level === 1)
assert('T15 hint-0 visible', document.getElementById('hint-0').style.display !== 'none')
assert('T16 hint-1 hidden', document.getElementById('hint-1').classList.contains('hidden'))
revealNextHint(99)
assert('T17 level=2', getHintState(99).level === 2)
assert('T18 hint-1 visible', !document.getElementById('hint-1').classList.contains('hidden'))
revealNextHint(99)
assert('T19 level=3', getHintState(99).level === 3)
assert('T20 4th=false', revealNextHint(99) === false)

// ③ 感情認識
assert('T21 trackAnswerEmotion', typeof trackAnswerEmotion === 'function')
assert('T22 detectEmotion', typeof detectEmotion === 'function')
assert('T23 showEmotionFeedback', typeof showEmotionFeedback === 'function')
window._emotionTracker = { attempts: [], consecutiveWrong: 0, consecutiveCorrect: 0, lastAnswerTime: 0 }
trackAnswerEmotion(true, 5000); trackAnswerEmotion(true, 4000)
const em3 = trackAnswerEmotion(true, 3000)
assert('T24 excited', em3.emotion === 'excited', em3.emotion)
assert('T25 emoji 🔥', em3.emoji === '🔥')
window._emotionTracker = { attempts: [], consecutiveWrong: 0, consecutiveCorrect: 0, lastAnswerTime: 0 }
trackAnswerEmotion(false, 20000); trackAnswerEmotion(false, 25000)
const em6 = trackAnswerEmotion(false, 30000)
assert('T26 frustrated', em6.emotion === 'frustrated', em6.emotion)
assert('T27 offer_hint', em6.action === 'offer_hint')
showEmotionFeedback(em6)
const toast = document.getElementById('emotion-feedback-toast')
assert('T28 toast created', !!toast)
assert('T29 toast bg inline', toast && toast.style.background.length > 0, toast?.style.cssText)
assert('T30 toast border inline', toast && toast.style.border.length > 0)
if (toast) toast.remove()
showEmotionFeedback({ emotion: 'neutral', message: '' })
assert('T31 neutral no toast', !document.getElementById('emotion-feedback-toast'))

// ④ ZPD
assert('T32 updateZPD', typeof updateZPD === 'function')
assert('T33 renderZPDGauge', typeof renderZPDGauge === 'function')
window._zpdState = { level: 50, streak: 0, maxLevel: 100, history: [] }
updateZPD(true, 'medium')
assert('T34 +10=60', window._zpdState.level === 60)
assert('T35 streak=1', window._zpdState.streak === 1)
updateZPD(true, 'hard')
assert('T36 +15=75', window._zpdState.level === 75)
updateZPD(false, 'medium')
assert('T37 -6=69', window._zpdState.level === 69)
assert('T38 streak=0', window._zpdState.streak === 0)
updateZPD(true, 'easy')
assert('T39 +5=74', window._zpdState.level === 74)
renderZPDGauge()
const gauge = document.getElementById('zpd-gauge-container')
assert('T40 gauge DOM', !!gauge)
assert('T41 gauge SVG', gauge && !!gauge.querySelector('svg'))
assert('T42 gauge shows 74', gauge && gauge.textContent.includes('74'))

// ⑦ 忘却リスクヒートマップ
assert('T43 calcForgetting', typeof calculateForgettingProbability === 'function')
assert('T44 renderHeatmap', typeof renderForgettingHeatmap === 'function')
assert('T45 null→0.95', calculateForgettingProbability(null, 0, false) === 0.95)
const p2 = calculateForgettingProbability(new Date().toISOString(), 10, true)
assert('T46 fresh→low', p2 < 0.05, p2)
const p3 = calculateForgettingProbability(new Date(Date.now() - 48*3600000).toISOString(), 1, false)
assert('T47 48h→high', p3 > 0.5, p3)
// Render with test data
renderForgettingHeatmap(state.courseCards, 'forgetting-heatmap-test')
const hm = document.getElementById('forgetting-heatmap-test')
assert('T48 heatmap HTML', hm && hm.innerHTML.length > 50, 'len=' + (hm?.innerHTML.length || 0))
assert('T49 heatmap grid', hm && !!hm.querySelector('.grid'))

// ⑧ 復習リマインダー
assert('T50 setupReviewReminder', typeof setupReviewReminder === 'function')
assert('T51 checkNotification', typeof checkAndShowReviewNotification === 'function')
assert('T52 updateCardReviewData', typeof updateCardReviewData === 'function')
localStorage.removeItem('cardReviewData')
updateCardReviewData(99, true)
const rd = JSON.parse(localStorage.getItem('cardReviewData') || '[]')
assert('T53 saved 1', rd.length === 1)
assert('T54 card_id=99', rd[0].card_id === 99)
updateCardReviewData(99, false)
const rd2 = JSON.parse(localStorage.getItem('cardReviewData') || '[]')
assert('T55 no dup', rd2.length === 1)
assert('T56 count=2', rd2[0].review_count === 2)
assert('T57 correct=false', rd2[0].last_was_correct === false)

// ⑨ 手書き入力
assert('T58 createHWCanvas', typeof createHandwritingCanvas === 'function')
assert('T59 clearHWCanvas', typeof clearHandwritingCanvas === 'function')
assert('T60 recognizeHW', typeof recognizeHandwriting === 'function')
createHandwritingCanvas('tools-handwriting-area')
const hwc = document.getElementById('hw-canvas-tools-handwriting-area')
assert('T61 canvas created', !!hwc)
assert('T62 canvas ctx', hwc && !!hwc._ctx)

// ⑤⑩ 関数存在
assert('T63 openWhyExploration', typeof openWhyExploration === 'function')
assert('T64 openExperimentSim', typeof openExperimentSimulator === 'function')
assert('T65 generateMindmap', typeof generateMindmap === 'function')

// 学習ツールパネル
assert('T66 openLearningToolsPanel', typeof openLearningToolsPanel === 'function')
assert('T67 genMindmapCurrent', typeof generateMindmapFromCurrentCourse === 'function')
assert('T68 loadForgettingHeatmap', typeof loadForgettingHeatmap === 'function')
assert('T69 setupReminderUI', typeof setupReviewReminderUI === 'function')

// 統合: MutationObserver 正解注入
const gradeResultDiv = document.getElementById('gradeResult')
gradeResultDiv.innerHTML = '<div class="bg-green-50"><span class="text-green-700">正解！すごい！</span></div>'
setTimeout(() => {
  const extras = document.getElementById('post-correct-extras')
  assert('T70 correct UI injected', !!extras)
  assert('T71 なぜ button', extras && extras.innerHTML.includes('なぜ'))
  assert('T72 _postCorrectData', !!window._postCorrectData, JSON.stringify(window._postCorrectData?.subject))
  assert('T73 理科→実験btn', extras && extras.innerHTML.includes('実験'))
  
  // 不正解注入
  gradeResultDiv.innerHTML = '<div class="bg-yellow-50"><span>もう少し！</span></div>'
  setTimeout(() => {
    const incExtras = document.getElementById('post-incorrect-extras')
    assert('T74 incorrect UI injected', !!incExtras)
    assert('T75 progressive hint btn', !!document.getElementById('progressive-hint-btn'))
    
    console.log('SUMMARY: ' + testsPassed + ' passed, ' + testsFailed + ' failed, ' + (testsPassed + testsFailed) + ' total')
  }, 2000)
}, 1500)
</script>
</body></html>
