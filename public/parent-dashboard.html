<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保護者ダッシュボード - 自由進度学習支援システム</title>
    
    <!-- Phase 11-3: アセット最適化 -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js" defer></script>
    <style>
        .child-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .child-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .child-card.selected {
            border: 2px solid #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .stat-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .progress-ring {
            transform: rotate(-90deg);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- ヘッダー -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <i class="fas fa-users text-3xl text-indigo-600 mr-3"></i>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">保護者ダッシュボード</h1>
                        <p class="text-sm text-gray-500" id="parentInfo">読み込み中...</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="refreshData()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                        <i class="fas fa-sync-alt mr-2"></i>更新
                    </button>
                    <button onclick="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                        <i class="fas fa-sign-out-alt mr-2"></i>ログアウト
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- お子さま選択 -->
        <div class="mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-child text-purple-500 mr-2"></i>お子さまを選択
            </h2>
            <div id="childrenSection" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- JavaScriptで動的生成 -->
            </div>
        </div>

        <!-- 選択された子どもの詳細 -->
        <div id="childDetailSection" class="hidden">
            <!-- サマリーカード -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg p-6 text-white">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-sm opacity-90">学習日数</h3>
                        <i class="fas fa-calendar-check text-2xl opacity-75"></i>
                    </div>
                    <p class="text-3xl font-bold" id="stat-days">0</p>
                    <p class="text-xs opacity-75 mt-1">累計学習日数</p>
                </div>

                <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-lg p-6 text-white">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-sm opacity-90">解いた問題</h3>
                        <i class="fas fa-tasks text-2xl opacity-75"></i>
                    </div>
                    <p class="text-3xl font-bold" id="stat-problems">0</p>
                    <p class="text-xs opacity-75 mt-1">総問題数</p>
                </div>

                <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-lg p-6 text-white">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-sm opacity-90">正答率</h3>
                        <i class="fas fa-percentage text-2xl opacity-75"></i>
                    </div>
                    <p class="text-3xl font-bold" id="stat-accuracy">0%</p>
                    <p class="text-xs opacity-75 mt-1">全体の正答率</p>
                </div>

                <div class="bg-gradient-to-br from-orange-500 to-orange-600 rounded-lg p-6 text-white">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-sm opacity-90">学習時間</h3>
                        <i class="fas fa-clock text-2xl opacity-75"></i>
                    </div>
                    <p class="text-3xl font-bold" id="stat-hours">0h</p>
                    <p class="text-xs opacity-75 mt-1">累計学習時間</p>
                </div>
            </div>

            <!-- グラフエリア -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <!-- 週間学習傾向 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">
                        <i class="fas fa-chart-line text-blue-500 mr-2"></i>週間学習傾向
                    </h3>
                    <canvas id="weeklyTrendChart" height="250"></canvas>
                </div>

                <!-- 教科別正答率 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">
                        <i class="fas fa-chart-pie text-green-500 mr-2"></i>教科別正答率
                    </h3>
                    <canvas id="subjectAccuracyChart" height="250"></canvas>
                </div>
            </div>

            <!-- 学習進捗 -->
            <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
                <h3 class="text-lg font-bold text-gray-800 mb-4">
                    <i class="fas fa-tasks text-purple-500 mr-2"></i>学習進捗
                </h3>
                <div id="progressList" class="space-y-3">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>

            <!-- 最近の学習記録 -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">
                    <i class="fas fa-history text-indigo-500 mr-2"></i>最近の学習記録
                </h3>
                <div id="recentLogs" class="space-y-3">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>

            <!-- 教師からのコメント -->
            <div class="bg-white rounded-lg shadow-sm p-6 mt-8">
                <h3 class="text-lg font-bold text-gray-800 mb-4">
                    <i class="fas fa-comments text-yellow-500 mr-2"></i>教師からのコメント
                </h3>
                <div id="teacherComments" class="space-y-3">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // グローバル変数
        let currentParent = null;
        let children = [];
        let selectedChild = null;

        // 初期化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadParentInfo();
            await loadChildren();
            renderChildrenCards();
        });

        // 保護者情報を取得
        async function loadParentInfo() {
            try {
                const response = await axios.get('/api/auth/verify');
                currentParent = response.data.user;
                document.getElementById('parentInfo').textContent = 
                    `${currentParent.full_name || currentParent.username}さん`;
            } catch (error) {
                console.error('保護者情報の取得に失敗:', error);
                window.location.href = '/';
            }
        }

        // 子ども一覧を取得
        async function loadChildren() {
            try {
                const response = await axios.get('/api/parent/children');
                children = response.data.children || [];
            } catch (error) {
                console.error('子ども一覧の取得に失敗:', error);
                children = [];
            }
        }

        // 子どもカードを描画
        function renderChildrenCards() {
            const section = document.getElementById('childrenSection');
            
            if (children.length === 0) {
                section.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-user-plus text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500">登録されているお子さまがいません</p>
                    </div>
                `;
                return;
            }

            section.innerHTML = children.map((child, index) => `
                <div class="child-card bg-white rounded-lg shadow-sm p-6 border-2 border-transparent" 
                     onclick="selectChild(${child.student_id})">
                    <div class="flex items-center mb-4">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white text-2xl font-bold mr-4">
                            ${child.student_name.charAt(0)}
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">${child.student_name}</h3>
                            <p class="text-sm text-gray-500">学年: ${child.grade_level || '未設定'}年生</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="stat-badge bg-blue-100 text-blue-700">
                            <i class="fas fa-book mr-2"></i>学習中
                        </span>
                        <button class="text-indigo-600 hover:text-indigo-800 font-semibold">
                            詳細を見る →
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 子どもを選択
        async function selectChild(studentId) {
            selectedChild = children.find(c => c.student_id === studentId);
            
            // カードの選択状態を更新
            document.querySelectorAll('.child-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');

            // 詳細セクションを表示
            document.getElementById('childDetailSection').classList.remove('hidden');

            // データを読み込み
            await loadChildDetails(studentId);
        }

        // 子どもの詳細データを取得
        async function loadChildDetails(studentId) {
            try {
                const [stats, progress, logs, comments] = await Promise.all([
                    axios.get(`/api/learning/stats/${studentId}`),
                    axios.get(`/api/learning/progress/${studentId}`),
                    axios.get(`/api/learning/recent-logs?studentId=${studentId}&limit=10`),
                    axios.get(`/api/parent/teacher-comments/${studentId}`)
                ]);

                renderStats(stats.data);
                renderCharts(studentId);
                renderProgress(progress.data);
                renderRecentLogs(logs.data);
                renderTeacherComments(comments.data);
            } catch (error) {
                console.error('詳細データの取得に失敗:', error);
            }
        }

        // 統計カードを更新
        function renderStats(stats) {
            document.getElementById('stat-days').textContent = stats.totalDays || 0;
            document.getElementById('stat-problems').textContent = stats.totalProblems || 0;
            document.getElementById('stat-accuracy').textContent = `${(stats.accuracy || 0).toFixed(1)}%`;
            document.getElementById('stat-hours').textContent = `${((stats.totalMinutes || 0) / 60).toFixed(1)}h`;
        }

        // グラフを描画
        function renderCharts(studentId) {
            // 週間学習傾向グラフ（仮データ）
            const weeklyCtx = document.getElementById('weeklyTrendChart').getContext('2d');
            new Chart(weeklyCtx, {
                type: 'line',
                data: {
                    labels: ['月', '火', '水', '木', '金', '土', '日'],
                    datasets: [{
                        label: '学習問題数',
                        data: [12, 19, 15, 25, 22, 18, 20],
                        borderColor: 'rgb(99, 102, 241)',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // 教科別正答率グラフ（仮データ）
            const subjectCtx = document.getElementById('subjectAccuracyChart').getContext('2d');
            new Chart(subjectCtx, {
                type: 'doughnut',
                data: {
                    labels: ['算数', '国語', '理科', '社会'],
                    datasets: [{
                        data: [85, 78, 92, 88],
                        backgroundColor: [
                            'rgb(59, 130, 246)',
                            'rgb(16, 185, 129)',
                            'rgb(249, 115, 22)',
                            'rgb(139, 92, 246)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // 進捗を描画
        function renderProgress(progress) {
            const list = document.getElementById('progressList');
            
            if (!progress || progress.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">進捗データがありません</p>';
                return;
            }

            list.innerHTML = progress.slice(0, 5).map(item => {
                const percentage = item.status === 'completed' ? 100 : 
                                  item.status === 'in_progress' ? 50 : 0;
                return `
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-800">${item.unit_name}</h4>
                            <p class="text-sm text-gray-500">${item.subject}</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="w-32 bg-gray-200 rounded-full h-2">
                                <div class="bg-indigo-600 h-2 rounded-full" style="width: ${percentage}%"></div>
                            </div>
                            <span class="text-sm font-semibold ${
                                item.status === 'completed' ? 'text-green-600' :
                                item.status === 'in_progress' ? 'text-blue-600' : 'text-gray-400'
                            }">${percentage}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 最近の学習ログを描画
        function renderRecentLogs(logs) {
            const list = document.getElementById('recentLogs');
            
            if (!logs || logs.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">学習記録がありません</p>';
                return;
            }

            list.innerHTML = logs.slice(0, 5).map(log => `
                <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                    <i class="fas fa-circle text-xs ${log.is_correct ? 'text-green-500' : 'text-red-500'} mr-3"></i>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-900">${log.unit_name || 'カリキュラム'}</p>
                        <p class="text-xs text-gray-500">${new Date(log.created_at).toLocaleString()}</p>
                    </div>
                    <span class="px-3 py-1 text-xs font-semibold rounded-full ${
                        log.is_correct ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                    }">${log.is_correct ? '正解' : '不正解'}</span>
                </div>
            `).join('');
        }

        // 教師からのコメントを描画
        function renderTeacherComments(comments) {
            const list = document.getElementById('teacherComments');
            
            if (!comments || comments.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-4">コメントがありません</p>';
                return;
            }

            list.innerHTML = comments.map(comment => `
                <div class="p-4 bg-yellow-50 border-l-4 border-yellow-400 rounded-r-lg">
                    <div class="flex items-start">
                        <i class="fas fa-user-tie text-yellow-600 text-xl mr-3 mt-1"></i>
                        <div class="flex-1">
                            <p class="text-sm font-semibold text-gray-800">${comment.teacher_name || '先生'}</p>
                            <p class="text-sm text-gray-700 mt-1">${comment.comment}</p>
                            <p class="text-xs text-gray-500 mt-2">${new Date(comment.created_at).toLocaleString()}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ユーティリティ関数
        function refreshData() {
            window.location.reload();
        }

        function logout() {
            if (confirm('ログアウトしますか？')) {
                axios.post('/api/auth/logout')
                    .then(() => window.location.href = '/')
                    .catch(error => console.error('ログアウトエラー:', error));
            }
        }

        // グローバルスコープに公開
        window.selectChild = selectChild;
        window.refreshData = refreshData;
        window.logout = logout;
    </script>
</body>
</html>
