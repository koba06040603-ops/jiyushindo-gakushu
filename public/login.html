<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン — 自由進度学習システム</title>
    <link href="/static/tailwind-minimal.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.3); } 50% { box-shadow: 0 0 0 12px rgba(99,102,241,0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md space-y-6 fade-in">
    <!-- ロゴ・タイトル -->
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-lg mb-4">
            <i class="fas fa-book-open text-4xl text-indigo-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">自由進度学習システム</h1>
        <p class="text-sm text-gray-500 mt-1">ログインして学習をはじめよう</p>
    </div>

    <!-- ログインカード -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fas fa-envelope text-indigo-400 mr-1"></i>メールアドレス
                </label>
                <input id="emailInput" type="email" required
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 text-sm transition"
                    placeholder="example@school.jp">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">
                    <i class="fas fa-lock text-indigo-400 mr-1"></i>パスワード
                </label>
                <div class="relative">
                    <input id="passwordInput" type="password" required
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 text-sm transition pr-10"
                        placeholder="パスワードを入力">
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <i id="eyeIcon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- エラーメッセージ -->
            <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl">
                <i class="fas fa-exclamation-circle mr-1"></i><span id="errorText"></span>
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white py-3 rounded-xl font-bold text-lg shadow-lg transition pulse-glow">
                <i class="fas fa-sign-in-alt mr-2"></i>ログイン
            </button>
        </form>

        <!-- デモログイン -->
        <div class="mt-6 pt-5 border-t border-gray-100">
            <p class="text-xs text-center text-gray-400 mb-3">テスト用かんたんログイン</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="demoLogin('student')"
                    class="flex items-center justify-center gap-2 bg-blue-50 hover:bg-blue-100 text-blue-700 py-2.5 rounded-xl text-sm font-medium transition border border-blue-200">
                    <i class="fas fa-user-graduate"></i>児童としてログイン
                </button>
                <button onclick="demoLogin('teacher')"
                    class="flex items-center justify-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 py-2.5 rounded-xl text-sm font-medium transition border border-emerald-200">
                    <i class="fas fa-chalkboard-teacher"></i>教師としてログイン
                </button>
            </div>
        </div>
    </div>

    <p class="text-center text-xs text-gray-400">
        <i class="fas fa-shield-alt mr-1"></i>通信は暗号化されています
    </p>
</div>

<script>
// すでにログイン済みの場合はリダイレクト
(function checkExistingSession() {
    const token = localStorage.getItem('session_token')
    const user = JSON.parse(localStorage.getItem('user') || 'null')
    if (token && user) {
        redirectByRole(user.role, user.id)
    }
})()

function togglePassword() {
    const input = document.getElementById('passwordInput')
    const icon = document.getElementById('eyeIcon')
    if (input.type === 'password') {
        input.type = 'text'
        icon.classList.replace('fa-eye', 'fa-eye-slash')
    } else {
        input.type = 'password'
        icon.classList.replace('fa-eye-slash', 'fa-eye')
    }
}

function showError(msg) {
    const el = document.getElementById('errorMsg')
    document.getElementById('errorText').textContent = msg
    el.classList.remove('hidden')
}

function hideError() {
    document.getElementById('errorMsg').classList.add('hidden')
}

function redirectByRole(role, userId) {
    if (role === 'teacher' || role === 'admin') {
        window.location.href = '/teacher-dashboard.html'
    } else {
        // 児童生徒 → 学習のてびきページ（教師版と同じリッチ表示、教師ボタンなし）
        window.location.href = `/static/student-home.html?student_id=${userId}`
    }
}

async function handleLogin(event) {
    event.preventDefault()
    hideError()
    const btn = document.getElementById('loginBtn')
    btn.disabled = true
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>ログイン中...'

    try {
        const res = await axios.post('/api/auth/login', {
            email: document.getElementById('emailInput').value,
            password: document.getElementById('passwordInput').value
        })

        if (res.data.success) {
            // トークンとユーザー情報を保存
            localStorage.setItem('session_token', res.data.session_token)
            localStorage.setItem('refresh_token', res.data.refresh_token)
            localStorage.setItem('token', res.data.session_token) // 互換性
            localStorage.setItem('user', JSON.stringify(res.data.user))
            localStorage.setItem('user_id', String(res.data.user.id))
            localStorage.setItem('user_role', res.data.user.role)
            localStorage.setItem('user_name', res.data.user.name)

            // ロールに応じてリダイレクト
            redirectByRole(res.data.user.role, res.data.user.id)
        } else {
            showError(res.data.error || 'ログインに失敗しました')
        }
    } catch (e) {
        const errMsg = e.response?.data?.error || 'ログインに失敗しました。接続を確認してください。'
        showError(errMsg)
    } finally {
        btn.disabled = false
        btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>ログイン'
    }
}

// デモログイン（テスト用）
async function demoLogin(role) {
    hideError()
    // デモユーザーの情報をlocalStorageに直接セット
    const demoUsers = {
        student: { id: 1, name: 'テスト児童', email: 'student@demo.jp', role: 'student', class_code: 'DEMO01' },
        teacher: { id: 100, name: 'テスト教師', email: 'teacher@demo.jp', role: 'teacher', class_code: 'DEMO01' }
    }
    const user = demoUsers[role]

    localStorage.setItem('session_token', `demo_${role}_${Date.now()}`)
    localStorage.setItem('token', `demo_${role}_${Date.now()}`)
    localStorage.setItem('user', JSON.stringify(user))
    localStorage.setItem('user_id', String(user.id))
    localStorage.setItem('user_role', user.role)
    localStorage.setItem('user_name', user.name)

    redirectByRole(user.role, user.id)
}
</script>
</body>
</html>
