<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教員コメント・フィードバック - 松川村AI学習システム</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .comment-card {
            transition: all 0.3s ease;
        }
        .comment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .template-btn {
            transition: all 0.2s ease;
        }
        .template-btn:hover {
            transform: scale(1.05);
        }
        .reaction-icon {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .reaction-icon:hover {
            transform: scale(1.2);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- ヘッダー -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-comments text-3xl text-indigo-600"></i>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">教員コメント・フィードバック</h1>
                        <p class="text-sm text-gray-600">児童の学習にコメント・励ましメッセージを送信</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="statisticsBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-chart-bar mr-2"></i>統計
                    </button>
                    <button id="newCommentBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        <i class="fas fa-plus mr-2"></i>新規コメント
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- フィルター -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2"></i>生徒選択
                    </label>
                    <select id="studentFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">すべての生徒</option>
                        <option value="1">田中 太郎</option>
                        <option value="2">佐藤 花子</option>
                        <option value="3">鈴木 一郎</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-tag mr-2"></i>コメント種類
                    </label>
                    <select id="commentTypeFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">すべて</option>
                        <option value="general">一般</option>
                        <option value="learning_card">学習カード</option>
                        <option value="mistake_note">間違いノート</option>
                        <option value="encouragement">励まし</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-smile mr-2"></i>感情トーン
                    </label>
                    <select id="sentimentFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">すべて</option>
                        <option value="positive">ポジティブ</option>
                        <option value="neutral">中立</option>
                        <option value="constructive">建設的</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-eye mr-2"></i>既読状態
                    </label>
                    <select id="readStatusFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">すべて</option>
                        <option value="read">既読</option>
                        <option value="unread">未読</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- コメント一覧 -->
        <div class="space-y-4" id="commentsList">
            <!-- 動的に生成 -->
        </div>
    </main>

    <!-- 新規コメント作成モーダル -->
    <div id="newCommentModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-comment-medical mr-2 text-indigo-600"></i>新規コメント作成
                    </h2>
                    <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 transition">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
            </div>

            <div class="p-6 space-y-6">
                <!-- 生徒選択 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user-graduate mr-2"></i>送信先の生徒 <span class="text-red-500">*</span>
                    </label>
                    <select id="newStudentSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                        <option value="">生徒を選択してください</option>
                        <option value="1">田中 太郎</option>
                        <option value="2">佐藤 花子</option>
                        <option value="3">鈴木 一郎</option>
                        <option value="4">高橋 美咲</option>
                        <option value="5">伊藤 健太</option>
                    </select>
                </div>

                <!-- コメントタイプ -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-tag mr-2"></i>コメント種類
                        </label>
                        <select id="newCommentType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="general">一般コメント</option>
                            <option value="learning_card">学習カード</option>
                            <option value="mistake_note">間違いノート</option>
                            <option value="encouragement">励まし</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-smile mr-2"></i>感情トーン
                        </label>
                        <select id="newSentiment" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="positive">ポジティブ 😊</option>
                            <option value="neutral">中立 😐</option>
                            <option value="constructive">建設的 💡</option>
                        </select>
                    </div>
                </div>

                <!-- テンプレート選択 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">
                        <i class="fas fa-star mr-2"></i>テンプレートから選択（任意）
                    </label>
                    <div class="grid grid-cols-2 gap-3" id="templateButtons">
                        <!-- 動的に生成 -->
                    </div>
                </div>

                <!-- コメント本文 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-pen mr-2"></i>コメント本文 <span class="text-red-500">*</span>
                    </label>
                    <textarea 
                        id="newCommentText" 
                        rows="6" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 resize-none"
                        placeholder="児童へのコメント・フィードバックを入力してください..."
                        required
                    ></textarea>
                    <div class="flex items-center justify-between mt-2">
                        <p class="text-sm text-gray-500">
                            <span id="charCount">0</span> / 500文字
                        </p>
                        <div class="flex items-center space-x-2">
                            <button id="insertEmojiBtn" class="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                                😊 絵文字
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 追加情報 -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-book mr-2"></i>教科（任意）
                        </label>
                        <select id="newSubject" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                            <option value="">選択なし</option>
                            <option value="算数">算数</option>
                            <option value="国語">国語</option>
                            <option value="理科">理科</option>
                            <option value="社会">社会</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-layer-group mr-2"></i>単元名（任意）
                        </label>
                        <input 
                            type="text" 
                            id="newUnitName" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                            placeholder="例: 分数の計算"
                        >
                    </div>
                </div>

                <!-- 送信ボタン -->
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-200">
                    <button id="cancelBtn" class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition">
                        キャンセル
                    </button>
                    <button id="sendCommentBtn" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                        <i class="fas fa-paper-plane mr-2"></i>送信
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 統計モーダル -->
    <div id="statisticsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-chart-line mr-2 text-blue-600"></i>コメント統計
                    </h2>
                    <button id="closeStatsModalBtn" class="text-gray-400 hover:text-gray-600 transition">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
            </div>

            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl p-6 text-white">
                        <p class="text-sm opacity-90 mb-2">総コメント数</p>
                        <p class="text-4xl font-bold" id="totalCommentsCount">128</p>
                        <p class="text-sm opacity-75 mt-2">過去30日間</p>
                    </div>
                    <div class="bg-gradient-to-br from-green-500 to-emerald-600 rounded-xl p-6 text-white">
                        <p class="text-sm opacity-90 mb-2">平均既読率</p>
                        <p class="text-4xl font-bold" id="avgReadRate">87%</p>
                        <p class="text-sm opacity-75 mt-2">児童の既読率</p>
                    </div>
                    <div class="bg-gradient-to-br from-blue-500 to-cyan-600 rounded-xl p-6 text-white">
                        <p class="text-sm opacity-90 mb-2">リアクション数</p>
                        <p class="text-4xl font-bold" id="totalReactions">245</p>
                        <p class="text-sm opacity-75 mt-2">❤️ 😊 👍</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gray-50 rounded-xl p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">種類別分布</h3>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700">一般コメント</span>
                                <span class="font-bold text-indigo-600">45件</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700">学習カード</span>
                                <span class="font-bold text-green-600">38件</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700">励まし</span>
                                <span class="font-bold text-yellow-600">35件</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700">間違いノート</span>
                                <span class="font-bold text-red-600">10件</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-50 rounded-xl p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">感情トーン分布</h3>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700">😊 ポジティブ</span>
                                <span class="font-bold text-green-600">89件</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700">💡 建設的</span>
                                <span class="font-bold text-blue-600">32件</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-gray-700">😐 中立</span>
                                <span class="font-bold text-gray-600">7件</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // サンプルデータ
        const comments = [
            {
                id: 1,
                student_name: '田中 太郎',
                comment_type: 'learning_card',
                sentiment: 'positive',
                comment_text: 'よくできました！この調子で頑張りましょう！分数の計算の理解度が向上していますね。',
                subject: '算数',
                unit_name: '分数の計算',
                is_read: true,
                read_at: '2026-02-07 15:30:00',
                reaction_count: 2,
                created_at: '2026-02-07 10:15:00'
            },
            {
                id: 2,
                student_name: '佐藤 花子',
                comment_type: 'encouragement',
                sentiment: 'positive',
                comment_text: '最近の成長がすばらしいです。特に漢字の書き取りが丁寧になってきましたね。この調子で続けていきましょう。',
                subject: '国語',
                unit_name: '漢字学習',
                is_read: false,
                read_at: null,
                reaction_count: 0,
                created_at: '2026-02-08 09:45:00'
            },
            {
                id: 3,
                student_name: '鈴木 一郎',
                comment_type: 'mistake_note',
                sentiment: 'constructive',
                comment_text: 'もう一度基礎から確認してみましょう。焦らず、じっくり取り組むことが大切です。ヒントも参考にしてくださいね。',
                subject: '算数',
                unit_name: '小数の計算',
                is_read: true,
                read_at: '2026-02-06 14:20:00',
                reaction_count: 1,
                created_at: '2026-02-06 11:30:00'
            }
        ];

        const templates = [
            { id: 1, name: 'よくできました！', category: 'praise', text: 'よくできました！この調子で頑張りましょう！' },
            { id: 2, name: '成長を感じます', category: 'encouragement', text: '最近の成長がすばらしいです。この調子で続けていきましょう。' },
            { id: 3, name: 'もう一度復習', category: 'feedback', text: 'この単元をもう一度復習してみましょう。基礎からゆっくり確認していきましょう。' },
            { id: 4, name: '考え方は合っています', category: 'feedback', text: '考え方の方向性は合っています。計算の部分を見直してみましょう。' },
            { id: 5, name: 'チャレンジ精神', category: 'praise', text: 'チャレンジする姿勢が素晴らしいです。失敗を恐れずに挑戦しましょう。' },
            { id: 6, name: '完璧です！', category: 'praise', text: '完璧です！理解度が高いですね。次の単元も楽しみです。' }
        ];

        // コメント一覧表示
        function renderComments() {
            const list = document.getElementById('commentsList');
            list.innerHTML = comments.map(comment => `
                <div class="comment-card bg-white rounded-xl shadow-sm p-6 border border-gray-200 slide-in">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-user text-indigo-600 text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-gray-900">${comment.student_name}</h3>
                                <p class="text-sm text-gray-600">
                                    <i class="fas fa-clock mr-1"></i>${comment.created_at}
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${comment.is_read 
                                ? '<span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded-full"><i class="fas fa-check-double mr-1"></i>既読</span>' 
                                : '<span class="px-3 py-1 bg-gray-100 text-gray-700 text-xs font-semibold rounded-full"><i class="fas fa-eye-slash mr-1"></i>未読</span>'}
                            <button class="text-gray-400 hover:text-red-500 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex items-center space-x-2 mb-3">
                            <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-semibold rounded-full">
                                ${getCommentTypeLabel(comment.comment_type)}
                            </span>
                            <span class="px-3 py-1 ${getSentimentColor(comment.sentiment)} text-xs font-semibold rounded-full">
                                ${getSentimentEmoji(comment.sentiment)} ${getSentimentLabel(comment.sentiment)}
                            </span>
                            ${comment.subject ? `<span class="px-3 py-1 bg-gray-100 text-gray-700 text-xs font-semibold rounded-full">${comment.subject}</span>` : ''}
                        </div>
                        <p class="text-gray-800 leading-relaxed">${comment.comment_text}</p>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-gray-200">
                        <div class="flex items-center space-x-4">
                            <span class="text-sm text-gray-600">
                                <i class="fas fa-heart text-red-500 mr-1"></i>
                                ${comment.reaction_count} リアクション
                            </span>
                            ${comment.is_read && comment.read_at ? `
                                <span class="text-sm text-gray-600">
                                    <i class="fas fa-eye text-green-500 mr-1"></i>
                                    既読: ${comment.read_at}
                                </span>
                            ` : ''}
                        </div>
                        <button onclick="editComment(${comment.id})" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition">
                            <i class="fas fa-edit mr-1"></i>編集
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // テンプレートボタン表示
        function renderTemplates() {
            const container = document.getElementById('templateButtons');
            container.innerHTML = templates.map(template => `
                <button onclick="useTemplate('${template.text}')" 
                        class="template-btn px-4 py-3 bg-gradient-to-r from-indigo-50 to-purple-50 hover:from-indigo-100 hover:to-purple-100 border border-indigo-200 rounded-lg text-left transition">
                    <p class="text-sm font-semibold text-indigo-700 mb-1">${template.name}</p>
                    <p class="text-xs text-gray-600 truncate">${template.text}</p>
                </button>
            `).join('');
        }

        // ヘルパー関数
        function getCommentTypeLabel(type) {
            const labels = {
                'general': '一般',
                'learning_card': '学習カード',
                'mistake_note': '間違いノート',
                'encouragement': '励まし'
            };
            return labels[type] || type;
        }

        function getSentimentLabel(sentiment) {
            const labels = {
                'positive': 'ポジティブ',
                'neutral': '中立',
                'constructive': '建設的'
            };
            return labels[sentiment] || sentiment;
        }

        function getSentimentEmoji(sentiment) {
            const emojis = {
                'positive': '😊',
                'neutral': '😐',
                'constructive': '💡'
            };
            return emojis[sentiment] || '';
        }

        function getSentimentColor(sentiment) {
            const colors = {
                'positive': 'bg-green-100 text-green-700',
                'neutral': 'bg-gray-100 text-gray-700',
                'constructive': 'bg-blue-100 text-blue-700'
            };
            return colors[sentiment] || 'bg-gray-100 text-gray-700';
        }

        // テンプレート使用
        function useTemplate(text) {
            document.getElementById('newCommentText').value = text;
            updateCharCount();
        }

        // 文字数カウント
        function updateCharCount() {
            const text = document.getElementById('newCommentText').value;
            document.getElementById('charCount').textContent = text.length;
        }

        // コメント送信
        function sendComment() {
            const studentId = document.getElementById('newStudentSelect').value;
            const commentType = document.getElementById('newCommentType').value;
            const sentiment = document.getElementById('newSentiment').value;
            const commentText = document.getElementById('newCommentText').value;
            const subject = document.getElementById('newSubject').value;
            const unitName = document.getElementById('newUnitName').value;

            if (!studentId || !commentText) {
                alert('生徒とコメント本文は必須です');
                return;
            }

            // API呼び出し（実装時）
            console.log('送信データ:', {
                student_id: studentId,
                comment_type: commentType,
                sentiment: sentiment,
                comment_text: commentText,
                subject: subject || null,
                unit_name: unitName || null
            });

            // 成功メッセージ
            alert('コメントを送信しました！');
            document.getElementById('newCommentModal').classList.add('hidden');
            
            // フォームリセット
            document.getElementById('newStudentSelect').value = '';
            document.getElementById('newCommentText').value = '';
            document.getElementById('newSubject').value = '';
            document.getElementById('newUnitName').value = '';
            updateCharCount();
        }

        // コメント編集
        function editComment(id) {
            alert(`コメント ${id} を編集します`);
        }

        // イベントリスナー
        document.getElementById('newCommentBtn').addEventListener('click', () => {
            document.getElementById('newCommentModal').classList.remove('hidden');
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('newCommentModal').classList.add('hidden');
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('newCommentModal').classList.add('hidden');
        });

        document.getElementById('sendCommentBtn').addEventListener('click', sendComment);

        document.getElementById('statisticsBtn').addEventListener('click', () => {
            document.getElementById('statisticsModal').classList.remove('hidden');
        });

        document.getElementById('closeStatsModalBtn').addEventListener('click', () => {
            document.getElementById('statisticsModal').classList.add('hidden');
        });

        document.getElementById('newCommentText').addEventListener('input', updateCharCount);

        document.getElementById('insertEmojiBtn').addEventListener('click', () => {
            const emojis = ['😊', '👍', '🎉', '💪', '⭐', '✨', '❤️', '🌟'];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const textarea = document.getElementById('newCommentText');
            textarea.value += emoji;
            updateCharCount();
        });

        // 初期化
        renderComments();
        renderTemplates();
        updateCharCount();
    </script>
</body>
</html>
