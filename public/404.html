<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リダイレクト中...</title>
    <script>
        // 404エラー時に.htmlを付けてリダイレクト
        (function() {
            const path = window.location.pathname;
            
            // すでに.htmlで終わっている場合は何もしない
            if (path.endsWith('.html')) {
                document.write('<h1>404 Not Found</h1><p>ページが見つかりませんでした。</p>');
                return;
            }
            
            // .htmlを付けてリダイレクト
            const newPath = path + '.html';
            window.location.replace(newPath);
        })();
    </script>
</head>
<body>
    <p>リダイレクト中...</p>
</body>
</html>
