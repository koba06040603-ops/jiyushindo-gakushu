<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI問題生成 - 自由進度学習支援システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .problem-card {
            transition: all 0.3s ease;
        }
        
        .problem-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .difficulty-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .difficulty-easy { background: #10B981; color: white; }
        .difficulty-medium { background: #3B82F6; color: white; }
        .difficulty-hard { background: #8B5CF6; color: white; }
        
        .generating-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 正解演出 - 赤丸 */
        .correct-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 200px;
            height: 200px;
            border: 10px solid #EF4444;
            border-radius: 50%;
            animation: circleAppear 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }
        
        @keyframes circleAppear {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            60% {
                transform: translate(-50%, -50%) scale(1.2) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(360deg);
                opacity: 1;
            }
        }
        
        /* 花吹雪アニメーション */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f00;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
            pointer-events: none;
            z-index: 999;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 花吹雪の色バリエーション */
        .confetti-red { background: #EF4444; }
        .confetti-yellow { background: #FBBF24; }
        .confetti-green { background: #10B981; }
        .confetti-blue { background: #3B82F6; }
        .confetti-purple { background: #8B5CF6; }
        .confetti-pink { background: #EC4899; }
        
        /* ============================================
           新しいアニメーション（5種類）
           ============================================ */
        
        /* 2. 星キラキラ ⭐ */
        .star-particle {
            position: fixed;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 999;
            animation: starTwinkle 1.5s ease-out forwards;
        }
        
        .star-particle::before {
            content: '⭐';
            font-size: 20px;
            position: absolute;
        }
        
        @keyframes starTwinkle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* 3. ハート舞い 💖 */
        .heart-particle {
            position: fixed;
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 999;
            animation: heartFloat 2.5s ease-out forwards;
        }
        
        .heart-particle::before {
            content: '💖';
            font-size: 30px;
            position: absolute;
        }
        
        @keyframes heartFloat {
            0% {
                transform: translateY(0) scale(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* 4. 虹アーチ 🌈 */
        .rainbow-arc {
            position: fixed;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            border-radius: 0 0 50% 50%;
            background: linear-gradient(
                to right,
                #FF0000 0%,
                #FF7F00 14%,
                #FFFF00 28%,
                #00FF00 42%,
                #0000FF 56%,
                #4B0082 70%,
                #9400D3 84%,
                transparent 100%
            );
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: rainbowAppear 2s ease-in-out forwards;
        }
        
        @keyframes rainbowAppear {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(-100px) scale(0.5);
            }
            30% {
                opacity: 0.9;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            70% {
                opacity: 0.9;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-50px) scale(1.1);
            }
        }
        
        /* 5. 光の輪 ✨ */
        .light-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255, 215, 0, 0.8) 0%,
                rgba(255, 215, 0, 0.4) 40%,
                transparent 70%
            );
            pointer-events: none;
            z-index: 999;
            animation: lightExpand 1.5s ease-out forwards;
        }
        
        @keyframes lightExpand {
            0% {
                width: 50px;
                height: 50px;
                opacity: 1;
            }
            100% {
                width: 800px;
                height: 800px;
                opacity: 0;
            }
        }
        
        /* 光のパーティクル */
        .light-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: gold;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 0 10px gold;
            animation: particleSpread 1.2s ease-out forwards;
        }
        
        @keyframes particleSpread {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
        
        /* 6. バルーン上昇 🎈 */
        .balloon-particle {
            position: fixed;
            width: 40px;
            height: 50px;
            pointer-events: none;
            z-index: 999;
            animation: balloonRise 3s ease-out forwards;
        }
        
        .balloon-particle::before {
            content: '🎈';
            font-size: 40px;
            position: absolute;
        }
        
        @keyframes balloonRise {
            0% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
                transform: translateY(-20vh) translateX(10px) scale(1);
            }
            100% {
                transform: translateY(-120vh) translateX(-20px) scale(0.8);
                opacity: 0;
            }
        }
        
        /* 正解時の背景フラッシュ */
        .flash-correct {
            animation: flashGreen 0.5s ease-in-out;
        }
        
        @keyframes flashGreen {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(16, 185, 129, 0.1); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-brain text-3xl"></i>
                <div>
                    <h1 class="text-2xl font-bold">AI問題生成</h1>
                    <p class="text-sm text-purple-100">あなた専用の問題を自動生成 🎯✨</p>
                </div>
            </div>
            <div class="flex gap-4">
                <a href="/dashboard.html" class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-50 transition">
                    <i class="fas fa-home mr-2"></i>ダッシュボード
                </a>
                <a href="/ai-tutor.html" class="px-4 py-2 bg-purple-500 hover:bg-purple-700 rounded-lg transition">
                    <i class="fas fa-robot mr-2"></i>AIチューター
                </a>
                <a href="/feedback-dashboard.html" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 rounded-lg transition">
                    <i class="fas fa-chart-line mr-2"></i>フィードバック
                </a>
                <button id="logoutBtn" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg transition">
                    <i class="fas fa-sign-out-alt mr-2"></i>ログアウト
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-7xl">
        <!-- 学習パフォーマンスサマリー -->
        <div id="performanceSummary" class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- 動的に生成 -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 問題生成エリア -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 問題生成フォーム -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                        <i class="fas fa-magic text-purple-600"></i>
                        問題を生成する
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- 教科選択 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-book mr-2"></i>教科
                            </label>
                            <select id="subjectSelect" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                <option value="数学">数学</option>
                                <option value="国語">国語</option>
                                <option value="理科">理科</option>
                                <option value="社会">社会</option>
                                <option value="英語">英語</option>
                            </select>
                        </div>

                        <!-- 単元入力 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-tag mr-2"></i>単元名（任意）
                            </label>
                            <input 
                                type="text" 
                                id="unitInput" 
                                placeholder="例: 四則演算、漢字、植物の観察"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                            >
                        </div>

                        <!-- 難易度選択 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-signal mr-2"></i>難易度
                            </label>
                            <div class="grid grid-cols-3 gap-3">
                                <button class="difficulty-btn px-4 py-3 border-2 border-green-500 text-green-700 rounded-lg hover:bg-green-50 transition" data-difficulty="easy">
                                    <i class="fas fa-smile"></i> 基礎
                                </button>
                                <button class="difficulty-btn px-4 py-3 border-2 border-blue-500 text-blue-700 bg-blue-50 rounded-lg hover:bg-blue-100 transition active" data-difficulty="medium">
                                    <i class="fas fa-meh"></i> 標準
                                </button>
                                <button class="difficulty-btn px-4 py-3 border-2 border-purple-500 text-purple-700 rounded-lg hover:bg-purple-50 transition" data-difficulty="hard">
                                    <i class="fas fa-grin-stars"></i> 発展
                                </button>
                            </div>
                            <p id="recommendedDifficulty" class="text-sm text-gray-600 mt-2"></p>
                        </div>

                        <!-- 問題数選択 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-hashtag mr-2"></i>生成する問題数
                            </label>
                            <input 
                                type="range" 
                                id="countInput" 
                                min="1" 
                                max="10" 
                                value="5"
                                class="w-full"
                            >
                            <div class="flex justify-between text-sm text-gray-600 mt-1">
                                <span>1問</span>
                                <span id="countDisplay" class="font-bold text-purple-600">5問</span>
                                <span>10問</span>
                            </div>
                        </div>

                        <!-- 生成ボタン -->
                        <button 
                            id="generateBtn" 
                            class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-bold text-lg hover:from-purple-700 hover:to-pink-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <i class="fas fa-magic mr-2"></i>問題を生成する
                        </button>

                        <!-- AI情報 -->
                        <div class="text-xs text-gray-500 flex items-center gap-2 bg-purple-50 p-3 rounded-lg">
                            <i class="fas fa-info-circle text-purple-600"></i>
                            <span>
                                <span class="font-semibold text-purple-700">AI駆動</span> + 
                                <span class="font-semibold text-blue-700">学習履歴分析</span>で、
                                あなたに最適な問題を生成します
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 生成中表示 -->
                <div id="generatingIndicator" class="hidden bg-white rounded-lg shadow-lg p-8 text-center">
                    <div class="generating-animation mb-4">
                        <i class="fas fa-cog fa-spin text-6xl text-purple-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">問題を生成中...</h3>
                    <p class="text-gray-600">あなた専用の問題を作成しています ✨</p>
                </div>

                <!-- 生成済み問題表示 -->
                <div id="generatedProblems" class="space-y-4">
                    <!-- 動的に生成 -->
                </div>
            </div>

            <!-- サイドバー -->
            <div class="space-y-6">
                <!-- 学習統計 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-chart-bar text-purple-600"></i>
                        学習統計
                    </h3>
                    <div id="learningStats" class="space-y-3">
                        <div class="text-center text-gray-500 py-4">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>読み込み中...</p>
                        </div>
                    </div>
                </div>

                <!-- クイック生成 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-bolt text-orange-500"></i>
                        クイック生成
                    </h3>
                    <div class="space-y-2">
                        <button class="quick-generate w-full text-left px-4 py-3 bg-green-50 hover:bg-green-100 rounded-lg transition" data-subject="数学" data-difficulty="easy">
                            <i class="fas fa-calculator text-green-600 mr-2"></i>
                            数学 - 基礎 (5問)
                        </button>
                        <button class="quick-generate w-full text-left px-4 py-3 bg-blue-50 hover:bg-blue-100 rounded-lg transition" data-subject="国語" data-difficulty="medium">
                            <i class="fas fa-language text-blue-600 mr-2"></i>
                            国語 - 標準 (5問)
                        </button>
                        <button class="quick-generate w-full text-left px-4 py-3 bg-purple-50 hover:bg-purple-100 rounded-lg transition" data-subject="理科" data-difficulty="medium">
                            <i class="fas fa-flask text-purple-600 mr-2"></i>
                            理科 - 標準 (5問)
                        </button>
                        <button class="quick-generate w-full text-left px-4 py-3 bg-orange-50 hover:bg-orange-100 rounded-lg transition" data-subject="社会" data-difficulty="medium">
                            <i class="fas fa-globe text-orange-600 mr-2"></i>
                            社会 - 標準 (5問)
                        </button>
                    </div>
                </div>

                <!-- 最近の問題履歴 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-history text-blue-600"></i>
                        最近の問題
                    </h3>
                    <div id="problemHistory" class="space-y-3">
                        <!-- 動的に生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 問題解答モーダル -->
    <div id="problemModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">問題に挑戦</h3>
                    <button id="closeModal" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>

                <div id="modalContent">
                    <!-- 動的に生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/ui-components.js"></script>
    <script src="/text-to-speech.js"></script>
    <script>
        // 認証確認
        const token = localStorage.getItem('token')
        if (!token) {
            window.location.href = '/auth-demo.html'
        }

        // Axios設定
        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`

        // グローバル変数
        let selectedDifficulty = 'medium'
        let currentProblemId = null

        // ========================================
        // 初期化
        // ========================================
        
        async function init() {
            await Promise.all([
                loadPerformance(),
                loadProblemHistory()
            ])
            setupEventListeners()
        }

        // ========================================
        // 問題生成
        // ========================================
        
        async function generateProblems(subject, difficulty, count, unitName = '') {
            const generateBtn = document.getElementById('generateBtn')
            const generatingIndicator = document.getElementById('generatingIndicator')
            const generatedProblems = document.getElementById('generatedProblems')
            
            // UI更新
            generateBtn.disabled = true
            generatingIndicator.classList.remove('hidden')
            generatedProblems.innerHTML = ''
            
            try {
                const response = await axios.post('/api/problems/generate', {
                    subject,
                    difficulty,
                    count: parseInt(count),
                    unitName
                })
                
                if (response.data.success) {
                    const problems = response.data.problems
                    displayProblems(problems)
                    
                    // 統計更新
                    await loadPerformance()
                    await loadProblemHistory()
                } else {
                    const errorMsg = response.data.error || '問題の生成に失敗しました'
                    const details = response.data.details || ''
                    console.error('❌ API エラー:', errorMsg, details)
                    showError(`${errorMsg}${details ? '\n詳細: ' + details : ''}`)
                }
            } catch (error) {
                console.error('❌ 問題生成エラー:', error)
                let errorMsg = 'エラーが発生しました。もう一度お試しください。'
                
                if (error.response) {
                    // サーバーエラー
                    errorMsg += `\nステータス: ${error.response.status}`
                    if (error.response.data && error.response.data.error) {
                        errorMsg += `\n詳細: ${error.response.data.error}`
                    }
                } else if (error.request) {
                    // ネットワークエラー
                    errorMsg = 'サーバーに接続できませんでした。ネットワークを確認してください。'
                } else {
                    errorMsg += `\n詳細: ${error.message}`
                }
                
                showError(errorMsg)
            } finally {
                generateBtn.disabled = false
                generatingIndicator.classList.add('hidden')
            }
        }

        // ========================================
        // 問題表示
        // ========================================
        
        function displayProblems(problems) {
            const container = document.getElementById('generatedProblems')
            
            if (problems.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>問題が生成されませんでした</p>
                    </div>
                `
                return
            }
            
            container.innerHTML = problems.map((problem, index) => {
                const difficultyColors = {
                    easy: 'difficulty-easy',
                    medium: 'difficulty-medium',
                    hard: 'difficulty-hard'
                }
                
                const difficultyLabels = {
                    easy: '基礎',
                    medium: '標準',
                    hard: '発展'
                }
                
                return `
                    <div class="problem-card bg-white rounded-lg shadow-lg p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-2">
                                <span class="text-2xl font-bold text-purple-600">問題${index + 1}</span>
                                <span class="difficulty-badge ${difficultyColors[problem.difficulty]}">
                                    ${difficultyLabels[problem.difficulty]}
                                </span>
                            </div>
                            <div class="text-sm text-gray-600">
                                <i class="fas fa-book mr-1"></i>${problem.subject}
                                ${problem.unitName ? ` / ${problem.unitName}` : ''}
                            </div>
                        </div>

                        <div class="mb-4">
                            <p class="text-lg text-gray-800 whitespace-pre-wrap">${escapeHtml(problem.question)}</p>
                        </div>

                        <div class="flex gap-2">
                            <button 
                                class="flex-1 px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition"
                                onclick="showProblemModal(${problem.problemId})"
                            >
                                <i class="fas fa-pencil-alt mr-2"></i>解答する
                            </button>
                            <button 
                                class="px-4 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition"
                                onclick="showHint(${problem.problemId})"
                            >
                                <i class="fas fa-lightbulb"></i>
                            </button>
                        </div>
                    </div>
                `
            }).join('')
        }

        // ========================================
        // 問題解答モーダル
        // ========================================
        
        function showProblemModal(problemId) {
            currentProblemId = problemId
            const modal = document.getElementById('problemModal')
            const modalContent = document.getElementById('modalContent')
            
            // 問題取得
            axios.get(`/api/problems/history?limit=100`)

        async function submitAnswer(problemId, problem) {

            if (!userAnswer.trim()) {

        async function loadProblemHistory() {
            try {
                const response = await axios.get('/api/problems/history?limit=5')
                
                if (response.data.success) {
                    const problems = response.data.problems
                    const container = document.getElementById('problemHistory')
                    
                    if (problems.length === 0) {
                        container.innerHTML = `

                            </div>

                            <div class="text-xs text-gray-600 mt-1">

        // ========================================
        // イベントリスナー設定
        // ========================================
        
        function setupEventListeners() {
            // 問題数スライダー
            const countInput = document.getElementById('countInput')
            const countDisplay = document.getElementById('countDisplay')
            countInput.addEventListener('input', (e) => {
                countDisplay.textContent = `${e.target.value}問`
            })

            // 難易度ボタン
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.difficulty-btn').forEach(b => {
                        b.classList.remove('active', 'bg-green-50', 'bg-blue-50', 'bg-purple-50')
                    })
                    btn.classList.add('active')
                    
                    const difficulty = btn.getAttribute('data-difficulty')
                    selectedDifficulty = difficulty
                    
                    if (difficulty === 'easy') btn.classList.add('bg-green-50')
                    else if (difficulty === 'medium') btn.classList.add('bg-blue-50')
                    else btn.classList.add('bg-purple-50')
                })
            })

            // 生成ボタン
            document.getElementById('generateBtn').addEventListener('click', () => {
                const subject = document.getElementById('subjectSelect').value
                const unitName = document.getElementById('unitInput').value
                const count = document.getElementById('countInput').value
                
                generateProblems(subject, selectedDifficulty, count, unitName)
            })

            // クイック生成
            document.querySelectorAll('.quick-generate').forEach(btn => {
                btn.addEventListener('click', () => {
                    const subject = btn.getAttribute('data-subject')
                    const difficulty = btn.getAttribute('data-difficulty')
                    
                    document.getElementById('subjectSelect').value = subject
                    selectedDifficulty = difficulty
                    
                    generateProblems(subject, difficulty, 5)
                })
            })

            // モーダル閉じる
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('problemModal').classList.add('hidden')
            })

            // ログアウト
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('token')
                window.location.href = '/auth-demo.html'
            })
        }

        // ========================================
        // ユーティリティ
        // ========================================
        
        function getDifficultyLabel(difficulty) {
            const labels = {
                easy: '基礎',
                medium: '標準',
                hard: '発展'
            }
            return labels[difficulty] || '標準'
        }

        function showError(message) {
            // 詳細エラー表示
            const container = document.getElementById('generatedProblems')
            container.innerHTML = `
                <div class="bg-red-50 border-l-4 border-red-500 rounded-lg shadow-lg p-6">
                    <div class="flex items-start">
                        <i class="fas fa-exclamation-circle text-red-500 text-3xl mr-4"></i>
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-red-800 mb-2">エラーが発生しました</h3>
                            <p class="text-red-700 whitespace-pre-wrap">${escapeHtml(message)}</p>
                            <div class="mt-4">
                                <button 
                                    onclick="window.location.reload()" 
                                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
                                >
                                    <i class="fas fa-redo mr-2"></i>ページを再読み込み
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `
            
            // コンソールにも出力
            console.error('❌ エラー詳細:', message)
        }

        function escapeHtml(text) {
            const div = document.createElement('div')
            div.textContent = text
            return div.innerHTML
        }
        
        // ========================================
        // 正解演出
        // ========================================
        
        function showCorrectAnimation() {
            // アニメーションの種類をランダムに選択（1-6）
            const animationType = Math.floor(Math.random() * 6) + 1
            
            // 1. 大きな赤丸を表示（全アニメーション共通）
            const circle = document.createElement('div')
            circle.className = 'correct-circle'
            document.body.appendChild(circle)
            
            // 赤丸は0.6秒後に消す
            setTimeout(() => {
                circle.remove()
            }, 600)
            
            // 2. アニメーションタイプに応じて演出を実行
            switch(animationType) {
                case 1:
                    // 花吹雪 🎊
                    createConfettiAnimation()
                    break
                case 2:
                    // 星キラキラ ⭐
                    createStarAnimation()
                    break
                case 3:
                    // ハート舞い 💖
                    createHeartAnimation()
                    break
                case 4:
                    // 虹アーチ 🌈
                    createRainbowAnimation()
                    break
                case 5:
                    // 光の輪 ✨
                    createLightRingAnimation()
                    break
                case 6:
                    // バルーン上昇 🎈
                    createBalloonAnimation()
                    break
            }
            
            // 3. 正解音を再生
            playCorrectSound()
        }
        
        // ========================================
        // アニメーション関数群
        // ========================================
        
        // 1. 花吹雪アニメーション
        function createConfettiAnimation() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createConfetti()
                }, i * 30)
            }
        }
        
        function createConfetti() {
            const confetti = document.createElement('div')
            confetti.className = 'confetti'
            
            // ランダムな色を選択
            const colors = ['confetti-red', 'confetti-yellow', 'confetti-green', 'confetti-blue', 'confetti-purple', 'confetti-pink']
            const randomColor = colors[Math.floor(Math.random() * colors.length)]
            confetti.classList.add(randomColor)
            
            // ランダムな位置から降らせる
            confetti.style.left = Math.random() * 100 + '%'
            confetti.style.top = '-10px'
            
            // ランダムなサイズ（8-15px）
            const size = Math.random() * 7 + 8
            confetti.style.width = size + 'px'
            confetti.style.height = size + 'px'
            
            // ランダムな形状（丸 or 四角）
            if (Math.random() > 0.5) {
                confetti.style.borderRadius = '50%'
            }
            
            // アニメーション時間を少しずつ変える（2.5-3.5秒）
            const duration = Math.random() + 2.5
            confetti.style.animationDuration = duration + 's'
            
            document.body.appendChild(confetti)
            
            // アニメーション終了後に削除
            setTimeout(() => {
                confetti.remove()
            }, duration * 1000)
        }
        
        // 2. 星キラキラアニメーション ⭐
        function createStarAnimation() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const star = document.createElement('div')
                    star.className = 'star-particle'
                    
                    // ランダムな位置に配置
                    star.style.left = (Math.random() * 80 + 10) + '%'
                    star.style.top = (Math.random() * 80 + 10) + '%'
                    
                    // ランダムなサイズ
                    const size = Math.random() * 15 + 15
                    star.style.fontSize = size + 'px'
                    
                    document.body.appendChild(star)
                    
                    // 1.5秒後に削除
                    setTimeout(() => {
                        star.remove()
                    }, 1500)
                }, i * 70)
            }
        }
        
        // 3. ハート舞いアニメーション 💖
        function createHeartAnimation() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div')
                    heart.className = 'heart-particle'
                    
                    // ランダムな横位置に配置（下から上昇）
                    heart.style.left = (Math.random() * 80 + 10) + '%'
                    heart.style.top = '100vh'
                    
                    // ランダムなサイズ
                    const size = Math.random() * 15 + 20
                    heart.style.fontSize = size + 'px'
                    
                    document.body.appendChild(heart)
                    
                    // 2.5秒後に削除
                    setTimeout(() => {
                        heart.remove()
                    }, 2500)
                }, i * 100)
            }
        }
        
        // 4. 虹アーチアニメーション 🌈
        function createRainbowAnimation() {
            const rainbow = document.createElement('div')
            rainbow.className = 'rainbow-arc'
            document.body.appendChild(rainbow)
            
            // 2秒後に削除
            setTimeout(() => {
                rainbow.remove()
            }, 2000)
        }
        
        // 5. 光の輪アニメーション ✨
        function createLightRingAnimation() {
            // 中心の光の輪
            const ring = document.createElement('div')
            ring.className = 'light-ring'
            document.body.appendChild(ring)
            
            setTimeout(() => {
                ring.remove()
            }, 1500)
            
            // 光のパーティクル（30個）
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div')
                    particle.className = 'light-particle'
                    
                    // 中心から放射状に広がる方向を計算
                    const angle = (Math.PI * 2 * i) / 30
                    const distance = 300 + Math.random() * 200
                    const tx = Math.cos(angle) * distance
                    const ty = Math.sin(angle) * distance
                    
                    particle.style.setProperty('--tx', tx + 'px')
                    particle.style.setProperty('--ty', ty + 'px')
                    
                    // 中心に配置
                    particle.style.left = '50%'
                    particle.style.top = '50%'
                    
                    document.body.appendChild(particle)
                    
                    setTimeout(() => {
                        particle.remove()
                    }, 1200)
                }, i * 20)
            }
        }
        
        // 6. バルーン上昇アニメーション 🎈
        function createBalloonAnimation() {
            const balloons = ['🎈', '🎈', '🎈', '🎈', '🎈']
            const colors = ['red', 'blue', 'green', 'yellow', 'purple']
            
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div')
                    balloon.className = 'balloon-particle'
                    balloon.textContent = balloons[Math.floor(Math.random() * balloons.length)]
                    
                    // ランダムな横位置に配置（下から開始）
                    balloon.style.left = (Math.random() * 80 + 10) + '%'
                    balloon.style.top = '100vh'
                    
                    // ランダムなサイズ
                    const size = Math.random() * 20 + 30
                    balloon.style.fontSize = size + 'px'
                    
                    document.body.appendChild(balloon)
                    
                    // 3秒後に削除
                    setTimeout(() => {
                        balloon.remove()
                    }, 3000)
                }, i * 150)
            }
        }
        
        function playCorrectSound() {
            // 正解音（base64エンコードされた短い効果音）
            // 容量制限を考慮して、AudioContext APIで簡単な音を生成
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)()
                
                // 「ピンポーン」のような2音階の音
                const frequencies = [523.25, 659.25] // C5, E5
                frequencies.forEach((freq, index) => {
                    const oscillator = audioContext.createOscillator()
                    const gainNode = audioContext.createGain()
                    
                    oscillator.connect(gainNode)
                    gainNode.connect(audioContext.destination)
                    
                    oscillator.frequency.value = freq
                    oscillator.type = 'sine'
                    
                    // 音量フェードアウト
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + index * 0.2)
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.2 + 0.3)
                    
                    oscillator.start(audioContext.currentTime + index * 0.2)
                    oscillator.stop(audioContext.currentTime + index * 0.2 + 0.3)
                })
            } catch (error) {
                console.log('音声再生に対応していないブラウザです')
            }
        }

        // 初期化実行
        init()
    </script>
