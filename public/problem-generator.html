<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI問題生成 - 自由進度学習支援システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .problem-card {
            transition: all 0.3s ease;
        }
        
        .problem-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .difficulty-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .difficulty-easy { background: #10B981; color: white; }
        .difficulty-medium { background: #3B82F6; color: white; }
        .difficulty-hard { background: #8B5CF6; color: white; }
        
        .generating-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-brain text-3xl"></i>
                <div>
                    <h1 class="text-2xl font-bold">AI問題生成</h1>
                    <p class="text-sm text-purple-100">あなた専用の問題を自動生成 🎯✨</p>
                </div>
            </div>
            <div class="flex gap-4">
                <a href="/dashboard.html" class="px-4 py-2 bg-white text-purple-600 rounded-lg hover:bg-purple-50 transition">
                    <i class="fas fa-home mr-2"></i>ダッシュボード
                </a>
                <a href="/ai-tutor.html" class="px-4 py-2 bg-purple-500 hover:bg-purple-700 rounded-lg transition">
                    <i class="fas fa-robot mr-2"></i>AIチューター
                </a>
                <button id="logoutBtn" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg transition">
                    <i class="fas fa-sign-out-alt mr-2"></i>ログアウト
                </button>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-7xl">
        <!-- 学習パフォーマンスサマリー -->
        <div id="performanceSummary" class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- 動的に生成 -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 問題生成エリア -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 問題生成フォーム -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                        <i class="fas fa-magic text-purple-600"></i>
                        問題を生成する
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- 教科選択 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-book mr-2"></i>教科
                            </label>
                            <select id="subjectSelect" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                <option value="数学">数学</option>
                                <option value="国語">国語</option>
                                <option value="理科">理科</option>
                                <option value="社会">社会</option>
                                <option value="英語">英語</option>
                            </select>
                        </div>

                        <!-- 単元入力 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-tag mr-2"></i>単元名（任意）
                            </label>
                            <input 
                                type="text" 
                                id="unitInput" 
                                placeholder="例: 四則演算、漢字、植物の観察"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                            >
                        </div>

                        <!-- 難易度選択 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-signal mr-2"></i>難易度
                            </label>
                            <div class="grid grid-cols-3 gap-3">
                                <button class="difficulty-btn px-4 py-3 border-2 border-green-500 text-green-700 rounded-lg hover:bg-green-50 transition" data-difficulty="easy">
                                    <i class="fas fa-smile"></i> 基礎
                                </button>
                                <button class="difficulty-btn px-4 py-3 border-2 border-blue-500 text-blue-700 bg-blue-50 rounded-lg hover:bg-blue-100 transition active" data-difficulty="medium">
                                    <i class="fas fa-meh"></i> 標準
                                </button>
                                <button class="difficulty-btn px-4 py-3 border-2 border-purple-500 text-purple-700 rounded-lg hover:bg-purple-50 transition" data-difficulty="hard">
                                    <i class="fas fa-grin-stars"></i> 発展
                                </button>
                            </div>
                            <p id="recommendedDifficulty" class="text-sm text-gray-600 mt-2"></p>
                        </div>

                        <!-- 問題数選択 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                <i class="fas fa-hashtag mr-2"></i>生成する問題数
                            </label>
                            <input 
                                type="range" 
                                id="countInput" 
                                min="1" 
                                max="10" 
                                value="5"
                                class="w-full"
                            >
                            <div class="flex justify-between text-sm text-gray-600 mt-1">
                                <span>1問</span>
                                <span id="countDisplay" class="font-bold text-purple-600">5問</span>
                                <span>10問</span>
                            </div>
                        </div>

                        <!-- 生成ボタン -->
                        <button 
                            id="generateBtn" 
                            class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-bold text-lg hover:from-purple-700 hover:to-pink-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <i class="fas fa-magic mr-2"></i>問題を生成する
                        </button>

                        <!-- AI情報 -->
                        <div class="text-xs text-gray-500 flex items-center gap-2 bg-purple-50 p-3 rounded-lg">
                            <i class="fas fa-info-circle text-purple-600"></i>
                            <span>
                                <span class="font-semibold text-purple-700">AI駆動</span> + 
                                <span class="font-semibold text-blue-700">学習履歴分析</span>で、
                                あなたに最適な問題を生成します
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 生成中表示 -->
                <div id="generatingIndicator" class="hidden bg-white rounded-lg shadow-lg p-8 text-center">
                    <div class="generating-animation mb-4">
                        <i class="fas fa-cog fa-spin text-6xl text-purple-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">問題を生成中...</h3>
                    <p class="text-gray-600">あなた専用の問題を作成しています ✨</p>
                </div>

                <!-- 生成済み問題表示 -->
                <div id="generatedProblems" class="space-y-4">
                    <!-- 動的に生成 -->
                </div>
            </div>

            <!-- サイドバー -->
            <div class="space-y-6">
                <!-- 学習統計 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-chart-bar text-purple-600"></i>
                        学習統計
                    </h3>
                    <div id="learningStats" class="space-y-3">
                        <div class="text-center text-gray-500 py-4">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>読み込み中...</p>
                        </div>
                    </div>
                </div>

                <!-- クイック生成 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-bolt text-orange-500"></i>
                        クイック生成
                    </h3>
                    <div class="space-y-2">
                        <button class="quick-generate w-full text-left px-4 py-3 bg-green-50 hover:bg-green-100 rounded-lg transition" data-subject="数学" data-difficulty="easy">
                            <i class="fas fa-calculator text-green-600 mr-2"></i>
                            数学 - 基礎 (5問)
                        </button>
                        <button class="quick-generate w-full text-left px-4 py-3 bg-blue-50 hover:bg-blue-100 rounded-lg transition" data-subject="国語" data-difficulty="medium">
                            <i class="fas fa-language text-blue-600 mr-2"></i>
                            国語 - 標準 (5問)
                        </button>
                        <button class="quick-generate w-full text-left px-4 py-3 bg-purple-50 hover:bg-purple-100 rounded-lg transition" data-subject="理科" data-difficulty="medium">
                            <i class="fas fa-flask text-purple-600 mr-2"></i>
                            理科 - 標準 (5問)
                        </button>
                        <button class="quick-generate w-full text-left px-4 py-3 bg-orange-50 hover:bg-orange-100 rounded-lg transition" data-subject="社会" data-difficulty="medium">
                            <i class="fas fa-globe text-orange-600 mr-2"></i>
                            社会 - 標準 (5問)
                        </button>
                    </div>
                </div>

                <!-- 最近の問題履歴 -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-history text-blue-600"></i>
                        最近の問題
                    </h3>
                    <div id="problemHistory" class="space-y-3">
                        <!-- 動的に生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 問題解答モーダル -->
    <div id="problemModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <h3 class="text-2xl font-bold text-gray-800">問題に挑戦</h3>
                    <button id="closeModal" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>

                <div id="modalContent">
                    <!-- 動的に生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script>
        // 認証確認
        const token = localStorage.getItem('token')
        if (!token) {
            window.location.href = '/auth-demo.html'
        }

        // Axios設定
        axios.defaults.headers.common['Authorization'] = `Bearer ${token}`

        // グローバル変数
        let selectedDifficulty = 'medium'
        let currentProblemId = null

        // ========================================
        // 初期化
        // ========================================
        
        async function init() {
            await Promise.all([
                loadPerformance(),
                loadProblemHistory()
            ])
            setupEventListeners()
        }

        // ========================================
        // 問題生成
        // ========================================
        
        async function generateProblems(subject, difficulty, count, unitName = '') {
            const generateBtn = document.getElementById('generateBtn')
            const generatingIndicator = document.getElementById('generatingIndicator')
            const generatedProblems = document.getElementById('generatedProblems')
            
            // UI更新
            generateBtn.disabled = true
            generatingIndicator.classList.remove('hidden')
            generatedProblems.innerHTML = ''
            
            try {
                const response = await axios.post('/api/problems/generate', {
                    subject,
                    difficulty,
                    count: parseInt(count),
                    unitName
                })
                
                if (response.data.success) {
                    const problems = response.data.problems
                    displayProblems(problems)
                    
                    // 統計更新
                    await loadPerformance()
                    await loadProblemHistory()
                } else {
                    const errorMsg = response.data.error || '問題の生成に失敗しました'
                    const details = response.data.details || ''
                    console.error('❌ API エラー:', errorMsg, details)
                    showError(`${errorMsg}${details ? '\n詳細: ' + details : ''}`)
                }
            } catch (error) {
                console.error('❌ 問題生成エラー:', error)
                let errorMsg = 'エラーが発生しました。もう一度お試しください。'
                
                if (error.response) {
                    // サーバーエラー
                    errorMsg += `\nステータス: ${error.response.status}`
                    if (error.response.data && error.response.data.error) {
                        errorMsg += `\n詳細: ${error.response.data.error}`
                    }
                } else if (error.request) {
                    // ネットワークエラー
                    errorMsg = 'サーバーに接続できませんでした。ネットワークを確認してください。'
                } else {
                    errorMsg += `\n詳細: ${error.message}`
                }
                
                showError(errorMsg)
            } finally {
                generateBtn.disabled = false
                generatingIndicator.classList.add('hidden')
            }
        }

        // ========================================
        // 問題表示
        // ========================================
        
        function displayProblems(problems) {
            const container = document.getElementById('generatedProblems')
            
            if (problems.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>問題が生成されませんでした</p>
                    </div>
                `
                return
            }
            
            container.innerHTML = problems.map((problem, index) => {
                const difficultyColors = {
                    easy: 'difficulty-easy',
                    medium: 'difficulty-medium',
                    hard: 'difficulty-hard'
                }
                
                const difficultyLabels = {
                    easy: '基礎',
                    medium: '標準',
                    hard: '発展'
                }
                
                return `
                    <div class="problem-card bg-white rounded-lg shadow-lg p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-2">
                                <span class="text-2xl font-bold text-purple-600">問題${index + 1}</span>
                                <span class="difficulty-badge ${difficultyColors[problem.difficulty]}">
                                    ${difficultyLabels[problem.difficulty]}
                                </span>
                            </div>
                            <div class="text-sm text-gray-600">
                                <i class="fas fa-book mr-1"></i>${problem.subject}
                                ${problem.unitName ? ` / ${problem.unitName}` : ''}
                            </div>
                        </div>

                        <div class="mb-4">
                            <p class="text-lg text-gray-800 whitespace-pre-wrap">${escapeHtml(problem.question)}</p>
                        </div>

                        <div class="flex gap-2">
                            <button 
                                class="flex-1 px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition"
                                onclick="showProblemModal(${problem.problemId})"
                            >
                                <i class="fas fa-pencil-alt mr-2"></i>解答する
                            </button>
                            <button 
                                class="px-4 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition"
                                onclick="showHint(${problem.problemId})"
                            >
                                <i class="fas fa-lightbulb"></i>
                            </button>
                        </div>
                    </div>
                `
            }).join('')
        }

        // ========================================
        // 問題解答モーダル
        // ========================================
        
        function showProblemModal(problemId) {
            currentProblemId = problemId
            const modal = document.getElementById('problemModal')
            const modalContent = document.getElementById('modalContent')
            
            // 問題取得
            axios.get(`/api/problems/history?limit=100`)
                .then(response => {
                    const problem = response.data.problems.find(p => p.problem_id === problemId)
                    
                    if (!problem) {
                        showError('問題が見つかりません')
                        return
                    }
                    
                    modalContent.innerHTML = `
                        <div class="mb-6">
                            <h4 class="text-xl font-bold text-gray-800 mb-4">問題</h4>
                            <p class="text-lg text-gray-700 whitespace-pre-wrap">${escapeHtml(problem.question)}</p>
                        </div>

                        <div class="mb-6">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                あなたの答え
                            </label>
                            <textarea 
                                id="userAnswer" 
                                rows="3"
                                placeholder="答えを入力してください..."
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                            ></textarea>
                        </div>

                        <div id="resultArea" class="hidden mb-6"></div>

                        <div class="flex gap-3">
                            <button 
                                id="submitAnswer"
                                class="flex-1 px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-bold hover:from-purple-700 hover:to-pink-700 transition"
                            >
                                <i class="fas fa-check mr-2"></i>答え合わせ
                            </button>
                            <button 
                                id="showHintBtn"
                                class="px-6 py-3 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition"
                            >
                                <i class="fas fa-lightbulb mr-2"></i>ヒント
                            </button>
                        </div>

                        <div id="hintArea" class="hidden mt-4"></div>
                    `
                    
                    modal.classList.remove('hidden')
                    
                    // イベントリスナー
                    document.getElementById('submitAnswer').addEventListener('click', () => submitAnswer(problemId, problem))
                    document.getElementById('showHintBtn').addEventListener('click', () => showHintInModal(problem))
                })
                .catch(error => {
                    console.error('❌ 問題取得エラー:', error)
                    showError('問題の取得に失敗しました')
                })
        }

        async function submitAnswer(problemId, problem) {
            const userAnswer = document.getElementById('userAnswer').value
            const resultArea = document.getElementById('resultArea')
            
            if (!userAnswer.trim()) {
                showError('答えを入力してください')
                return
            }
            
            try {
                const response = await axios.post(`/api/problems/${problemId}/submit`, {
                    userAnswer
                })
                
                if (response.data.success) {
                    const isCorrect = response.data.isCorrect
                    const correctAnswer = response.data.correctAnswer
                    const explanation = response.data.explanation
                    
                    resultArea.innerHTML = `
                        <div class="border-l-4 ${isCorrect ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'} p-4 rounded">
                            <h4 class="font-bold text-lg mb-2 ${isCorrect ? 'text-green-800' : 'text-red-800'}">
                                <i class="fas ${isCorrect ? 'fa-check-circle' : 'fa-times-circle'} mr-2"></i>
                                ${isCorrect ? '正解！🎉' : '不正解'}
                            </h4>
                            ${!isCorrect ? `<p class="text-gray-700 mb-2"><strong>正解:</strong> ${escapeHtml(correctAnswer)}</p>` : ''}
                            <p class="text-gray-700"><strong>解説:</strong></p>
                            <p class="text-gray-700 whitespace-pre-wrap mt-2">${escapeHtml(explanation)}</p>
                        </div>
                    `
                    
                    resultArea.classList.remove('hidden')
                    
                    // 統計更新
                    await loadPerformance()
                    await loadProblemHistory()
                } else {
                    showError('回答の提出に失敗しました')
                }
            } catch (error) {
                console.error('❌ 回答提出エラー:', error)
                showError('エラーが発生しました')
            }
        }

        function showHintInModal(problem) {
            const hintArea = document.getElementById('hintArea')
            
            if (!problem.hints || problem.hints.length === 0) {
                hintArea.innerHTML = `
                    <div class="bg-yellow-50 border border-yellow-200 p-4 rounded">
                        <p class="text-yellow-800">この問題にはヒントがありません</p>
                    </div>
                `
            } else {
                hintArea.innerHTML = `
                    <div class="bg-yellow-50 border border-yellow-200 p-4 rounded">
                        <h4 class="font-bold text-yellow-800 mb-2">
                            <i class="fas fa-lightbulb mr-2"></i>ヒント
                        </h4>
                        <ul class="list-disc list-inside space-y-1 text-yellow-800">
                            ${problem.hints.map(hint => `<li>${escapeHtml(hint)}</li>`).join('')}
                        </ul>
                    </div>
                `
            }
            
            hintArea.classList.remove('hidden')
        }

        // ========================================
        // パフォーマンス読み込み
        // ========================================
        
        async function loadPerformance() {
            try {
                const subject = document.getElementById('subjectSelect').value
                const response = await axios.get(`/api/problems/performance?subject=${subject}`)
                
                if (response.data.success) {
                    const { performance } = response.data
                    
                    // サマリーカード表示
                    const summaryContainer = document.getElementById('performanceSummary')
                    summaryContainer.innerHTML = `
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">平均正答率</p>
                                    <p class="text-3xl font-bold text-purple-600">${Math.round(performance.averageScore)}%</p>
                                </div>
                                <i class="fas fa-chart-line text-4xl text-purple-200"></i>
                            </div>
                        </div>
                        
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">挑戦した問題</p>
                                    <p class="text-3xl font-bold text-blue-600">${performance.totalAttempts}問</p>
                                </div>
                                <i class="fas fa-tasks text-4xl text-blue-200"></i>
                            </div>
                        </div>
                        
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">正解した問題</p>
                                    <p class="text-3xl font-bold text-green-600">${performance.correctAttempts}問</p>
                                </div>
                                <i class="fas fa-check-circle text-4xl text-green-200"></i>
                            </div>
                        </div>
                        
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-gray-600">推奨難易度</p>
                                    <p class="text-2xl font-bold text-orange-600">${getDifficultyLabel(performance.recommendedDifficulty)}</p>
                                </div>
                                <i class="fas fa-star text-4xl text-orange-200"></i>
                            </div>
                        </div>
                    `
                    
                    // 推奨難易度表示
                    const recommendedDifficultyEl = document.getElementById('recommendedDifficulty')
                    recommendedDifficultyEl.innerHTML = `
                        <i class="fas fa-info-circle text-blue-600"></i>
                        あなたの学習状況から、<strong class="text-blue-700">${getDifficultyLabel(performance.recommendedDifficulty)}</strong>がおすすめです
                    `
                }
            } catch (error) {
                console.error('❌ パフォーマンス読み込みエラー:', error)
            }
        }

        // ========================================
        // 問題履歴読み込み
        // ========================================
        
        async function loadProblemHistory() {
            try {
                const response = await axios.get('/api/problems/history?limit=5')
                
                if (response.data.success) {
                    const problems = response.data.problems
                    const container = document.getElementById('problemHistory')
                    
                    if (problems.length === 0) {
                        container.innerHTML = `
                            <div class="text-center text-gray-500 py-4">
                                <p>まだ問題がありません</p>
                            </div>
                        `
                        return
                    }
                    
                    container.innerHTML = problems.map(p => `
                        <div class="border-l-4 ${p.is_attempted ? (p.is_correct ? 'border-green-500' : 'border-red-500') : 'border-gray-300'} pl-3 py-2 hover:bg-gray-50 cursor-pointer" onclick="showProblemModal(${p.problem_id})">
                            <p class="text-sm font-semibold text-gray-800">${escapeHtml(p.question.substring(0, 50))}...</p>
                            <div class="text-xs text-gray-600 mt-1">
                                ${p.subject} • ${p.is_attempted ? (p.is_correct ? '✅ 正解' : '❌ 不正解') : '未挑戦'}
                            </div>
                        </div>
                    `).join('')
                }
            } catch (error) {
                console.error('❌ 履歴読み込みエラー:', error)
            }
        }

        // ========================================
        // イベントリスナー設定
        // ========================================
        
        function setupEventListeners() {
            // 問題数スライダー
            const countInput = document.getElementById('countInput')
            const countDisplay = document.getElementById('countDisplay')
            countInput.addEventListener('input', (e) => {
                countDisplay.textContent = `${e.target.value}問`
            })

            // 難易度ボタン
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.difficulty-btn').forEach(b => {
                        b.classList.remove('active', 'bg-green-50', 'bg-blue-50', 'bg-purple-50')
                    })
                    btn.classList.add('active')
                    
                    const difficulty = btn.getAttribute('data-difficulty')
                    selectedDifficulty = difficulty
                    
                    if (difficulty === 'easy') btn.classList.add('bg-green-50')
                    else if (difficulty === 'medium') btn.classList.add('bg-blue-50')
                    else btn.classList.add('bg-purple-50')
                })
            })

            // 生成ボタン
            document.getElementById('generateBtn').addEventListener('click', () => {
                const subject = document.getElementById('subjectSelect').value
                const unitName = document.getElementById('unitInput').value
                const count = document.getElementById('countInput').value
                
                generateProblems(subject, selectedDifficulty, count, unitName)
            })

            // クイック生成
            document.querySelectorAll('.quick-generate').forEach(btn => {
                btn.addEventListener('click', () => {
                    const subject = btn.getAttribute('data-subject')
                    const difficulty = btn.getAttribute('data-difficulty')
                    
                    document.getElementById('subjectSelect').value = subject
                    selectedDifficulty = difficulty
                    
                    generateProblems(subject, difficulty, 5)
                })
            })

            // モーダル閉じる
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('problemModal').classList.add('hidden')
            })

            // ログアウト
            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.removeItem('token')
                window.location.href = '/auth-demo.html'
            })
        }

        // ========================================
        // ユーティリティ
        // ========================================
        
        function getDifficultyLabel(difficulty) {
            const labels = {
                easy: '基礎',
                medium: '標準',
                hard: '発展'
            }
            return labels[difficulty] || '標準'
        }

        function showError(message) {
            // 詳細エラー表示
            const container = document.getElementById('generatedProblems')
            container.innerHTML = `
                <div class="bg-red-50 border-l-4 border-red-500 rounded-lg shadow-lg p-6">
                    <div class="flex items-start">
                        <i class="fas fa-exclamation-circle text-red-500 text-3xl mr-4"></i>
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-red-800 mb-2">エラーが発生しました</h3>
                            <p class="text-red-700 whitespace-pre-wrap">${escapeHtml(message)}</p>
                            <div class="mt-4">
                                <button 
                                    onclick="window.location.reload()" 
                                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
                                >
                                    <i class="fas fa-redo mr-2"></i>ページを再読み込み
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `
            
            // コンソールにも出力
            console.error('❌ エラー詳細:', message)
        }

        function escapeHtml(text) {
            const div = document.createElement('div')
            div.textContent = text
            return div.innerHTML
        }

        // 初期化実行
        init()
    </script>
</body>
</html>
