<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統合機能デモ - AI生成 + マルチモーダル</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="/static/multimodal-learning.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-star mr-2 text-yellow-600"></i>
                統合機能デモ: AI生成 + マルチモーダル学習
            </h1>
            <p class="text-gray-600">学習スタイル別AI生成コンテンツと音声読み上げ・視覚補助機能の統合デモ</p>
        </div>

        <!-- アクセシビリティコントロール -->
        <div class="bg-blue-50 rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-universal-access mr-2"></i>
                アクセシビリティ設定
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="window.visualController.setColorScheme('light')" class="bg-white border-2 border-gray-300 px-4 py-2 rounded hover:bg-gray-100">
                    <i class="fas fa-sun mr-2"></i>ライト
                </button>
                <button onclick="window.visualController.setColorScheme('dark')" class="bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-700">
                    <i class="fas fa-moon mr-2"></i>ダーク
                </button>
                <button onclick="window.visualController.increaseFontSize()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    <i class="fas fa-plus mr-2"></i>文字大
                </button>
                <button onclick="window.visualController.decreaseFontSize()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                    <i class="fas fa-minus mr-2"></i>文字小
                </button>
            </div>
        </div>

        <!-- AI生成コンテンツ -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">
                <i class="fas fa-robot mr-2 text-purple-600"></i>
                AI生成コンテンツ
            </h2>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">学習トピック:</label>
                <input type="text" id="topic" class="border rounded p-2 w-full" value="分数の足し算" placeholder="例: 分数の足し算">
            </div>
            <div class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="generateContent('visual')" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    <i class="fas fa-eye mr-2"></i>視覚型
                </button>
                <button onclick="generateContent('auditory')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    <i class="fas fa-headphones mr-2"></i>聴覚型
                </button>
                <button onclick="generateContent('reading')" class="bg-yellow-600 text-white px-4 py-2 rounded hover:bg-yellow-700">
                    <i class="fas fa-book mr-2"></i>読書型
                </button>
                <button onclick="generateContent('kinesthetic')" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                    <i class="fas fa-hand-rock mr-2"></i>体感型
                </button>
            </div>
            <div id="generatedContent" class="mt-4 p-4 bg-gray-50 rounded-lg min-h-[200px] hidden">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-lg">生成されたコンテンツ</h3>
                    <button onclick="speakContent()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">
                        <i class="fas fa-volume-up mr-1"></i>読み上げ
                    </button>
                </div>
                <div id="contentText" class="text-gray-700 whitespace-pre-wrap"></div>
            </div>
        </div>

        <!-- 音声コントロール -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">
                <i class="fas fa-microphone mr-2 text-red-600"></i>
                音声機能
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="startTTS()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    <i class="fas fa-play mr-2"></i>読み上げ
                </button>
                <button onclick="pauseTTS()" class="bg-yellow-600 text-white px-4 py-2 rounded hover:bg-yellow-700">
                    <i class="fas fa-pause mr-2"></i>一時停止
                </button>
                <button onclick="stopTTS()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                    <i class="fas fa-stop mr-2"></i>停止
                </button>
                <button onclick="startSTT()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    <i class="fas fa-microphone mr-2"></i>音声認識
                </button>
            </div>
            <div id="sttResult" class="mt-4 p-4 bg-gray-50 rounded-lg hidden">
                <p class="text-gray-700"></p>
            </div>
        </div>
    </div>

    <script>
        let currentContent = '';

        async function generateContent(learningStyle) {
            const topic = document.getElementById('topic').value;
            const contentDiv = document.getElementById('generatedContent');
            const contentText = document.getElementById('contentText');
            
            contentText.textContent = '生成中...';
            contentDiv.classList.remove('hidden');
            
            try {
                const response = await fetch('/api/ai/generate-content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic,
                        learning_style: learningStyle,
                        grade_level: 5,
                        content_type: 'explanation',
                        difficulty: 3,
                        language: 'ja'
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    currentContent = result.data.content;
                    contentText.textContent = currentContent;
                } else {
                    contentText.textContent = 'エラー: ' + result.error;
                }
            } catch (error) {
                contentText.textContent = 'エラー: ' + error.message;
            }
        }

        function speakContent() {
            if (currentContent) {
                window.ttsController.speak(currentContent, { rate: 1.0, lang: 'ja-JP' });
            }
        }

        function startTTS() {
            const text = document.getElementById('contentText').textContent;
            if (text && text !== '生成中...' && text !== 'エラー:') {
                window.ttsController.speak(text, { rate: 1.0, lang: 'ja-JP' });
            } else {
                window.ttsController.speak('音声読み上げのテストです。', { rate: 1.0, lang: 'ja-JP' });
            }
        }

        function pauseTTS() {
            window.ttsController.pause();
        }

        function stopTTS() {
            window.ttsController.stop();
        }

        function startSTT() {
            const resultDiv = document.getElementById('sttResult');
            const resultText = resultDiv.querySelector('p');
            
            resultDiv.classList.remove('hidden');
            resultText.textContent = '音声を認識中...';
            
            window.sttController.start((result) => {
                resultText.textContent = `認識結果: ${result.transcript} (信頼度: ${(result.confidence * 100).toFixed(1)}%)`;
            });
        }
    </script>
</body>
</html>
