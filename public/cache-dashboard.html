<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャッシュ管理ダッシュボード - 自由進度学習支援システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <!-- ヘッダー -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-memory text-blue-600 mr-2"></i>
                    キャッシュ管理ダッシュボード
                </h1>
                <a href="/dashboard.html" class="text-blue-600 hover:text-blue-800">
                    <i class="fas fa-arrow-left mr-1"></i>ダッシュボードに戻る
                </a>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-6 py-8">
        <!-- アラート表示エリア -->
        <div id="alertArea"></div>

        <!-- キャッシュヘルスステータス -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-heartbeat text-red-500 mr-2"></i>
                キャッシュヘルスステータス
            </h2>
            <div id="healthStatus" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="text-center">
                    <div class="text-3xl mb-2" id="healthIcon">
                        <i class="fas fa-spinner fa-spin text-gray-400"></i>
                    </div>
                    <div class="text-sm text-gray-600">ステータス</div>
                    <div class="font-bold text-lg" id="healthStatusText">確認中...</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl mb-2 text-blue-500">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="text-sm text-gray-600">読み取り</div>
                    <div class="font-bold text-lg" id="readStatus">-</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl mb-2 text-green-500">
                        <i class="fas fa-edit"></i>
                    </div>
                    <div class="text-sm text-gray-600">書き込み</div>
                    <div class="font-bold text-lg" id="writeStatus">-</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl mb-2 text-purple-500">
                        <i class="fas fa-tachometer-alt"></i>
                    </div>
                    <div class="text-sm text-gray-600">レイテンシ</div>
                    <div class="font-bold text-lg" id="latency">-</div>
                </div>
            </div>
        </div>

        <!-- パフォーマンスメトリクス -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">キャッシュヒット率</p>
                        <p class="text-3xl font-bold text-green-600" id="hitRate">-</p>
                    </div>
                    <div class="text-4xl text-green-500">
                        <i class="fas fa-bullseye"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">ヒット数</p>
                        <p class="text-3xl font-bold text-blue-600" id="hits">-</p>
                    </div>
                    <div class="text-4xl text-blue-500">
                        <i class="fas fa-check-double"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">ミス数</p>
                        <p class="text-3xl font-bold text-orange-600" id="misses">-</p>
                    </div>
                    <div class="text-4xl text-orange-500">
                        <i class="fas fa-times-circle"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">総リクエスト</p>
                        <p class="text-3xl font-bold text-purple-600" id="total">-</p>
                    </div>
                    <div class="text-4xl text-purple-500">
                        <i class="fas fa-chart-line"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- キャッシュ統計 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-database text-blue-600 mr-2"></i>
                キャッシュ統計（プレフィックス別）
            </h2>
            <div id="cacheStatsByPrefix" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- キャッシュヒット率グラフ -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-chart-area text-green-600 mr-2"></i>
                キャッシュパフォーマンス推移
            </h2>
            <canvas id="cachePerformanceChart" height="80"></canvas>
        </div>

        <!-- 管理操作 -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-cog text-gray-700 mr-2"></i>
                キャッシュ管理操作
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="prewarmCache()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                    <i class="fas fa-fire mr-2"></i>キャッシュプリウォーム
                </button>
                <button onclick="resetMetrics()" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                    <i class="fas fa-redo mr-2"></i>メトリクスリセット
                </button>
                <button onclick="refreshData()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                    <i class="fas fa-sync-alt mr-2"></i>データ更新
                </button>
            </div>

            <!-- キャッシュ無効化フォーム -->
            <div class="mt-6 p-4 bg-gray-50 rounded-lg">
                <h3 class="font-semibold mb-3">キャッシュ無効化</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <select id="entityType" class="border rounded px-3 py-2">
                        <option value="student">学生</option>
                        <option value="teacher">教師</option>
                        <option value="curriculum">カリキュラム</option>
                        <option value="class">クラス</option>
                    </select>
                    <input type="text" id="entityId" placeholder="エンティティID" class="border rounded px-3 py-2">
                    <button onclick="invalidateCache()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                        <i class="fas fa-trash mr-2"></i>無効化実行
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let performanceChart;
        let chartData = {
            labels: [],
            hits: [],
            misses: []
        };

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            loadData();
            setInterval(loadData, 10000); // 10秒ごとに更新
        });

        // グラフ初期化
        function initChart() {
            const ctx = document.getElementById('cachePerformanceChart').getContext('2d');
            performanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        {
                            label: 'ヒット数',
                            data: chartData.hits,
                            borderColor: 'rgb(34, 197, 94)',
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'ミス数',
                            data: chartData.misses,
                            borderColor: 'rgb(251, 146, 60)',
                            backgroundColor: 'rgba(251, 146, 60, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // データ読み込み
        async function loadData() {
            try {
                // ヘルスチェック
                const healthRes = await fetch('/api/cache/health');
                const health = await healthRes.json();
                updateHealthStatus(health);

                // 統計とメトリクス
                const statsRes = await fetch('/api/cache/stats');
                const stats = await statsRes.json();
                
                if (stats.success) {
                    updateMetrics(stats.performance_metrics);
                    updateCacheStats(stats.cache_stats);
                    updateChart(stats.performance_metrics);
                }
            } catch (error) {
                console.error('データ読み込みエラー:', error);
                showAlert('データの読み込みに失敗しました', 'error');
            }
        }

        // ヘルスステータス更新
        function updateHealthStatus(health) {
            const icon = document.getElementById('healthIcon');
            const statusText = document.getElementById('healthStatusText');
            const readStatus = document.getElementById('readStatus');
            const writeStatus = document.getElementById('writeStatus');
            const latency = document.getElementById('latency');

            if (health.status === 'healthy') {
                icon.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';
                statusText.textContent = '正常';
                statusText.className = 'font-bold text-lg text-green-600';
                readStatus.textContent = health.details.read ? '正常' : 'エラー';
                writeStatus.textContent = health.details.write ? '正常' : 'エラー';
                latency.textContent = health.details.latency_ms ? `${health.details.latency_ms}ms` : '-';
            } else if (health.status === 'degraded') {
                icon.innerHTML = '<i class="fas fa-exclamation-triangle text-yellow-500"></i>';
                statusText.textContent = '低下';
                statusText.className = 'font-bold text-lg text-yellow-600';
            } else {
                icon.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                statusText.textContent = 'ダウン';
                statusText.className = 'font-bold text-lg text-red-600';
            }
        }

        // メトリクス更新
        function updateMetrics(metrics) {
            document.getElementById('hitRate').textContent = metrics.hit_rate;
            document.getElementById('hits').textContent = metrics.hits.toLocaleString();
            document.getElementById('misses').textContent = metrics.misses.toLocaleString();
            document.getElementById('total').textContent = metrics.total.toLocaleString();
        }

        // キャッシュ統計更新
        function updateCacheStats(stats) {
            const container = document.getElementById('cacheStatsByPrefix');
            
            if (!stats.enabled) {
                container.innerHTML = '<p class="text-gray-500">KVが設定されていません</p>';
                return;
            }

            const prefixes = stats.by_prefix || {};
            container.innerHTML = '';

            Object.entries(prefixes).forEach(([prefix, count]) => {
                const div = document.createElement('div');
                div.className = 'bg-gray-50 rounded-lg p-4';
                div.innerHTML = `
                    <div class="text-sm text-gray-600">${prefix}</div>
                    <div class="text-2xl font-bold text-blue-600">${count.toLocaleString()}</div>
                    <div class="text-xs text-gray-500">キャッシュキー数</div>
                `;
                container.appendChild(div);
            });
        }

        // グラフ更新
        function updateChart(metrics) {
            const now = new Date().toLocaleTimeString();
            
            chartData.labels.push(now);
            chartData.hits.push(metrics.hits);
            chartData.misses.push(metrics.misses);

            // 最新20件のみ保持
            if (chartData.labels.length > 20) {
                chartData.labels.shift();
                chartData.hits.shift();
                chartData.misses.shift();
            }

            performanceChart.update();
        }

        // キャッシュプリウォーム
        async function prewarmCache() {
            if (!confirm('キャッシュのプリウォームを実行しますか？')) return;

            try {
                const res = await fetch('/api/cache/prewarm', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    showAlert('キャッシュプリウォームが完了しました', 'success');
                    loadData();
                } else {
                    showAlert(data.error || 'プリウォームに失敗しました', 'error');
                }
            } catch (error) {
                showAlert('エラーが発生しました', 'error');
            }
        }

        // メトリクスリセット
        async function resetMetrics() {
            if (!confirm('メトリクスをリセットしますか？')) return;

            try {
                const res = await fetch('/api/cache/metrics/reset', { method: 'POST' });
                const data = await res.json();
                
                if (data.success) {
                    showAlert('メトリクスをリセットしました', 'success');
                    chartData = { labels: [], hits: [], misses: [] };
                    performanceChart.data.labels = [];
                    performanceChart.data.datasets[0].data = [];
                    performanceChart.data.datasets[1].data = [];
                    performanceChart.update();
                    loadData();
                } else {
                    showAlert(data.error || 'リセットに失敗しました', 'error');
                }
            } catch (error) {
                showAlert('エラーが発生しました', 'error');
            }
        }

        // キャッシュ無効化
        async function invalidateCache() {
            const entityType = document.getElementById('entityType').value;
            const entityId = document.getElementById('entityId').value;

            if (!entityId) {
                showAlert('エンティティIDを入力してください', 'error');
                return;
            }

            if (!confirm(`${entityType} ID:${entityId} のキャッシュを無効化しますか？`)) return;

            try {
                const res = await fetch('/api/cache/invalidate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ entity_type: entityType, entity_id: entityId })
                });
                const data = await res.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    document.getElementById('entityId').value = '';
                    loadData();
                } else {
                    showAlert(data.error || '無効化に失敗しました', 'error');
                }
            } catch (error) {
                showAlert('エラーが発生しました', 'error');
            }
        }

        // データ更新
        function refreshData() {
            showAlert('データを更新しています...', 'info');
            loadData();
        }

        // アラート表示
        function showAlert(message, type) {
            const alertArea = document.getElementById('alertArea');
            const colors = {
                success: 'bg-green-100 border-green-500 text-green-700',
                error: 'bg-red-100 border-red-500 text-red-700',
                info: 'bg-blue-100 border-blue-500 text-blue-700'
            };

            const alert = document.createElement('div');
            alert.className = `${colors[type]} border-l-4 p-4 mb-4 rounded`;
            alert.textContent = message;
            alertArea.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
