<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIフィードバックダッシュボード | 自由進度学習プラットフォーム</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- ナビゲーションバー -->
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-graduation-cap text-blue-600 text-2xl mr-3"></i>
                    <span class="text-xl font-bold text-gray-800">自由進度学習</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userName" class="text-gray-600"></span>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">
                        <i class="fas fa-sign-out-alt"></i> ログアウト
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- タブ -->
        <div class="mb-6">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-8">
                    <button onclick="switchTab('advice')" id="tab-advice"
                        class="tab-button border-blue-500 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        <i class="fas fa-lightbulb mr-2"></i>
                        学習アドバイス
                    </button>
                    <button onclick="switchTab('weekly')" id="tab-weekly"
                        class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        <i class="fas fa-calendar-week mr-2"></i>
                        週次レポート
                    </button>
                    <button onclick="switchTab('monthly')" id="tab-monthly"
                        class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        <i class="fas fa-calendar-alt mr-2"></i>
                        月次レポート
                    </button>
                </nav>
            </div>
        </div>

        <!-- 学習アドバイスタブ -->
        <div id="content-advice" class="tab-content">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                    あなたへの学習アドバイス
                </h2>
                <div id="adviceLoading" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                    <p class="mt-4 text-gray-600">AIが学習アドバイスを生成中...</p>
                </div>
                <div id="adviceContent" class="hidden">
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <i class="fas fa-info-circle text-blue-500 text-xl"></i>
                            </div>
                            <div class="ml-3">
                                <p id="generalAdvice" class="text-sm text-blue-700"></p>
                            </div>
                        </div>
                    </div>

                    <h3 class="text-lg font-semibold mb-3 text-gray-700">
                        <i class="fas fa-tasks mr-2"></i>
                        具体的なアドバイス
                    </h3>
                    <div id="specificAdvice" class="space-y-3 mb-6"></div>

                    <div class="bg-green-50 border-l-4 border-green-500 p-4">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <i class="fas fa-heart text-green-500 text-xl"></i>
                            </div>
                            <div class="ml-3">
                                <p id="encouragement" class="text-sm text-green-700 font-medium"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 週次レポートタブ -->
        <div id="content-weekly" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-calendar-week text-blue-500 mr-2"></i>
                    今週の学習レポート
                </h2>
                <div id="weeklyLoading" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                    <p class="mt-4 text-gray-600">週次レポートを生成中...</p>
                </div>
                <div id="weeklyContent" class="hidden">
                    <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg p-6 mb-6">
                        <h3 class="text-xl font-semibold mb-2 text-gray-800">サマリー</h3>
                        <p id="weeklySummary" class="text-gray-700"></p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <h3 class="text-lg font-semibold mb-3 text-gray-700">
                                <i class="fas fa-trophy text-yellow-500 mr-2"></i>
                                今週の成果
                            </h3>
                            <div id="weeklyAchievements" class="space-y-2"></div>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold mb-3 text-gray-700">
                                <i class="fas fa-chart-line text-green-500 mr-2"></i>
                                改善点
                            </h3>
                            <div id="weeklyImprovements" class="space-y-2"></div>
                        </div>
                    </div>

                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4">
                        <h3 class="text-lg font-semibold mb-2 text-gray-800">
                            <i class="fas fa-compass mr-2"></i>
                            次のステップ
                        </h3>
                        <div id="weeklyNextSteps" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 月次レポートタブ -->
        <div id="content-monthly" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-2xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-calendar-alt text-purple-500 mr-2"></i>
                    今月の学習レポート
                </h2>
                <div id="monthlyLoading" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
                    <p class="mt-4 text-gray-600">月次レポートを生成中...</p>
                </div>
                <div id="monthlyContent" class="hidden">
                    <div class="bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg p-6 mb-6">
                        <h3 class="text-xl font-semibold mb-2 text-gray-800">サマリー</h3>
                        <p id="monthlySummary" class="text-gray-700"></p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <h3 class="text-lg font-semibold mb-3 text-gray-700">
                                <i class="fas fa-star text-yellow-500 mr-2"></i>
                                今月の主な成果
                            </h3>
                            <div id="monthlyAchievements" class="space-y-2"></div>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold mb-3 text-gray-700">
                                <i class="fas fa-chart-area text-purple-500 mr-2"></i>
                                学習トレンド
                            </h3>
                            <div id="monthlyTrends" class="space-y-2"></div>
                        </div>
                    </div>

                    <div class="bg-purple-50 border-l-4 border-purple-500 p-4">
                        <h3 class="text-lg font-semibold mb-2 text-gray-800">
                            <i class="fas fa-bullseye mr-2"></i>
                            長期目標
                        </h3>
                        <div id="monthlyGoals" class="space-y-2"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- バックボタン -->
        <div class="mt-8 text-center">
            <a href="/problem-generator.html" class="inline-block bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700 transition">
                <i class="fas fa-arrow-left mr-2"></i>
                問題生成に戻る
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script>
        // 認証チェック
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/auth-demo.html';
                return false;
            }
            
            axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;
            
            // ユーザー名を表示
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.name) {
                document.getElementById('userName').textContent = user.name;
            }
            
            return true;
        }

        // ログアウト
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/auth-demo.html';
        }

        // タブ切り替え
        function switchTab(tab) {
            // すべてのタブボタンを非アクティブに
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            
            // すべてのタブコンテンツを非表示に
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            // 選択されたタブをアクティブに
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
            activeBtn.classList.add('border-blue-500', 'text-blue-600');
            
            // 選択されたコンテンツを表示
            const activeContent = document.getElementById(`content-${tab}`);
            activeContent.classList.remove('hidden');
            
            // データを読み込み
            if (tab === 'advice') {
                loadAdvice();
            } else if (tab === 'weekly') {
                loadWeeklyReport();
            } else if (tab === 'monthly') {
                loadMonthlyReport();
            }
        }

        // 学習アドバイスを読み込み
        async function loadAdvice() {
            const loading = document.getElementById('adviceLoading');
            const content = document.getElementById('adviceContent');
            
            loading.classList.remove('hidden');
            content.classList.add('hidden');
            
            try {
                const response = await axios.get('/api/feedback/advice');
                const { advice } = response.data;
                
                // 一般的なアドバイス
                document.getElementById('generalAdvice').textContent = advice.generalAdvice;
                
                // 具体的なアドバイス
                const specificDiv = document.getElementById('specificAdvice');
                specificDiv.innerHTML = '';
                advice.specificAdvice.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-start bg-gray-50 p-3 rounded';
                    div.innerHTML = `
                        <i class="fas fa-check-circle text-blue-500 mt-1 mr-2"></i>
                        <p class="text-gray-700">${item}</p>
                    `;
                    specificDiv.appendChild(div);
                });
                
                // 励まし
                document.getElementById('encouragement').textContent = advice.encouragement;
                
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } catch (error) {
                console.error('❌ アドバイス取得エラー:', error);
                loading.innerHTML = `
                    <div class="text-red-600">
                        <i class="fas fa-exclamation-triangle text-4xl mb-2"></i>
                        <p>アドバイスの取得に失敗しました</p>
                    </div>
                `;
            }
        }

        // 週次レポートを読み込み
        async function loadWeeklyReport() {
            const loading = document.getElementById('weeklyLoading');
            const content = document.getElementById('weeklyContent');
            
            loading.classList.remove('hidden');
            content.classList.add('hidden');
            
            try {
                const response = await axios.get('/api/feedback/weekly-report');
                const { report } = response.data;
                
                // サマリー
                document.getElementById('weeklySummary').textContent = report.summary;
                
                // 成果
                const achievementsDiv = document.getElementById('weeklyAchievements');
                achievementsDiv.innerHTML = '';
                report.achievements.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-start bg-yellow-50 p-3 rounded';
                    div.innerHTML = `
                        <i class="fas fa-trophy text-yellow-500 mt-1 mr-2"></i>
                        <p class="text-gray-700">${item}</p>
                    `;
                    achievementsDiv.appendChild(div);
                });
                
                // 改善点
                const improvementsDiv = document.getElementById('weeklyImprovements');
                improvementsDiv.innerHTML = '';
                report.improvements.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-start bg-green-50 p-3 rounded';
                    div.innerHTML = `
                        <i class="fas fa-arrow-up text-green-500 mt-1 mr-2"></i>
                        <p class="text-gray-700">${item}</p>
                    `;
                    improvementsDiv.appendChild(div);
                });
                
                // 次のステップ
                const nextStepsDiv = document.getElementById('weeklyNextSteps');
                nextStepsDiv.innerHTML = '';
                report.nextSteps.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-start';
                    div.innerHTML = `
                        <i class="fas fa-angle-right text-blue-500 mt-1 mr-2"></i>
                        <p class="text-gray-700">${item}</p>
                    `;
                    nextStepsDiv.appendChild(div);
                });
                
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } catch (error) {
                console.error('❌ 週次レポート取得エラー:', error);
                loading.innerHTML = `
                    <div class="text-red-600">
                        <i class="fas fa-exclamation-triangle text-4xl mb-2"></i>
                        <p>週次レポートの取得に失敗しました</p>
                    </div>
                `;
            }
        }

        // 月次レポートを読み込み
        async function loadMonthlyReport() {
            const loading = document.getElementById('monthlyLoading');
            const content = document.getElementById('monthlyContent');
            
            loading.classList.remove('hidden');
            content.classList.add('hidden');
            
            try {
                const response = await axios.get('/api/feedback/monthly-report');
                const { report } = response.data;
                
                // サマリー
                document.getElementById('monthlySummary').textContent = report.summary;
                
                // 成果
                const achievementsDiv = document.getElementById('monthlyAchievements');
                achievementsDiv.innerHTML = '';
                report.achievements.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-start bg-yellow-50 p-3 rounded';
                    div.innerHTML = `
                        <i class="fas fa-star text-yellow-500 mt-1 mr-2"></i>
                        <p class="text-gray-700">${item}</p>
                    `;
                    achievementsDiv.appendChild(div);
                });
                
                // トレンド
                const trendsDiv = document.getElementById('monthlyTrends');
                trendsDiv.innerHTML = '';
                report.trends.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-start bg-purple-50 p-3 rounded';
                    div.innerHTML = `
                        <i class="fas fa-chart-line text-purple-500 mt-1 mr-2"></i>
                        <p class="text-gray-700">${item}</p>
                    `;
                    trendsDiv.appendChild(div);
                });
                
                // 長期目標
                const goalsDiv = document.getElementById('monthlyGoals');
                goalsDiv.innerHTML = '';
                report.longTermGoals.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex items-start';
                    div.innerHTML = `
                        <i class="fas fa-bullseye text-purple-500 mt-1 mr-2"></i>
                        <p class="text-gray-700">${item}</p>
                    `;
                    goalsDiv.appendChild(div);
                });
                
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } catch (error) {
                console.error('❌ 月次レポート取得エラー:', error);
                loading.innerHTML = `
                    <div class="text-red-600">
                        <i class="fas fa-exclamation-triangle text-4xl mb-2"></i>
                        <p>月次レポートの取得に失敗しました</p>
                    </div>
                `;
            }
        }

        // 初期化
        window.onload = function() {
            if (checkAuth()) {
                loadAdvice(); // 最初は学習アドバイスを表示
            }
        };
    </script>
</body>
</html>
