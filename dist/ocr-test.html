<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCRオーバーレイテスト</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        
        .test-container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .info {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
            text-align: left;
        }
        
        .info h3 {
            margin-top: 0;
            color: #374151;
        }
        
        .info ul {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        
        .info li {
            margin: 0.5rem 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            margin: 0.5rem;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            background: #ecfdf5;
            border: 2px solid #10b981;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔄 OCRオーバーレイテスト</h1>
        
        <div class="info">
            <h3>📋 テスト内容</h3>
            <ul>
                <li>✅ 紫のグラデーションオーバーレイ</li>
                <li>✅ 虹色プログレスバー</li>
                <li>✅ スケールアニメーション</li>
                <li>✅ カーソルは黒いまま（重要！）</li>
            </ul>
        </div>
        
        <button onclick="testOCROverlay()">オーバーレイをテスト</button>
        <button onclick="testCursorCheck()">カーソル状態を確認</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        function testOCROverlay() {
            console.log('🚀 OCRオーバーレイテストを開始...')
            
            // 既存のオーバーレイを削除
            const existing = document.getElementById('test-overlay')
            if (existing) existing.remove()
            
            // オーバーレイを作成
            const overlay = document.createElement('div')
            overlay.id = 'test-overlay'
            
            // スタイルを設定
            Object.assign(overlay.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                width: '100vw',
                height: '100vh',
                background: 'rgba(0, 0, 0, 0.92)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                zIndex: '2147483647',
                backdropFilter: 'blur(12px)',
                WebkitBackdropFilter: 'blur(12px)',
                fontFamily: 'system-ui, -apple-system, sans-serif'
            })
            
            overlay.innerHTML = `
                <div id="test-content" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 3.5rem; border-radius: 2rem; box-shadow: 0 35px 100px rgba(0,0,0,0.7); text-align: center; max-width: 520px; width: 92%; border: 5px solid rgba(255,255,255,0.5); transform: scale(0.7); opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);">
                    <div style="font-size: 6rem; animation: spin 1s linear infinite; display: inline-block; filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));">🔄</div>
                    <div style="font-size: 2.25rem; font-weight: 900; margin-top: 1.75rem; color: white; text-shadow: 0 4px 8px rgba(0,0,0,0.5); letter-spacing: 1px;">文字認識中...</div>
                    <div id="test-progress-text" style="font-size: 1.3rem; color: rgba(255,255,255,0.98); margin-top: 1.2rem; min-height: 32px; font-weight: 600;">準備中...</div>
                    <div style="width: 100%; height: 16px; background: rgba(255,255,255,0.3); border-radius: 8px; margin-top: 2rem; overflow: hidden; box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);">
                        <div id="test-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ee5a6f); transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 20px rgba(255,255,255,0.8); border-radius: 8px;"></div>
                    </div>
                    <div id="test-progress-percent" style="font-size: 2rem; font-weight: 900; color: white; margin-top: 1.5rem; text-shadow: 0 4px 8px rgba(0,0,0,0.5); letter-spacing: 3px;">0%</div>
                </div>
            `
            
            document.body.appendChild(overlay)
            
            // アニメーション用CSS
            if (!document.getElementById('test-spin-style')) {
                const style = document.createElement('style')
                style.id = 'test-spin-style'
                style.textContent = `
                    @keyframes spin {
                        from { transform: rotate(0deg); }
                        to { transform: rotate(360deg); }
                    }
                `
                document.head.appendChild(style)
            }
            
            // アニメーション表示
            setTimeout(() => {
                const content = document.getElementById('test-content')
                if (content) {
                    content.style.transform = 'scale(1)'
                    content.style.opacity = '1'
                }
            }, 50)
            
            // 進捗シミュレーション
            const updateProgress = (text, percent) => {
                const progressText = document.getElementById('test-progress-text')
                const progressBar = document.getElementById('test-progress-bar')
                const progressPercent = document.getElementById('test-progress-percent')
                if (progressText) progressText.textContent = text
                if (progressBar) progressBar.style.width = `${percent}%`
                if (progressPercent) progressPercent.textContent = `${Math.round(percent)}%`
            }
            
            // プログレスアニメーション
            setTimeout(() => updateProgress('🌐 第1段階: Google Cloud Vision API で認識中...', 45), 300)
            setTimeout(() => updateProgress('🔍 認識処理中...', 75), 1500)
            setTimeout(() => updateProgress('✅ 認識完了！', 100), 2500)
            
            // フェードアウト
            setTimeout(() => {
                const content = document.getElementById('test-content')
                if (content) {
                    content.style.transform = 'scale(0.85)'
                    content.style.opacity = '0'
                }
                overlay.style.opacity = '0'
                
                setTimeout(() => {
                    overlay.remove()
                    showResult('success', 'オーバーレイテスト成功！カーソルは黒いままでしたか？')
                }, 400)
            }, 3500)
            
            console.log('✅ オーバーレイ表示完了')
            console.log('📊 カーソス状態を確認してください')
        }
        
        function testCursorCheck() {
            const cursorStyle = window.getComputedStyle(document.body).cursor
            const result = `
                <strong>現在のカーソス状態：</strong><br>
                document.body.style.cursor: "${document.body.style.cursor || 'なし'}"<br>
                computed cursor: "${cursorStyle}"<br><br>
                ${cursorStyle === 'auto' || cursorStyle === 'default' ? '✅ 正常（黒いカーソル）' : '❌ 異常（カーソルが変更されている）'}
            `
            showResult('info', result)
            console.log('🔍 カーソス状態:', {
                bodyCursor: document.body.style.cursor,
                computedCursor: cursorStyle
            })
        }
        
        function showResult(type, message) {
            const resultDiv = document.getElementById('result')
            resultDiv.className = `result show ${type}`
            resultDiv.innerHTML = message
        }
        
        console.log('✅ OCRテストページ読み込み完了')
        console.log('📝 使い方:')
        console.log('  1) 「オーバーレイをテスト」ボタンをクリック')
        console.log('  2) 紫のオーバーレイが表示される')
        console.log('  3) カーソスが黒いままか確認')
        console.log('  4) 「カーソス状態を確認」で診断')
    </script>
</body>
</html>
