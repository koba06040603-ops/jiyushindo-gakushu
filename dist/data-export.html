<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習データエクスポート - 松川村自由進度学習システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <style>
        .export-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .export-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        .download-progress {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- ナビゲーションバー -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-2xl font-bold text-green-600">
                        <i class="fas fa-download mr-2"></i>データエクスポート
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userName" class="text-gray-700">読み込み中...</span>
                    <a href="/learning-analytics-dashboard.html" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                        <i class="fas fa-chart-line mr-2"></i>ダッシュボード
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- ヘッダー -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-file-export text-green-600 mr-3"></i>
                学習データエクスポート
            </h1>
            <p class="text-gray-600">学習データを様々な形式でダウンロードできます</p>
        </div>

        <!-- エクスポート設定 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
            <!-- 左側: 設定フォーム -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-cog text-gray-600 mr-2"></i>
                        エクスポート設定
                    </h2>

                    <form id="exportForm">
                        <!-- エクスポート種別 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-3">エクスポート種別</label>
                            <div class="grid grid-cols-2 gap-4">
                                <label class="flex items-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-500 transition">
                                    <input type="radio" name="exportType" value="individual" checked class="mr-3">
                                    <div>
                                        <div class="font-semibold text-gray-800">個人データ</div>
                                        <div class="text-xs text-gray-600">自分の学習記録</div>
                                    </div>
                                </label>
                                <label class="flex items-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-500 transition">
                                    <input type="radio" name="exportType" value="anonymized" class="mr-3">
                                    <div>
                                        <div class="font-semibold text-gray-800">匿名化データ</div>
                                        <div class="text-xs text-gray-600">研究・分析用</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- 出力形式 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-3">出力形式</label>
                            <div class="grid grid-cols-3 gap-4">
                                <label class="flex items-center justify-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-green-500 transition">
                                    <input type="radio" name="format" value="csv" checked class="mr-2">
                                    <i class="fas fa-file-csv text-green-600 mr-2"></i>CSV
                                </label>
                                <label class="flex items-center justify-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-500 transition">
                                    <input type="radio" name="format" value="json" class="mr-2">
                                    <i class="fas fa-file-code text-blue-600 mr-2"></i>JSON
                                </label>
                                <label class="flex items-center justify-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-orange-500 transition">
                                    <input type="radio" name="format" value="excel" class="mr-2">
                                    <i class="fas fa-file-excel text-orange-600 mr-2"></i>Excel
                                </label>
                            </div>
                        </div>

                        <!-- 期間設定 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">データ期間</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs text-gray-600">開始日</label>
                                    <input type="date" id="dateFrom" class="w-full mt-1 border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="text-xs text-gray-600">終了日</label>
                                    <input type="date" id="dateTo" class="w-full mt-1 border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                        </div>

                        <!-- 教科選択 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">教科</label>
                            <div class="flex flex-wrap gap-2">
                                <label class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50">
                                    <input type="checkbox" name="subjects" value="算数" checked class="mr-2">
                                    算数
                                </label>
                                <label class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50">
                                    <input type="checkbox" name="subjects" value="国語" checked class="mr-2">
                                    国語
                                </label>
                                <label class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50">
                                    <input type="checkbox" name="subjects" value="理科" checked class="mr-2">
                                    理科
                                </label>
                                <label class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50">
                                    <input type="checkbox" name="subjects" value="社会" checked class="mr-2">
                                    社会
                                </label>
                                <label class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg cursor-pointer hover:bg-blue-50">
                                    <input type="checkbox" name="subjects" value="英語" checked class="mr-2">
                                    英語
                                </label>
                            </div>
                        </div>

                        <!-- 匿名化設定（匿名化データ選択時のみ表示） -->
                        <div id="anonymizationSettings" class="mb-6 hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-3">匿名化レベル</label>
                            <div class="space-y-3">
                                <label class="flex items-start p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input type="radio" name="anonymizationLevel" value="basic" checked class="mt-1 mr-3">
                                    <div>
                                        <div class="font-semibold text-gray-800">基本</div>
                                        <div class="text-xs text-gray-600">名前を匿名ID化、学年・クラスは保持</div>
                                    </div>
                                </label>
                                <label class="flex items-start p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input type="radio" name="anonymizationLevel" value="standard" class="mt-1 mr-3">
                                    <div>
                                        <div class="font-semibold text-gray-800">標準</div>
                                        <div class="text-xs text-gray-600">個人情報を完全削除、学年のみ保持</div>
                                    </div>
                                </label>
                                <label class="flex items-start p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input type="radio" name="anonymizationLevel" value="full" class="mt-1 mr-3">
                                    <div>
                                        <div class="font-semibold text-gray-800">完全</div>
                                        <div class="text-xs text-gray-600">すべての識別情報を削除、統計のみ</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- 使用目的 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">使用目的（任意）</label>
                            <textarea id="purpose" rows="3" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500" placeholder="データの使用目的を入力してください（研究、保護者報告など）"></textarea>
                        </div>

                        <!-- エクスポートボタン -->
                        <button type="submit" class="w-full bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition font-semibold text-lg">
                            <i class="fas fa-download mr-2"></i>
                            エクスポート実行
                        </button>
                    </form>
                </div>

                <!-- プレビュー -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-eye text-blue-600 mr-2"></i>
                        データプレビュー
                    </h2>
                    <div id="dataPreview" class="bg-gray-50 rounded-lg p-4 max-h-96 overflow-auto">
                        <p class="text-gray-500 text-center py-8">エクスポート設定を選択してください</p>
                    </div>
                </div>
            </div>

            <!-- 右側: テンプレートとヘルプ -->
            <div class="space-y-6">
                <!-- クイックテンプレート -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">
                        <i class="fas fa-bolt text-yellow-500 mr-2"></i>
                        クイックテンプレート
                    </h3>
                    <div class="space-y-3">
                        <button onclick="loadTemplate('research')" class="w-full text-left p-3 border-2 border-gray-200 rounded-lg hover:border-purple-500 hover:bg-purple-50 transition">
                            <div class="font-semibold text-gray-800">研究用エクスポート</div>
                            <div class="text-xs text-gray-600 mt-1">完全匿名化・全期間・CSV</div>
                        </button>
                        <button onclick="loadTemplate('progress')" class="w-full text-left p-3 border-2 border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
                            <div class="font-semibold text-gray-800">進捗レポート</div>
                            <div class="text-xs text-gray-600 mt-1">個人・直近3ヶ月・Excel</div>
                        </button>
                        <button onclick="loadTemplate('monthly')" class="w-full text-left p-3 border-2 border-gray-200 rounded-lg hover:border-green-500 hover:bg-green-50 transition">
                            <div class="font-semibold text-gray-800">月次統計</div>
                            <div class="text-xs text-gray-600 mt-1">個人・今月・JSON</div>
                        </button>
                    </div>
                </div>

                <!-- 統計情報 -->
                <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-lg shadow-md p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">
                        <i class="fas fa-info-circle text-blue-600 mr-2"></i>
                        データ統計
                    </h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-700">総レコード数:</span>
                            <span id="totalRecords" class="font-bold text-blue-600">-</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-700">推定ファイルサイズ:</span>
                            <span id="estimatedSize" class="font-bold text-blue-600">-</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-700">データ期間:</span>
                            <span id="dataPeriod" class="font-bold text-blue-600">-</span>
                        </div>
                    </div>
                </div>

                <!-- ヘルプ -->
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-lg">
                    <div class="flex items-start">
                        <i class="fas fa-exclamation-triangle text-yellow-600 mr-3 mt-1"></i>
                        <div class="text-sm text-gray-700">
                            <p class="font-semibold mb-1">ご注意</p>
                            <ul class="list-disc list-inside space-y-1 text-xs">
                                <li>匿名化データは研究・分析目的にのみ使用してください</li>
                                <li>エクスポートしたデータは30日間保存されます</li>
                                <li>大量データの場合、処理に時間がかかることがあります</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- エクスポート履歴 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-history text-gray-600 mr-2"></i>
                    エクスポート履歴
                </h2>
                <button onclick="loadExportHistory()" class="px-3 py-1 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                    <i class="fas fa-sync-alt mr-1"></i>更新
                </button>
            </div>
            <div id="exportHistory" class="overflow-x-auto">
                <p class="text-gray-500 text-center py-8">読み込み中...</p>
            </div>
        </div>
    </div>

    <!-- ダウンロード進行状況モーダル -->
    <div id="downloadModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full mx-4">
            <div class="text-center">
                <div class="mb-4">
                    <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">エクスポート中...</h3>
                <p class="text-gray-600 mb-4" id="progressText">データを処理しています</p>
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div id="progressBar" class="download-progress bg-blue-600 h-4 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setDefaultDates();
            loadExportHistory();
            
            // イベントリスナー
            document.getElementById('exportForm').addEventListener('submit', handleExport);
            
            // エクスポート種別変更時
            document.querySelectorAll('input[name="exportType"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const anonymizationSettings = document.getElementById('anonymizationSettings');
                    if (e.target.value === 'anonymized') {
                        anonymizationSettings.classList.remove('hidden');
                    } else {
                        anonymizationSettings.classList.add('hidden');
                    }
                    updateDataStats();
                });
            });

            // フィルター変更時
            ['dateFrom', 'dateTo'].forEach(id => {
                document.getElementById(id).addEventListener('change', updateDataStats);
            });
            document.querySelectorAll('input[name="subjects"]').forEach(checkbox => {
                checkbox.addEventListener('change', updateDataStats);
            });
        });

        // 認証チェック
        async function checkAuth() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }

                const response = await axios.get('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.data.success) {
                    document.getElementById('userName').textContent = response.data.user.name + ' さん';
                } else {
                    throw new Error('認証失敗');
                }
            } catch (error) {
                console.error('認証エラー:', error);
                window.location.href = '/login.html';
            }
        }

        // デフォルト日付設定
        function setDefaultDates() {
            const today = new Date();
            const threeMonthsAgo = new Date(today);
            threeMonthsAgo.setMonth(today.getMonth() - 3);

            document.getElementById('dateTo').valueAsDate = today;
            document.getElementById('dateFrom').valueAsDate = threeMonthsAgo;
        }

        // テンプレート読み込み
        function loadTemplate(type) {
            const today = new Date();
            const dateToInput = document.getElementById('dateTo');
            const dateFromInput = document.getElementById('dateFrom');

            switch(type) {
                case 'research':
                    document.querySelector('input[name="exportType"][value="anonymized"]').checked = true;
                    document.querySelector('input[name="format"][value="csv"]').checked = true;
                    document.querySelector('input[name="anonymizationLevel"][value="full"]').checked = true;
                    document.getElementById('anonymizationSettings').classList.remove('hidden');
                    dateFromInput.value = '2020-01-01';
                    dateToInput.valueAsDate = today;
                    document.getElementById('purpose').value = '学術研究のため';
                    break;
                case 'progress':
                    document.querySelector('input[name="exportType"][value="individual"]').checked = true;
                    document.querySelector('input[name="format"][value="excel"]').checked = true;
                    document.getElementById('anonymizationSettings').classList.add('hidden');
                    const threeMonthsAgo = new Date(today);
                    threeMonthsAgo.setMonth(today.getMonth() - 3);
                    dateFromInput.valueAsDate = threeMonthsAgo;
                    dateToInput.valueAsDate = today;
                    document.getElementById('purpose').value = '学習進捗の確認';
                    break;
                case 'monthly':
                    document.querySelector('input[name="exportType"][value="individual"]').checked = true;
                    document.querySelector('input[name="format"][value="json"]').checked = true;
                    document.getElementById('anonymizationSettings').classList.add('hidden');
                    const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
                    dateFromInput.valueAsDate = firstDayOfMonth;
                    dateToInput.valueAsDate = today;
                    document.getElementById('purpose').value = '月次統計';
                    break;
            }
            updateDataStats();
        }

        // データ統計更新
        async function updateDataStats() {
            const token = localStorage.getItem('token');
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const subjects = Array.from(document.querySelectorAll('input[name="subjects"]:checked')).map(cb => cb.value);

            try {
                const response = await axios.get(`/api/export/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                    params: {
                        date_from: dateFrom,
                        date_to: dateTo,
                        subjects: subjects.join(',')
                    }
                });

                const stats = response.data.data;
                document.getElementById('totalRecords').textContent = stats.record_count.toLocaleString();
                document.getElementById('estimatedSize').textContent = formatFileSize(stats.estimated_size);
                document.getElementById('dataPeriod').textContent = `${dateFrom} 〜 ${dateTo}`;
            } catch (error) {
                console.error('統計取得エラー:', error);
            }
        }

        // エクスポート実行
        async function handleExport(e) {
            e.preventDefault();
            
            const token = localStorage.getItem('token');
            const exportType = document.querySelector('input[name="exportType"]:checked').value;
            const format = document.querySelector('input[name="format"]:checked').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const subjects = Array.from(document.querySelectorAll('input[name="subjects"]:checked')).map(cb => cb.value);
            const purpose = document.getElementById('purpose').value;

            let anonymizationLevel = null;
            if (exportType === 'anonymized') {
                anonymizationLevel = document.querySelector('input[name="anonymizationLevel"]:checked').value;
            }

            // モーダル表示
            showDownloadModal();

            try {
                const response = await axios.post('/api/export/create', {
                    export_type: exportType,
                    format: format,
                    date_from: dateFrom,
                    date_to: dateTo,
                    subjects: subjects,
                    anonymization_level: anonymizationLevel,
                    purpose: purpose
                }, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.data.success) {
                    // ダウンロード
                    updateProgress(100, 'ダウンロード準備完了');
                    setTimeout(() => {
                        window.location.href = response.data.data.download_url;
                        hideDownloadModal();
                        loadExportHistory();
                        alert('エクスポートが完了しました！');
                    }, 500);
                } else {
                    throw new Error(response.data.error);
                }
            } catch (error) {
                console.error('エクスポートエラー:', error);
                hideDownloadModal();
                alert('エクスポートに失敗しました: ' + (error.response?.data?.error || error.message));
            }
        }

        // エクスポート履歴読み込み
        async function loadExportHistory() {
            const token = localStorage.getItem('token');
            const container = document.getElementById('exportHistory');

            try {
                const response = await axios.get('/api/export/history', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const history = response.data.data;
                
                if (history.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-8">エクスポート履歴がありません</p>';
                    return;
                }

                container.innerHTML = `
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">日時</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">種別</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">形式</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">レコード数</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">サイズ</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${history.map(item => `
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                        ${new Date(item.created_at).toLocaleString('ja-JP')}
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                                        <span class="px-2 py-1 rounded-full text-xs ${item.export_type === 'anonymized' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">
                                            ${item.export_type === 'anonymized' ? '匿名化' : '個人'}
                                        </span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.format.toUpperCase()}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.record_count.toLocaleString()}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatFileSize(item.file_size)}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                                        <a href="${item.file_url}" class="text-blue-600 hover:text-blue-800 mr-3">
                                            <i class="fas fa-download"></i> ダウンロード
                                        </a>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('履歴読み込みエラー:', error);
                container.innerHTML = '<p class="text-red-500 text-center py-8">履歴の読み込みに失敗しました</p>';
            }
        }

        // モーダル表示/非表示
        function showDownloadModal() {
            document.getElementById('downloadModal').classList.remove('hidden');
            updateProgress(0, 'データを処理しています...');
            // 擬似的な進行状況更新
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                if (progress <= 90) {
                    updateProgress(progress, 'データを処理しています...');
                } else {
                    clearInterval(interval);
                }
            }, 300);
        }

        function hideDownloadModal() {
            document.getElementById('downloadModal').classList.add('hidden');
        }

        function updateProgress(percent, text) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        // ファイルサイズフォーマット
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
    </script>
</body>
</html>
