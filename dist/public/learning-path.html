<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習経路ダッシュボード | 自由進度学習プラットフォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-50">
    <!-- ナビゲーションバー -->
    <nav class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-route text-2xl mr-3"></i>
                    <span class="text-xl font-bold">学習経路ダッシュボード</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userName" class="text-white"></span>
                    <a href="/dashboard.html" class="px-4 py-2 bg-white text-indigo-600 rounded-lg hover:bg-indigo-50 transition">
                        <i class="fas fa-home mr-2"></i>ダッシュボード
                    </a>
                    <button onclick="logout()" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>ログアウト
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 教科選択 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">
                <i class="fas fa-book mr-2"></i>
                教科を選択
            </h2>
            <div class="flex flex-wrap gap-4">
                <button onclick="loadCurriculum('数学')" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                    <i class="fas fa-calculator mr-2"></i>数学
                </button>
                <button onclick="loadCurriculum('国語')" class="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">
                    <i class="fas fa-book-reader mr-2"></i>国語
                </button>
                <button onclick="loadCurriculum('理科')" class="px-6 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">
                    <i class="fas fa-flask mr-2"></i>理科
                </button>
                <button onclick="loadCurriculum('社会')" class="px-6 py-3 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition">
                    <i class="fas fa-globe-asia mr-2"></i>社会
                </button>
                <button onclick="loadCurriculum('英語')" class="px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
                    <i class="fas fa-language mr-2"></i>英語
                </button>
            </div>
        </div>

        <!-- ローディング -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
            <p class="mt-4 text-gray-600">学習経路を生成中...</p>
        </div>

        <!-- コンテンツ -->
        <div id="content" class="hidden">
            <!-- 次のマイルストーン -->
            <div class="bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded-lg shadow-lg p-6 mb-6">
                <h3 class="text-2xl font-bold mb-4">
                    <i class="fas fa-flag-checkered mr-2"></i>
                    次のマイルストーン
                </h3>
                <div id="nextMilestone"></div>
            </div>

            <!-- 推奨学習経路 -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h3 class="text-2xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-map-marked-alt mr-2"></i>
                    あなたにおすすめの学習経路
                </h3>
                <div id="recommendedPath" class="space-y-4"></div>
            </div>

            <!-- 苦手分野 -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h3 class="text-2xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-exclamation-triangle text-yellow-500 mr-2"></i>
                    強化が必要な分野
                </h3>
                <div id="weakAreas" class="space-y-4"></div>
            </div>

            <!-- 習得度予測 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-2xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-chart-line mr-2"></i>
                    習得度予測
                </h3>
                <div id="predictions" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script>
        let currentSubject = null

        // 認証チェック
        function checkAuth() {
            const token = localStorage.getItem('token')
            if (!token) {
                window.location.href = '/auth-demo.html'
                return false
            }
            
            axios.defaults.headers.common['Authorization'] = `Bearer ${token}`
            
            const user = JSON.parse(localStorage.getItem('user') || '{}')
            if (user.name) {
                document.getElementById('userName').textContent = user.name
            }
            
            return true
        }

        // ログアウト
        function logout() {
            localStorage.removeItem('token')
            localStorage.removeItem('user')
            window.location.href = '/auth-demo.html'
        }

        // カリキュラムを読み込み
        async function loadCurriculum(subject) {
            currentSubject = subject
            const loading = document.getElementById('loading')
            const content = document.getElementById('content')
            
            loading.classList.remove('hidden')
            content.classList.add('hidden')
            
            try {
                // 適応的カリキュラムを取得
                const response = await axios.get('/api/learning-path/curriculum', {
                    params: { subject }
                })
                
                const { curriculum } = response.data
                
                // 次のマイルストーンを表示
                displayNextMilestone(curriculum.next_milestone)
                
                // 推奨学習経路を表示
                displayRecommendedPath(curriculum.recommended_path)
                
                // 苦手分野を表示
                displayWeakAreas(curriculum.weak_areas)
                
                // 習得度予測を取得して表示
                if (curriculum.recommended_path.length > 0) {
                    const unitIds = curriculum.recommended_path.slice(0, 5).map(u => u.unit_id).join(',')
                    const predResponse = await axios.get('/api/learning-path/prediction', {
                        params: { unit_ids: unitIds }
                    })
                    displayPredictions(predResponse.data.predictions)
                }
                
                loading.classList.add('hidden')
                content.classList.remove('hidden')
            } catch (error) {
                console.error('❌ カリキュラム取得エラー:', error)
                loading.innerHTML = `
                    <div class="text-red-600">
                        <i class="fas fa-exclamation-triangle text-4xl mb-2"></i>
                        <p>カリキュラムの取得に失敗しました</p>
                    </div>
                `
            }
        }

        // 次のマイルストーンを表示
        function displayNextMilestone(milestone) {
            const div = document.getElementById('nextMilestone')
            
            if (milestone.unit_id === 0) {
                div.innerHTML = `
                    <div class="flex items-center">
                        <i class="fas fa-trophy text-5xl mr-4"></i>
                        <div>
                            <h4 class="text-3xl font-bold">${milestone.unit_name}</h4>
                            <p class="text-xl mt-2">全ての単元を習得しました！素晴らしい成果です 🎉</p>
                        </div>
                    </div>
                `
            } else {
                div.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <h4 class="text-3xl font-bold mb-2">${milestone.unit_name}</h4>
                            <div class="flex items-center">
                                <div class="flex-1 bg-white bg-opacity-30 rounded-full h-4 mr-4">
                                    <div class="bg-white h-4 rounded-full transition-all duration-500" 
                                        style="width: ${milestone.progress}%"></div>
                                </div>
                                <span class="text-2xl font-bold">${milestone.progress}%</span>
                            </div>
                        </div>
                        <i class="fas fa-bullseye text-6xl ml-6"></i>
                    </div>
                `
            }
        }

        // 推奨学習経路を表示
        function displayRecommendedPath(path) {
            const div = document.getElementById('recommendedPath')
            
            div.innerHTML = path.map((unit, index) => {
                const priorityColor = unit.priority >= 8 ? 'red' : unit.priority >= 5 ? 'yellow' : 'green'
                const priorityIcon = unit.priority >= 8 ? 'exclamation-circle' : unit.priority >= 5 ? 'info-circle' : 'check-circle'
                
                return `
                    <div class="border-l-4 border-${priorityColor}-500 bg-${priorityColor}-50 p-4 rounded-r-lg hover:shadow-md transition">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center mb-2">
                                    <span class="bg-${priorityColor}-500 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold mr-3">
                                        ${index + 1}
                                    </span>
                                    <h4 class="text-xl font-bold text-gray-800">${unit.unit_name}</h4>
                                    <span class="ml-auto text-sm text-gray-600">${unit.estimated_time}</span>
                                </div>
                                <div class="flex items-center mb-2">
                                    <div class="flex-1 bg-gray-200 rounded-full h-2 mr-4">
                                        <div class="bg-gradient-to-r from-blue-400 to-blue-600 h-2 rounded-full" 
                                            style="width: ${unit.mastery_level}%"></div>
                                    </div>
                                    <span class="text-sm font-semibold text-gray-700">${unit.mastery_level}%</span>
                                </div>
                                <p class="text-gray-700">
                                    <i class="fas fa-${priorityIcon} text-${priorityColor}-500 mr-2"></i>
                                    ${unit.reason}
                                </p>
                            </div>
                        </div>
                    </div>
                `
            }).join('')
        }

        // 苦手分野を表示
        function displayWeakAreas(areas) {
            const div = document.getElementById('weakAreas')
            
            if (areas.length === 0) {
                div.innerHTML = `
                    <div class="text-center py-8 text-green-600">
                        <i class="fas fa-check-circle text-5xl mb-4"></i>
                        <p class="text-xl font-bold">現在、特に苦手な分野はありません！</p>
                        <p class="text-gray-600 mt-2">この調子で学習を続けましょう 🎉</p>
                    </div>
                `
                return
            }
            
            div.innerHTML = areas.map(area => {
                const needsReinforcement = area.reinforcement_needed
                
                return `
                    <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <h4 class="text-lg font-bold text-gray-800 mb-2">
                                    ${area.unit_name}
                                    ${needsReinforcement ? '<span class="ml-2 text-xs bg-red-500 text-white px-2 py-1 rounded">要補強</span>' : ''}
                                </h4>
                                <div class="flex items-center mb-2">
                                    <div class="flex-1 bg-gray-200 rounded-full h-2 mr-4">
                                        <div class="bg-red-500 h-2 rounded-full" style="width: ${area.mastery_level}%"></div>
                                    </div>
                                    <span class="text-sm font-semibold text-red-700">${area.mastery_level}%</span>
                                </div>
                                <button 
                                    onclick="generateReinforcementPlan(${area.unit_id}, '${area.unit_name}')"
                                    class="mt-2 px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition"
                                >
                                    <i class="fas fa-heartbeat mr-2"></i>補強計画を作成
                                </button>
                            </div>
                        </div>
                    </div>
                `
            }).join('')
        }

        // 習得度予測を表示
        function displayPredictions(predictions) {
            const div = document.getElementById('predictions')
            
            div.innerHTML = predictions.map(pred => {
                return `
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg">
                        <h4 class="text-lg font-bold text-gray-800 mb-3">${pred.unit_name}</h4>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div>
                                <p class="text-sm text-gray-600">現在</p>
                                <p class="text-2xl font-bold text-blue-600">${pred.current_mastery}%</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-600">1週間後</p>
                                <p class="text-2xl font-bold text-green-600">${pred.predicted_mastery_7days}%</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-600">1ヶ月後</p>
                                <p class="text-2xl font-bold text-purple-600">${pred.predicted_mastery_30days}%</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-600">習得まで</p>
                                <p class="text-xl font-bold text-indigo-600">${pred.estimated_time_to_master}</p>
                            </div>
                        </div>
                        <p class="mt-2 text-sm text-gray-700">
                            <i class="fas fa-dumbbell mr-2"></i>
                            推奨練習問題数: ${pred.recommended_practice_count}問
                        </p>
                    </div>
                `
            }).join('')
        }

        // 補強計画を生成
        async function generateReinforcementPlan(unitId, unitName) {
            if (!confirm(`「${unitName}」の補強計画を作成しますか？`)) {
                return
            }
            
            try {
                const response = await axios.post('/api/learning-path/reinforcement', {
                    weak_unit_id: unitId
                })
                
                const { plan } = response.data
                
                // モーダルで表示
                alert(`補強計画を作成しました！\n\n【${plan.weak_unit.unit_name}】\n習熟度: ${plan.weak_unit.mastery_level}%\n\n推奨アクション:\n${plan.reinforcement_actions.map((a, i) => `${i+1}. ${a.description} (${a.estimated_time})`).join('\n')}\n\nこの計画に沿って学習を進めましょう！`)
                
                // ページを再読み込み
                loadCurriculum(currentSubject)
            } catch (error) {
                console.error('❌ 補強計画生成エラー:', error)
                alert('補強計画の作成に失敗しました')
            }
        }

        // 初期化
        window.onload = function() {
            if (checkAuth()) {
                // 最初は何も表示しない（教科選択待ち）
            }
        }
    </script>
</body>
</html>
