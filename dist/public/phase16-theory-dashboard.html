<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 16: 12理論統合ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- ヘッダー -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-brain text-purple-600 mr-2"></i>
                12理論統合ダッシュボード
            </h1>
            <p class="text-gray-600">あなたの学習プロファイルと最適化された学習リソース</p>
        </header>

        <!-- 生徒選択 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">生徒ID</label>
            <input type="text" id="studentId" class="w-full border rounded px-3 py-2" placeholder="S001" value="S001">
            <button onclick="loadDashboard()" class="mt-3 bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700">
                <i class="fas fa-sync-alt mr-2"></i>ダッシュボード読み込み
            </button>
        </div>

        <!-- 12理論プロファイル可視化 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- レーダーチャート -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chart-radar text-purple-600 mr-2"></i>
                    12理論プロファイル（レーダーチャート）
                </h2>
                <canvas id="theoryRadarChart"></canvas>
            </div>

            <!-- バーチャート -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chart-bar text-blue-600 mr-2"></i>
                    理論別スコア（バーチャート）
                </h2>
                <canvas id="theoryBarChart"></canvas>
            </div>
        </div>

        <!-- 理論詳細カード -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-list text-green-600 mr-2"></i>
                理論詳細
            </h2>
            <div id="theoryDetails" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- 推薦カード -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-lightbulb text-yellow-600 mr-2"></i>
                あなたに最適化された学習カード
            </h2>
            <div id="recommendedCards" class="space-y-3">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- 推薦問題 -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-question-circle text-red-600 mr-2"></i>
                あなたに最適化された問題
            </h2>
            <div id="recommendedProblems" class="space-y-3">
                <!-- 動的に生成 -->
            </div>
        </div>
    </div>

    <script>
        let radarChart = null;
        let barChart = null;

        const theoryNames = {
            'F1': '戦略的学習様式',
            'F2': '統合的能力発達',
            'F3': '深化的経験学習',
            'F4': 'データ駆動型適応指導',
            'F5': '統合的自己調整学習',
            'F6': 'エビデンスベースド学習方略',
            'F7': '動的足場かけ',
            'F8': 'ウェルビーイング統合動機づけ',
            'F9': '21世紀型コンピテンシー',
            'F10': '領域固有認知発達',
            'F11': '真正学習・実践参加',
            'F12': '神経情動統合学習'
        };

        const theoryDescriptions = {
            'F1': '視覚・聴覚・読み書き・体験の学習様式',
            'F2': '多様な能力の成長可能性',
            'F3': '体験→振り返り→概念化→実践のサイクル',
            'F4': 'AIによる個別最適化指導',
            'F5': '計画→実行→振り返りの自己調整',
            'F6': '科学的に効果が証明された学習方法',
            'F7': '段階的な支援と自立への移行',
            'F8': '自律性・有能感・関係性の動機づけ',
            'F9': '知識・思考力・学びに向かう力',
            'F10': '教科固有のものの見方・考え方',
            'F11': '実社会とのつながり',
            'F12': '感情と認知の統合'
        };

        async function loadDashboard() {
            const studentId = document.getElementById('studentId').value;
            
            if (!studentId) {
                alert('生徒IDを入力してください');
                return;
            }

            try {
                // 12理論プロファイル取得
                const profileRes = await fetch(`/api/theory-assessment/profile/${studentId}`);
                const profileData = await profileRes.json();

                if (profileData.success && profileData.profile) {
                    renderTheoryCharts(profileData.profile);
                    renderTheoryDetails(profileData.profile);
                } else {
                    alert('12理論プロファイルが見つかりません。適性診断を受けてください。');
                    return;
                }

                // 推薦カード取得
                const cardsRes = await fetch(`/api/cards/recommended/${studentId}?limit=5`);
                const cardsData = await cardsRes.json();
                if (cardsData.success) {
                    renderRecommendedCards(cardsData.cards);
                }

                // 推薦問題取得
                const problemsRes = await fetch(`/api/problems/recommended/${studentId}?limit=5`);
                const problemsData = await problemsRes.json();
                if (problemsData.success) {
                    renderRecommendedProblems(problemsData.problems);
                }

            } catch (error) {
                console.error('ダッシュボード読み込みエラー:', error);
                alert('ダッシュボードの読み込みに失敗しました');
            }
        }

        function renderTheoryCharts(profile) {
            const theoryScores = profile.theory_scores;
            const labels = Object.keys(theoryScores).map(code => theoryNames[code] || code);
            const data = Object.values(theoryScores).map(score => score * 100);

            // レーダーチャート
            const radarCtx = document.getElementById('theoryRadarChart').getContext('2d');
            if (radarChart) radarChart.destroy();
            radarChart = new Chart(radarCtx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '理論スコア (%)',
                        data: data,
                        backgroundColor: 'rgba(147, 51, 234, 0.2)',
                        borderColor: 'rgba(147, 51, 234, 1)',
                        borderWidth: 2,
                        pointBackgroundColor: 'rgba(147, 51, 234, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(147, 51, 234, 1)'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { display: true },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // バーチャート
            const barCtx = document.getElementById('theoryBarChart').getContext('2d');
            if (barChart) barChart.destroy();
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '理論スコア (%)',
                        data: data,
                        backgroundColor: 'rgba(59, 130, 246, 0.5)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 100
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function renderTheoryDetails(profile) {
            const theoryScores = profile.theory_scores;
            const container = document.getElementById('theoryDetails');
            container.innerHTML = '';

            Object.entries(theoryScores).forEach(([code, score]) => {
                const percentage = Math.round(score * 100);
                const level = percentage > 70 ? '高' : percentage > 40 ? '中' : '低';
                const levelColor = percentage > 70 ? 'text-green-600' : percentage > 40 ? 'text-yellow-600' : 'text-red-600';

                const card = document.createElement('div');
                card.className = 'border rounded p-4 hover:shadow-md transition';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-sm">${code}: ${theoryNames[code]}</h3>
                        <span class="${levelColor} font-bold">${level}</span>
                    </div>
                    <p class="text-xs text-gray-600 mb-2">${theoryDescriptions[code]}</p>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-purple-600 h-2 rounded-full" style="width: ${percentage}%"></div>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">${percentage}%</p>
                `;
                container.appendChild(card);
            });
        }

        function renderRecommendedCards(cards) {
            const container = document.getElementById('recommendedCards');
            container.innerHTML = '';

            if (!cards || cards.length === 0) {
                container.innerHTML = '<p class="text-gray-500">推薦カードはありません</p>';
                return;
            }

            cards.forEach(card => {
                const div = document.createElement('div');
                div.className = 'border-l-4 border-purple-600 bg-purple-50 p-4 rounded';
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800">${card.title || card.card_id}</h3>
                            <p class="text-sm text-gray-600 mt-1">${card.recommendation_reason || ''}</p>
                            <p class="text-xs text-purple-600 mt-2">
                                <i class="fas fa-star"></i> 適合度: ${Math.round((card.match_score || 0) * 100)}%
                            </p>
                        </div>
                        <button class="ml-4 bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700">
                            学習開始
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderRecommendedProblems(problems) {
            const container = document.getElementById('recommendedProblems');
            container.innerHTML = '';

            if (!problems || problems.length === 0) {
                container.innerHTML = '<p class="text-gray-500">推薦問題はありません</p>';
                return;
            }

            problems.forEach(problem => {
                const div = document.createElement('div');
                div.className = 'border-l-4 border-red-600 bg-red-50 p-4 rounded';
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800">${problem.subject || ''} - ${problem.unit_name || ''}</h3>
                            <p class="text-sm text-gray-600 mt-1">${problem.question?.substring(0, 100) || ''}...</p>
                            <p class="text-xs text-red-600 mt-2">
                                <i class="fas fa-star"></i> ${problem.recommendation_reason || ''}
                            </p>
                        </div>
                        <button class="ml-4 bg-red-600 text-white px-4 py-2 rounded text-sm hover:bg-red-700">
                            挑戦する
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 初期読み込み
        window.onload = () => {
            loadDashboard();
        };
    </script>
</body>
</html>
