<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保護者ダッシュボード - 自由進度学習システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .progress-ring { transition: stroke-dashoffset 1s ease; }
        .confidence-bar { transition: width 1s ease; }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 min-h-screen">
    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
                        <i class="fas fa-home text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold">保護者ダッシュボード</h1>
                        <p class="text-xs text-amber-100" id="studentNameHeader">お子さまの学習状況</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs bg-white bg-opacity-20 rounded-full px-3 py-1" id="dateDisplay"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-4" id="mainContent">
        <!-- ローディング -->
        <div id="loading" class="text-center py-20">
            <i class="fas fa-spinner fa-spin text-4xl text-amber-500 mb-4"></i>
            <p class="text-gray-500">データを読み込み中...</p>
        </div>
    </main>

    <script>
    const urlParams = new URLSearchParams(window.location.search)
    const studentId = parseInt(urlParams.get('student_id')) || 1

    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' })

    async function loadDashboard() {
        try {
            const { data } = await axios.get(`/api/parent/dashboard/${studentId}`)
            if (!data.success) throw new Error(data.error)
            
            document.getElementById('loading').style.display = 'none'
            renderDashboard(data)
        } catch (error) {
            document.getElementById('loading').innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-exclamation-circle text-4xl text-red-400 mb-4"></i>
                    <p class="text-gray-600">データの読み込みに失敗しました</p>
                    <p class="text-sm text-gray-400 mt-1">${error.message}</p>
                    <button onclick="loadDashboard()" class="mt-4 px-4 py-2 bg-amber-500 text-white rounded-lg hover:bg-amber-600 transition">
                        再読み込み
                    </button>
                </div>
            `
        }
    }

    function renderDashboard(data) {
        const s = data.student || {}
        const ws = data.weekly_summary || {}
        const pp = data.plan_progress || {}
        const tps = data.test_prep_plans || []
        const pcs = data.personalized_courses || []
        const tc = data.teacher_comments || []
        const refs = data.reflections || []
        const trends = data.learning_trends || {}
        
        document.getElementById('studentNameHeader').textContent = 
            `${s.student_name || '児童' + studentId} さん${s.grade_level ? '（' + s.grade_level + '年生）' : ''}`

        const main = document.getElementById('mainContent')
        main.innerHTML = `
            <!-- 保護者へのメッセージ -->
            <div class="bg-white rounded-2xl p-5 shadow-md border border-amber-100 fade-in card-hover">
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-envelope-open-text text-amber-600"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-gray-800 mb-1">
                            <i class="fas fa-sun text-yellow-500 mr-1"></i>
                            ${s.student_name || 'お子さま'}さんの学習レポート
                        </h2>
                        <p class="text-sm text-gray-600 leading-relaxed">${data.parent_message || ''}</p>
                    </div>
                </div>
            </div>

            <!-- 概要カード -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 fade-in" style="animation-delay:0.1s">
                <div class="bg-white rounded-xl p-4 shadow-sm border border-blue-100 text-center card-hover">
                    <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-pencil-alt text-blue-500"></i>
                    </div>
                    <div class="text-2xl font-bold text-blue-600">${ws.answers_count || 0}</div>
                    <div class="text-xs text-gray-500">今週の解答数</div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-green-100 text-center card-hover">
                    <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-check-circle text-green-500"></i>
                    </div>
                    <div class="text-2xl font-bold text-green-600">${ws.correct_rate || 0}%</div>
                    <div class="text-xs text-gray-500">正答率</div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-purple-100 text-center card-hover">
                    <div class="w-10 h-10 bg-purple-50 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-tasks text-purple-500"></i>
                    </div>
                    <div class="text-2xl font-bold text-purple-600">${pp.completed_hours || 0}/${pp.total_hours || 0}</div>
                    <div class="text-xs text-gray-500">計画進捗(時間)</div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm border border-orange-100 text-center card-hover">
                    <div class="w-10 h-10 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-clipboard-check text-orange-500"></i>
                    </div>
                    <div class="text-2xl font-bold text-orange-600">${tps.length}</div>
                    <div class="text-xs text-gray-500">テスト対策</div>
                </div>
            </div>

            <!-- 学習計画の進捗 -->
            ${pp.plan_name ? `
            <div class="bg-white rounded-2xl p-5 shadow-md border border-purple-100 fade-in card-hover" style="animation-delay:0.15s">
                <h3 class="font-bold text-gray-800 mb-3">
                    <i class="fas fa-calendar-alt text-purple-500 mr-2"></i>学習計画の進捗
                </h3>
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-gray-600">${pp.plan_name}</span>
                    <span class="text-sm font-bold text-purple-600">${pp.total_hours > 0 ? Math.round(pp.completed_hours / pp.total_hours * 100) : 0}%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div class="bg-gradient-to-r from-purple-400 to-purple-600 h-3 rounded-full transition-all confidence-bar" 
                         style="width:${pp.total_hours > 0 ? Math.round(pp.completed_hours / pp.total_hours * 100) : 0}%"></div>
                </div>
                <p class="text-xs text-gray-500 mt-2">${pp.completed_hours}時間完了 / ${pp.total_hours}時間中</p>
            </div>` : ''}

            <!-- 先生が作った個別コース -->
            ${pcs.length > 0 ? `
            <div class="bg-white rounded-2xl p-5 shadow-md border border-pink-100 fade-in card-hover" style="animation-delay:0.2s">
                <h3 class="font-bold text-gray-800 mb-3">
                    <i class="fas fa-magic text-pink-500 mr-2"></i>先生が作ったお子さま専用コース
                </h3>
                <div class="space-y-3">
                    ${pcs.map(pc => `
                    <div class="border-2 border-pink-200 rounded-xl p-4 bg-gradient-to-r from-pink-50 to-orange-50">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-bold text-pink-700 text-sm">${pc.course_name || '個別最適化コース'}</span>
                            <span class="text-xs bg-pink-100 text-pink-600 px-2 py-1 rounded-full">${pc.card_count}枚のカード</span>
                        </div>
                        ${pc.analysis_summary ? `
                        <p class="text-xs text-gray-600 mb-2">
                            <i class="fas fa-robot text-pink-400 mr-1"></i>
                            <strong>AI分析:</strong> ${pc.analysis_summary}
                        </p>` : ''}
                        ${pc.recommended_approach ? `
                        <p class="text-xs text-gray-600">
                            <i class="fas fa-compass text-orange-400 mr-1"></i>
                            <strong>学習方法:</strong> ${pc.recommended_approach}
                        </p>` : ''}
                        ${pc.published_at ? `
                        <p class="text-xs text-gray-400 mt-2">
                            <i class="fas fa-clock mr-1"></i>配信日: ${new Date(pc.published_at).toLocaleDateString('ja-JP')}
                        </p>` : ''}
                    </div>
                    `).join('')}
                    <p class="text-xs text-pink-600 bg-pink-50 rounded-lg p-2">
                        <i class="fas fa-info-circle mr-1"></i>
                        先生がお子さまの学習データを分析し、つまずきやすい部分を重点的にカバーする専用コースを作成しました。
                    </p>
                </div>
            </div>` : ''}

            <!-- テスト対策プラン -->
            ${tps.length > 0 ? `
            <div class="bg-white rounded-2xl p-5 shadow-md border border-blue-100 fade-in card-hover" style="animation-delay:0.25s">
                <h3 class="font-bold text-gray-800 mb-3">
                    <i class="fas fa-clipboard-check text-blue-500 mr-2"></i>テスト対策プラン
                </h3>
                <div class="space-y-3">
                    ${tps.map(plan => `
                    <div class="border rounded-xl p-4 ${plan.status === 'completed' ? 'bg-green-50 border-green-200' : 'bg-blue-50 border-blue-200'}">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-sm text-gray-800">${plan.title || 'テスト対策'}</span>
                            <span class="text-xs px-2 py-1 rounded-full font-bold ${
                                plan.status === 'completed' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'
                            }">${plan.status === 'completed' ? '完了' : '進行中'}</span>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-gray-600">
                            <span><i class="fas fa-book mr-1"></i>${plan.subject || ''}</span>
                            <span><i class="fas fa-calendar mr-1"></i>テスト日: ${plan.test_date || '未定'}</span>
                            ${plan.total_study_minutes > 0 ? `<span><i class="fas fa-clock mr-1"></i>${plan.total_study_minutes}分学習</span>` : ''}
                        </div>
                    </div>
                    `).join('')}
                </div>
            </div>` : ''}

            <!-- 強みと弱み -->
            ${(trends.strengths?.length > 0 || trends.weaknesses?.length > 0) ? `
            <div class="bg-white rounded-2xl p-5 shadow-md border border-gray-100 fade-in card-hover" style="animation-delay:0.3s">
                <h3 class="font-bold text-gray-800 mb-3">
                    <i class="fas fa-chart-bar text-indigo-500 mr-2"></i>学習の傾向
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${trends.strengths?.length > 0 ? `
                    <div class="bg-green-50 rounded-xl p-4">
                        <h4 class="font-bold text-green-700 text-sm mb-2">
                            <i class="fas fa-star mr-1"></i>得意なところ
                        </h4>
                        <div class="space-y-2">
                            ${trends.strengths.map(s => `
                            <div class="flex items-center gap-2">
                                <i class="fas fa-check-circle text-green-500 text-xs"></i>
                                <span class="text-xs text-gray-700">${s.topic}</span>
                                ${s.confidence ? `
                                <div class="flex-1 bg-green-200 rounded-full h-1.5 ml-auto max-w-[60px]">
                                    <div class="bg-green-500 h-1.5 rounded-full confidence-bar" style="width:${s.confidence/5*100}%"></div>
                                </div>` : ''}
                            </div>
                            `).join('')}
                        </div>
                    </div>` : ''}
                    ${trends.weaknesses?.length > 0 ? `
                    <div class="bg-orange-50 rounded-xl p-4">
                        <h4 class="font-bold text-orange-700 text-sm mb-2">
                            <i class="fas fa-hand-holding-heart mr-1"></i>もう少しがんばるところ
                        </h4>
                        <div class="space-y-2">
                            ${trends.weaknesses.map(w => `
                            <div class="flex items-center gap-2">
                                <i class="fas fa-seedling text-orange-500 text-xs"></i>
                                <span class="text-xs text-gray-700">${w.topic}</span>
                                ${w.confidence ? `
                                <div class="flex-1 bg-orange-200 rounded-full h-1.5 ml-auto max-w-[60px]">
                                    <div class="bg-orange-500 h-1.5 rounded-full confidence-bar" style="width:${w.confidence/5*100}%"></div>
                                </div>` : ''}
                            </div>
                            `).join('')}
                        </div>
                        <p class="text-xs text-orange-600 mt-2 bg-orange-100 rounded-lg p-2">
                            <i class="fas fa-lightbulb mr-1"></i>先生がこれらの部分を重点的にサポートしています。
                        </p>
                    </div>` : ''}
                </div>
            </div>` : ''}

            <!-- お子さまの振り返り -->
            ${refs.length > 0 ? `
            <div class="bg-white rounded-2xl p-5 shadow-md border border-teal-100 fade-in card-hover" style="animation-delay:0.35s">
                <h3 class="font-bold text-gray-800 mb-3">
                    <i class="fas fa-heart text-teal-500 mr-2"></i>お子さまの振り返り（成長の記録）
                </h3>
                <div class="space-y-3">
                    ${refs.map(r => `
                    <div class="border border-teal-100 rounded-xl p-4 bg-teal-50">
                        ${r.goal_achievement ? `
                        <div class="flex items-start gap-2 mb-2">
                            <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold flex-shrink-0 mt-0.5">達成</span>
                            <p class="text-xs text-gray-700">${r.goal_achievement}</p>
                        </div>` : ''}
                        ${r.most_important_learning ? `
                        <div class="flex items-start gap-2 mb-2">
                            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold flex-shrink-0 mt-0.5">学び</span>
                            <p class="text-xs text-gray-700">${r.most_important_learning}</p>
                        </div>` : ''}
                        ${r.effective_methods ? `
                        <div class="flex items-start gap-2 mb-2">
                            <span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold flex-shrink-0 mt-0.5">方法</span>
                            <p class="text-xs text-gray-700">${r.effective_methods}</p>
                        </div>` : ''}
                        ${r.next_unit_application ? `
                        <div class="flex items-start gap-2">
                            <span class="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-bold flex-shrink-0 mt-0.5">次回</span>
                            <p class="text-xs text-gray-700">${r.next_unit_application}</p>
                        </div>` : ''}
                        <p class="text-xs text-gray-400 mt-2 text-right">${r.created_at ? new Date(r.created_at).toLocaleDateString('ja-JP') : ''}</p>
                    </div>
                    `).join('')}
                </div>
            </div>` : ''}

            <!-- 教師からのコメント -->
            ${tc.length > 0 ? `
            <div class="bg-white rounded-2xl p-5 shadow-md border border-indigo-100 fade-in card-hover" style="animation-delay:0.4s">
                <h3 class="font-bold text-gray-800 mb-3">
                    <i class="fas fa-comment-dots text-indigo-500 mr-2"></i>先生からのコメント
                </h3>
                <div class="space-y-3">
                    ${tc.map(c => `
                    <div class="border border-indigo-100 rounded-xl p-4 bg-indigo-50">
                        <p class="text-sm text-gray-700 mb-2">${c.comments}</p>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            ${c.subject ? `<span><i class="fas fa-book mr-1"></i>${c.subject}</span>` : ''}
                            ${c.score != null ? `<span><i class="fas fa-star text-yellow-500 mr-1"></i>${c.score}/${c.max_score || 100}点</span>` : ''}
                            ${c.evaluated_at ? `<span>${new Date(c.evaluated_at).toLocaleDateString('ja-JP')}</span>` : ''}
                        </div>
                    </div>
                    `).join('')}
                </div>
            </div>` : ''}

            <!-- フッター -->
            <div class="bg-white rounded-2xl p-5 shadow-md border border-amber-100 fade-in text-center" style="animation-delay:0.45s">
                <p class="text-xs text-gray-500 mb-2">
                    <i class="fas fa-shield-alt text-amber-400 mr-1"></i>
                    このページはお子さまの学習データを安全に管理しています
                </p>
                <p class="text-xs text-gray-400">
                    自由進度学習支援システム &copy; 2026
                </p>
            </div>
        `
    }

    // 初期化
    loadDashboard()
    </script>
</body>
</html>
