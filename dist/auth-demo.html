<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認証システムデモ - JWT + RBAC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <!-- ヘッダー -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div>
                    <h1 class="text-4xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-shield-alt text-indigo-600 mr-3"></i>
                        認証・認可システムデモ
                    </h1>
                    <p class="text-gray-600">JWT + Role-Based Access Control (RBAC)</p>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/curriculum-problem-generator.html" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg hover:from-purple-700 hover:to-pink-700 transition-all font-semibold shadow-lg">
                        <i class="fas fa-brain mr-2"></i>
                        AI問題生成
                    </a>
                    <div id="userStatus" class="text-right">
                        <div id="loggedOutStatus" class="text-red-600">
                            <i class="fas fa-times-circle mr-2"></i>
                            ログアウト中
                        </div>
                        <div id="loggedInStatus" class="hidden text-green-600">
                            <i class="fas fa-check-circle mr-2"></i>
                            ログイン中
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 現在のユーザー情報 -->
        <div id="currentUserCard" class="hidden bg-white rounded-2xl shadow-xl p-8 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                <i class="fas fa-user-circle text-purple-600 mr-3"></i>
                現在のユーザー情報
            </h2>
            <div id="userInfoDisplay" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- ユーザー情報が表示されます -->
            </div>
            <div class="mt-6 flex gap-4 flex-wrap">
                <a href="/curriculum-problem-generator.html" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg hover:from-purple-700 hover:to-pink-700 transition-all font-semibold shadow-lg">
                    <i class="fas fa-brain mr-2"></i>
                    AI問題生成
                </a>
                <button onclick="logout()" class="px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-all">
                    <i class="fas fa-sign-out-alt mr-2"></i>
                    ログアウト
                </button>
                <button onclick="showChangePasswordModal()" class="px-6 py-3 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-all">
                    <i class="fas fa-key mr-2"></i>
                    パスワード変更
                </button>
            </div>
        </div>

        <!-- メインコンテンツ（タブ） -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-8">
            <!-- タブヘッダー -->
            <div class="flex border-b border-gray-200">
                <button onclick="switchTab('register')" id="tab-register" class="px-8 py-4 font-semibold text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all border-b-2 border-transparent">
                    <i class="fas fa-user-plus mr-2"></i>
                    ユーザー登録
                </button>
                <button onclick="switchTab('login')" id="tab-login" class="px-8 py-4 font-semibold text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all border-b-2 border-transparent">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    ログイン
                </button>
                <button onclick="switchTab('test')" id="tab-test" class="px-8 py-4 font-semibold text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 transition-all border-b-2 border-transparent">
                    <i class="fas fa-flask mr-2"></i>
                    アクセステスト
                </button>
            </div>

            <!-- タブコンテンツ -->
            <div class="p-8">
                <!-- ユーザー登録タブ -->
                <div id="content-register" class="hidden">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6">学生ユーザー登録</h3>
                    <form onsubmit="registerUser(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">氏名</label>
                            <input type="text" id="register-name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="山田 太郎">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">メールアドレス</label>
                            <input type="email" id="register-email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="taro@example.com">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">パスワード（8文字以上）</label>
                            <input type="password" id="register-password" required minlength="8" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">学年</label>
                            <select id="register-grade" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                <option value="">選択してください</option>
                                <option value="1">小学1年</option>
                                <option value="2">小学2年</option>
                                <option value="3">小学3年</option>
                                <option value="4">小学4年</option>
                                <option value="5">小学5年</option>
                                <option value="6">小学6年</option>
                                <option value="7">中学1年</option>
                                <option value="8">中学2年</option>
                                <option value="9">中学3年</option>
                                <option value="10">高校1年</option>
                                <option value="11">高校2年</option>
                                <option value="12">高校3年</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full px-6 py-4 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-all">
                            <i class="fas fa-user-plus mr-2"></i>
                            登録する
                        </button>
                    </form>
                </div>

                <!-- ログインタブ -->
                <div id="content-login" class="hidden">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6">ログイン</h3>
                    <form onsubmit="loginUser(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">ユーザータイプ</label>
                            <select id="login-usertype" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                <option value="student">学生</option>
                                <option value="teacher">教師</option>
                                <option value="parent">保護者</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">メールアドレス</label>
                            <input type="email" id="login-email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">パスワード</label>
                            <input type="password" id="login-password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>
                        <button type="submit" class="w-full px-6 py-4 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition-all">
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            ログイン
                        </button>
                    </form>
                    <div class="mt-6 p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg border-2 border-purple-200">
                        <p class="text-sm text-gray-700 mb-3">
                            <i class="fas fa-sparkles text-purple-600 mr-2"></i>
                            <strong>認証なしでも利用可能</strong>
                        </p>
                        <a href="/curriculum-problem-generator.html" class="inline-block w-full px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white text-center rounded-lg hover:from-purple-700 hover:to-pink-700 transition-all font-semibold shadow-lg">
                            <i class="fas fa-brain mr-2"></i>
                            AI問題生成ページへ
                        </a>
                    </div>
                </div>

                <!-- アクセステストタブ -->
                <div id="content-test" class="hidden">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6">ロールベースアクセステスト</h3>
                    <div class="space-y-4">
                        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4">
                            <p class="text-blue-800">
                                <i class="fas fa-info-circle mr-2"></i>
                                各エンドポイントは特定のロールまたはユーザータイプでのみアクセス可能です。
                            </p>
                        </div>

                        <button onclick="testEndpoint('/api/auth/me', 'GET', '現在のユーザー情報取得')" class="w-full px-6 py-4 bg-green-100 text-green-800 font-semibold rounded-lg hover:bg-green-200 transition-all text-left">
                            <i class="fas fa-user mr-3"></i>
                            <strong>現在のユーザー情報取得</strong> - 全ログインユーザー
                        </button>

                        <button onclick="testEndpoint('/api/admin/dashboard', 'GET', '管理者ダッシュボード')" class="w-full px-6 py-4 bg-red-100 text-red-800 font-semibold rounded-lg hover:bg-red-200 transition-all text-left">
                            <i class="fas fa-crown mr-3"></i>
                            <strong>管理者ダッシュボード</strong> - 管理者・教師のみ
                        </button>

                        <button onclick="testEndpoint('/api/student/progress', 'GET', '学生進捗')" class="w-full px-6 py-4 bg-purple-100 text-purple-800 font-semibold rounded-lg hover:bg-purple-200 transition-all text-left">
                            <i class="fas fa-chart-line mr-3"></i>
                            <strong>学生進捗</strong> - 学生のみ
                        </button>
                    </div>

                    <div id="testResults" class="mt-8">
                        <!-- テスト結果が表示されます -->
                    </div>
                </div>
            </div>
        </div>

        <!-- パスワード変更モーダル -->
        <div id="changePasswordModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                <h3 class="text-2xl font-bold text-gray-800 mb-6">パスワード変更</h3>
                <form onsubmit="changePassword(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">現在のパスワード</label>
                        <input type="password" id="current-password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">新しいパスワード（8文字以上）</label>
                        <input type="password" id="new-password" required minlength="8" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div class="flex gap-4">
                        <button type="submit" class="flex-1 px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-all">
                            変更
                        </button>
                        <button type="button" onclick="hideChangePasswordModal()" class="flex-1 px-6 py-3 bg-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-400 transition-all">
                            キャンセル
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let currentToken = null;

        // Axiosデフォルト設定
        axios.defaults.withCredentials = true;

        // タブ切り替え
        function switchTab(tabName) {
            ['register', 'login', 'test'].forEach(name => {
                document.getElementById(`tab-${name}`).classList.remove('text-indigo-600', 'bg-indigo-50', 'border-indigo-600');
                document.getElementById(`tab-${name}`).classList.add('text-gray-600', 'border-transparent');
                document.getElementById(`content-${name}`).classList.add('hidden');
            });

            document.getElementById(`tab-${tabName}`).classList.add('text-indigo-600', 'bg-indigo-50', 'border-indigo-600');
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
        }

        // ユーザー登録
        async function registerUser(event) {
            event.preventDefault();

            const data = {
                student_name: document.getElementById('register-name').value,
                email: document.getElementById('register-email').value,
                password: document.getElementById('register-password').value,
                grade_level: parseInt(document.getElementById('register-grade').value)
            };

            try {
                const response = await axios.post(`${API_BASE}/api/auth/register/student`, data);
                currentToken = response.data.token;
                alert('登録成功！自動的にログインしました。');
                await loadCurrentUser();
                event.target.reset();
            } catch (error) {
                alert(`登録失敗: ${error.response?.data?.error || error.message}`);
            }
        }

        // ログイン
        async function loginUser(event) {
            event.preventDefault();

            const data = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value,
                user_type: document.getElementById('login-usertype').value
            };

            try {
                const response = await axios.post(`${API_BASE}/api/auth/login`, data);
                currentToken = response.data.token;
                alert('ログイン成功！');
                await loadCurrentUser();
                event.target.reset();
            } catch (error) {
                alert(`ログイン失敗: ${error.response?.data?.error || error.message}`);
            }
        }

        // 現在のユーザー情報読み込み
        async function loadCurrentUser() {
            try {
                const response = await axios.get(`${API_BASE}/api/auth/me`, {
                    headers: currentToken ? { 'Authorization': `Bearer ${currentToken}` } : {}
                });

                const user = response.data.user;
                
                // ユーザー情報表示
                document.getElementById('userInfoDisplay').innerHTML = `
                    <div class="bg-indigo-50 p-4 rounded-lg">
                        <div class="text-sm text-gray-600 mb-1">ユーザーID</div>
                        <div class="text-lg font-semibold text-gray-800">${user.user_id}</div>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg">
                        <div class="text-sm text-gray-600 mb-1">氏名</div>
                        <div class="text-lg font-semibold text-gray-800">${user.name}</div>
                    </div>
                    <div class="bg-pink-50 p-4 rounded-lg">
                        <div class="text-sm text-gray-600 mb-1">メール</div>
                        <div class="text-lg font-semibold text-gray-800">${user.email}</div>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg">
                        <div class="text-sm text-gray-600 mb-1">ロール</div>
                        <div class="text-lg font-semibold text-gray-800">${user.role}</div>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <div class="text-sm text-gray-600 mb-1">ユーザータイプ</div>
                        <div class="text-lg font-semibold text-gray-800">${user.user_type}</div>
                    </div>
                    ${user.grade_level ? `
                    <div class="bg-yellow-50 p-4 rounded-lg">
                        <div class="text-sm text-gray-600 mb-1">学年</div>
                        <div class="text-lg font-semibold text-gray-800">${user.grade_level}年</div>
                    </div>
                    ` : ''}
                `;

                document.getElementById('currentUserCard').classList.remove('hidden');
                document.getElementById('loggedOutStatus').classList.add('hidden');
                document.getElementById('loggedInStatus').classList.remove('hidden');
            } catch (error) {
                document.getElementById('currentUserCard').classList.add('hidden');
                document.getElementById('loggedOutStatus').classList.remove('hidden');
                document.getElementById('loggedInStatus').classList.add('hidden');
            }
        }

        // ログアウト
        async function logout() {
            try {
                await axios.post(`${API_BASE}/api/auth/logout`, {}, {
                    headers: currentToken ? { 'Authorization': `Bearer ${currentToken}` } : {}
                });
                currentToken = null;
                alert('ログアウトしました');
                await loadCurrentUser();
            } catch (error) {
                alert(`ログアウト失敗: ${error.message}`);
            }
        }

        // エンドポイントテスト
        async function testEndpoint(endpoint, method, description) {
            const resultsDiv = document.getElementById('testResults');
            
            try {
                const response = await axios({
                    method,
                    url: `${API_BASE}${endpoint}`,
                    headers: currentToken ? { 'Authorization': `Bearer ${currentToken}` } : {}
                });

                resultsDiv.innerHTML = `
                    <div class="bg-green-50 border-l-4 border-green-500 p-6 rounded-lg">
                        <h4 class="text-lg font-bold text-green-800 mb-2">
                            <i class="fas fa-check-circle mr-2"></i>
                            成功: ${description}
                        </h4>
                        <pre class="bg-white p-4 rounded mt-4 overflow-x-auto text-sm">${JSON.stringify(response.data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="bg-red-50 border-l-4 border-red-500 p-6 rounded-lg">
                        <h4 class="text-lg font-bold text-red-800 mb-2">
                            <i class="fas fa-times-circle mr-2"></i>
                            失敗: ${description}
                        </h4>
                        <p class="text-red-700 mb-2">ステータス: ${error.response?.status}</p>
                        <pre class="bg-white p-4 rounded mt-4 overflow-x-auto text-sm">${JSON.stringify(error.response?.data || error.message, null, 2)}</pre>
                    </div>
                `;
            }
        }

        // パスワード変更モーダル
        function showChangePasswordModal() {
            document.getElementById('changePasswordModal').classList.remove('hidden');
        }

        function hideChangePasswordModal() {
            document.getElementById('changePasswordModal').classList.add('hidden');
        }

        async function changePassword(event) {
            event.preventDefault();

            const data = {
                current_password: document.getElementById('current-password').value,
                new_password: document.getElementById('new-password').value
            };

            try {
                await axios.post(`${API_BASE}/api/auth/change-password`, data, {
                    headers: currentToken ? { 'Authorization': `Bearer ${currentToken}` } : {}
                });
                alert('パスワードを変更しました');
                hideChangePasswordModal();
                event.target.reset();
            } catch (error) {
                alert(`パスワード変更失敗: ${error.response?.data?.error || error.message}`);
            }
        }

        // 初期化
        switchTab('register');
        loadCurrentUser();
    </script>
</body>
</html>
